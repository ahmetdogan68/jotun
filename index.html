<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAYDEMIR - PRODUCTS KOMPLE + JOTUN ONCELIK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}
.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:8px}
.header{background:#012060;color:white;padding:0 14px;height:72px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -8px 8px -8px}
.card{background:white;border-radius:10px;padding:10px;margin-top:8px;border:2px solid #012060}
.select-box{position:relative;display:flex;gap:6px}.select-box input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800;font-size:15px}
.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:white;border-radius:10px;max-height:70vh;overflow:auto;z-index:2000;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.3);border:2px solid #012060}
.item{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;cursor:pointer;align-items:center;gap:8px}
.item-kayitli{background:#fffbe6;border-left:5px solid #0a7a2f}
.badge{padding:1px 4px;border-radius:4px;font-size:8px;font-weight:900;color:white;margin-right:2px}.badge-base{background:#012060}.badge-lt{background:#ff9900;color:#111}.badge-pig{background:#0a7a2f}
.ralBoxKompakt{position:relative;display:flex;gap:6px;margin-top:6px;align-items:center}
.swatchKompakt{width:60px;min-width:60px;height:46px;border-radius:10px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900}
.bilgiKutu{flex:1;height:46px;border:2px solid #012060;border-radius:10px;background:white;display:flex;flex-direction:column;overflow:hidden}
.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst .esit{flex:1;display:flex;align-items:center;justify-content:center}.bilgiUst .esit:first-child{border-right:2px solid #012060}.bilgiUst .esit:last-child{background:#fffbe6}
.bilgiAlt{flex:1;display:flex}.bilgiAlt input{border:none;padding-left:6px;font-size:9px;font-weight:700;background:#f0f4ff;width:100%}
#ralDrop{position:absolute;top:54px;left:0;width:100%;max-width:460px;background:white;border-radius:10px;max-height:55vh;overflow:auto;z-index:99999;display:none;box-shadow:0 15px 40px rgba(0,0,0,0.5);border:2px solid #012060}
.ralItem{padding:8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.ralSw{width:28px;height:28px;border-radius:6px;border:1px solid #ddd;min-width:28px}
.s{padding:7px;border:2px solid #e5e5e5;border-radius:8px;width:100%;font-weight:700}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:5px}.amb{padding:12px;border:3px solid #e5e5e5;border-radius:10px;font-weight:900;text-align:center;cursor:pointer;background:white;font-size:13px}.amb.active{background:#012060;color:white;border-color:#ffcc00}
.result{background:#111;color:white;border-radius:10px;padding:10px;margin-top:8px}.big{font-size:18px;font-weight:900}
.settingsBtn{background:#ffcc00;border:none;width:18px;height:18px;border-radius:5px;font-weight:900;color:#012060;cursor:pointer;font-size:10px}
.settingsCol{display:flex;flex-direction:column;align-items:center;gap:2px}.kurAlt{font-size:12px;color:#ffcc00;font-weight:900;background:#000;padding:2px 8px;border-radius:6px;border:1px solid #ffcc00}
.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:white;z-index:99999;padding:12px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99998}
.searchBtn{background:#012060;color:white;border:none;border-radius:8px;padding:0 9px;font-weight:900;cursor:pointer;min-width:36px}
.formulBox{background:#222;border-radius:6px;padding:6px;margin-top:6px;font-size:10px;color:#ffcc00;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div style="font-weight:900;font-size:14px">BAYDEMİR - PRODUCTS 218 + JOTUN ÖNCELİK</div><div class="settingsCol"><button class="settingsBtn" onclick="openSettings()">⚙</button><div id="kurTxt" class="kurAlt">49.6802</div></div></div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel">
<h3>⚙️ AYARLAR</h3>
Kar %<input id="setKar" class="s" type="number" value="25" oninput="calc()"><br>Kdv %<input id="setKdv" class="s" type="number" value="20" oninput="calc()"><br>Dolar <input id="setDolar" class="s" value="49,6802" oninput="calc()">
<button onclick="saveSettings();closeSettings()" style="width:100%;padding:10px;background:#012060;color:white;border:none;border-radius:6px;font-weight:900;margin-top:10px">KAYDET KAPAT</button>
</div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">1 • RAL - <span id="ralSay">-</span></div><div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div><div class="bilgiKutu"><div class="bilgiUst"><div class="esit"><input id="ralInput" placeholder="9010" readonly onclick="enableRalSearch()" onfocus="openRal()" oninput="filterRal()" style="border:none;width:100%;text-align:center;font-weight:900;font-size:13px"></div><div class="esit"><input id="pigment" placeholder="0,00" style="border:none;background:transparent;width:100%;text-align:center;font-size:12px;font-weight:900" inputmode="decimal" oninput="calc()"><span style="font-weight:900;font-size:10px;color:#012060;padding-right:4px">TL</span></div></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL"></div></div><button class="searchBtn" onclick="enableRalSearch()">🔍</button><div id="ralDrop"></div></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">2 • ÜRÜN - <span id="canliSay">0</span> - ÖNCE JOTUN KAYIT, SONRA PRODUCTS.JSON 218 ÜRÜN</div><div class="select-box" style="margin-top:8px"><input id="urunInput" placeholder="Önce jotun_kayitlar.json, sonra products.json" readonly onclick="enableUrunSearch()" onfocus="openUrun()" oninput="filterUrun()"><button class="searchBtn" onclick="enableUrunSearch()">🔍</button><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:10px;margin-top:5px;display:none;font-weight:700"></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">3 • AMBALAJ - 3.6LT / 4.5LT / 18LT</div><div class="ambRow" id="ambList"></div></div>

<div class="result">
<div id="hesapDetay" style="font-size:10px;color:#aaa">5.70$ x 49.6802 + pigment/18</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;background:#1e1e1e;border-radius:8px;padding:10px">
<div><div style="font-size:9px;color:#888">LT MALİYET</div><div id="satisMaliyet" style="font-weight:900;font-size:14px">-</div><div style="font-size:8px;color:#aaa" id="maliyetFormul"></div></div>
<div><div style="font-size:9px;color:#888">LT SATIŞ %<span id="karGoster">25</span></div><div id="satisLtTL" style="font-weight:900;font-size:16px;color:#ffcc00">-</div><div style="font-size:8px;color:#aaa" id="pigmentLTGoster"></div></div>
<div><div style="font-size:9px;color:#888">KOVA SATIŞ</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:11px;font-weight:800">-</div></div>
</div>
<div class="formulBox" id="formulDetay"></div>
</div>
</div>

<script>
let urunler=[],ralList=[],ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"4.5L",lt:4.5},{ad:"18L",lt:18}];
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":25,"kdv":20,"dolar":"49,6802"}');
let secUrunIdx=null,secAmbIdx=2,secLT=18,secRalHex="#FFF",tempRalKod="9010",secRalName="",jotunKayitlar=[],seciliRalKayitlari=[];
function formatPara(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
function extractBaseNo(ad){let m=(ad||'').toUpperCase().match(/BASE\s*(\d+)/);return m?m[1]:null;}
async function fetchJsonTry(urls){for(let u of urls){try{let r=await fetch(u,{cache:"no-store"});if(r.ok){let txt=await r.text();txt=txt.replace(/"fiyat"\s*:\s*(\d+),(\d+)/g,'"fiyat": $1.$2');let j=JSON.parse(txt);if(j&&j.length>0)return {data:j};}}catch(e){}}return null;}
async function loadAll(){
let prodUrls=['./products.json?v='+Date.now()];let prodRes=await fetchJsonTry(prodUrls);
if(prodRes){urunler=prodRes.data.map(o=>{return [o.ad,parseFloat(o.fiyat)||0,o.lt||18,o.kategori||'']});}
document.getElementById('canliSay').innerText=urunler.length;
let ralUrls=['./ral.json?v='+Date.now()];let ralRes=await fetchJsonTry(ralUrls);if(ralRes){ralList=ralRes.data;document.getElementById('ralSay').innerText=ralList.length;}
let jotunUrls=['./jotun_kayitlar.json?v='+Date.now()+'_'+Math.random()];let jotunRes=await fetchJsonTry(jotunUrls);if(jotunRes){jotunKayitlar=jotunRes.data;}
document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;document.getElementById('setDolar').value=ayarlar.dolar;document.getElementById('kurTxt').innerText=ayarlar.dolar;
renderAmb();
}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||25;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));document.getElementById('kurTxt').innerText=ayarlar.dolar;calc();closeSettings();}
function enableUrunSearch(){let i=document.getElementById('urunInput');i.removeAttribute('readonly');i.focus();openUrun();}
function enableRalSearch(){let i=document.getElementById('ralInput');i.removeAttribute('readonly');i.focus();openRal();}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun();}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal();}
function filterUrun(){
let q=document.getElementById('urunInput').value.toUpperCase().trim();
let drop=document.getElementById('urunDrop');let html=[];
if(tempRalKod && jotunKayitlar.length>0){
let filtre=jotunKayitlar.filter(x=>String(x.ral_no).trim()===String(tempRalKod).trim());
let map=new Map();filtre.forEach(x=>{let k=x.product.trim()+"_"+x.ral_no;if(!map.has(k))map.set(k,x);});
seciliRalKayitlari=Array.from(map.values());
seciliRalKayitlari.forEach((k,ki)=>{
html.push(`<div class="item item-kayitli" onclick="selectUrunKayitliExact(${ki})"><div style="flex:1"><span class="badge badge-base">BASE ${k.base_no}</span><span class="badge badge-lt">${k.can_size}</span><span class="badge badge-pig">${k.colorant_cost} TL</span> <b>${k.product}</b> <small>- RAL ${k.ral_no} ${k.ral_isim} - ÖNCELİK KAYIT</small></div><div style="background:#0a7a2f;color:white;padding:3px 6px;border-radius:5px">SEÇ</div></div>`);
});
}
let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,500);
html.push(...list.map(o=>`<div class="item" onclick="selectUrun(${o.i})"><span style="flex:1">${o.r[0]} - ${o.r[2]}LT - ${o.r[3]||''}</span><b>$${o.r[1]}</b></div>`));
drop.innerHTML=html.join('');drop.style.display='block';
}
function selectUrunKayitliExact(ki){
let k=seciliRalKayitlari[ki];if(!k) return;
let uIdx=urunler.findIndex(u=>u[0].trim().toUpperCase()===(k.product||'').trim().toUpperCase());
if(uIdx!==-1)selectUrun(uIdx);else{urunler.push([k.product,0,18,'']);selectUrun(urunler.length-1);}
document.getElementById('pigment').value=k.colorant_cost||'';document.getElementById('ralForm').value=k.formul||'';calc();
}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];let inp=document.getElementById('urunInput');inp.value=u[0];inp.setAttribute('readonly','true');document.getElementById('urunDrop').style.display='none';document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerText=`✓ ${u[0]} • $${u[1]}/LT • ${u[2]}LT • ${u[3]||''}`;renderAmb();calc();inp.blur();}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let cls="amb";if(i===secAmbIdx)cls+=" active";return `<div class="${cls}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('');}
function filterRal(){if(!ralList||ralList.length===0)return;let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,120);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="selectRal('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div><b>${r.kod}</b> ${r.isim}</div></div>`).join('');document.getElementById('ralDrop').style.display='block';}
function selectRal(k){let r=ralList.find(x=>x.kod===k);if(!r)return;tempRalKod=r.kod;secRalHex=r.hex;secRalName=r.isim;let sw=document.getElementById('swatch');sw.style.background=r.hex;sw.innerText='RAL '+r.kod;let inp=document.getElementById('ralInput');inp.value=r.kod;inp.setAttribute('readonly','true');inp.blur();document.getElementById('ralDrop').style.display='none';filterUrun();openUrun();calc();}
function calc(){
if(secUrunIdx===null)return;
let u=urunler[secUrunIdx];
let urunFiyatDolar=parseFloat(u[1])||0;
let kovaLT=parseFloat(secLT)||18;
let kur=parseFloat((document.getElementById('setDolar').value||"49,6802").replace(',','.'))||49.6802;
let kar=parseFloat(document.getElementById('setKar').value)||25;
let kdv=parseFloat(document.getElementById('setKdv').value)||20;
let pigmentToplamTL=parseFloat((document.getElementById('pigment').value||"0").toString().replace(',','.'))||0;
let pigmentLTmaliyet=pigmentToplamTL/18;
let urunLTTL=urunFiyatDolar*kur;
let toplamLTmaliyet=urunLTTL+pigmentLTmaliyet;
let ltSatisTL=toplamLTmaliyet*(1+kar/100);
let kovaSatisTL=ltSatisTL*kovaLT;
let kovaKdvTL=kovaSatisTL*(1+kdv/100);
document.getElementById('satisMaliyet').innerText=formatPara(toplamLTmaliyet);
document.getElementById('maliyetFormul').innerText=urunFiyatDolar+'$ x '+kur+' + '+pigmentToplamTL+'/18';
document.getElementById('karGoster').innerText=kar;
document.getElementById('satisLtTL').innerText=formatPara(ltSatisTL);
document.getElementById('pigmentLTGoster').innerText='Pig: '+pigmentToplamTL+'/18='+formatPara(pigmentLTmaliyet)+' SABİT';
document.getElementById('satisKova').innerText=formatPara(kovaSatisTL);
document.getElementById('satisKovaKdv').innerText='KDV DAHİL: '+formatPara(kovaKdvTL);
document.getElementById('hesapDetay').innerText='Ürünler products.json komple '+urunler.length+' adet';
document.getElementById('formulDetay').innerHTML='<b>'+u[0]+'</b> '+urunFiyatDolar+'$ x '+kur.toFixed(4)+' = '+formatPara(urunLTTL)+' + Pigment '+formatPara(pigmentLTmaliyet)+' = <b>'+formatPara(toplamLTmaliyet)+' MALİYET</b> - Satış %'+kar+': '+formatPara(ltSatisTL);
}
loadAll();
document.addEventListener('click',e=>{if(!e.target.closest('.ralBoxKompakt')){let el=document.getElementById('ralDrop');if(el)el.style.display='none';}if(!e.target.closest('.select-box')){let u=document.getElementById('urunDrop');if(u)u.style.display='none';}});
</script>
</body>
</html>
