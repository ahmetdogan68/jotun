let secUrun=null,secAmb=2,secLT=18,secHex='#FFF',son=null,tempRal='',secName='',sepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');let sonHesap={};let secCompPair=null;
function fmt(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
function baseNo(a){let m=(a||'').toUpperCase().match(/BASE\s*(\d+)/);return m?m[1]:null}
function fam(a){let u=(a||'').toUpperCase().replace(/\s*\(.*?LT.*?\)/gi,'').trim();let mm=u.match(/(.+?BASE\s*\d+)/);if(mm)return mm[1].replace(/COMP.*/, '').trim();return u.substring(0,30)}
function ltNo(a){let m=(a||'').match(/\(([0-9.,]+)\s*LT\)/i);if(m)return parseFloat(m[1].replace(',','.'))||18;return 18}
function isCompA(s){return /COMP\.?\s*A/i.test(s||'')}
function isCompB(s){return /COMP\.?\s*B/i.test(s||'')}
function isComp(s){return isCompA(s)||isCompB(s)}
function trueLT(ad){
  let raw=ltNo(ad);
  let up=ad.toUpperCase();
  if(up.includes('FUTURA CLASSIC') && raw>=17.5) return 16.2;
  if(up.includes('FUTURA CLASSIC') && Math.abs(raw-2.0)<0.3) return 2.0;
  if(up.includes('FUTURA CLASSIC') && Math.abs(raw-0.5)<0.2) return 0.5;
  return raw;
}
function norm(s){let u=(s||'').toUpperCase();u=u.replace(/\(.*?LT.*?\)/gi,'');u=u.replace(/BASE\s*\d+/gi,'');u=u.replace(/COMP\.?\s*[AB]/gi,'');u=u.replace(/[^A-Z0-9 ]/g,' ');u=u.replace(/\s+/g,' ').trim();return u;}
function findCompPair(name){
  let up=name.toUpperCase().trim();
  let n=norm(name);
  if(!n) return null;
  let ltA=trueLT(name);
  let all=urunler.map((u,i)=>({ad:u[0],lt:trueLT(u[0]),i}));
  let sameFamily=all.filter(o=>{
    if(o.ad.toUpperCase().trim()===up) return false;
    let nn=norm(o.ad);
    return nn===n || nn.includes(n.split(' ').slice(0,2).join(' '));
  });
  let wantB=isCompA(name);
  let wantA=isCompB(name);
  let isBase=!isComp(name);
  let cands=sameFamily;
  if(wantB) cands=cands.filter(o=>isCompB(o.ad));
  else if(wantA) cands=cands.filter(o=>isCompA(o.ad));
  else if(isBase) cands=cands.filter(o=>isCompB(o.ad));
  if(cands.length===0) return null;
  cands.forEach(o=>{
    if(ltA>=10){
      if(Math.abs(o.lt-2.0)<0.3) o.score=0;
      else if(Math.abs(o.lt-0.5)<0.2) o.score=100;
      else o.score=Math.abs(o.lt-2.0)*10;
    }else{
      if(Math.abs(o.lt-0.5)<0.2) o.score=0;
      else if(Math.abs(o.lt-2.0)<0.3) o.score=100;
      else o.score=Math.abs(o.lt-0.5)*10;
    }
    if(norm(o.ad)===n) o.score-=1;
  });
  cands.sort((a,b)=>a.score-b.score);
  return cands[0];
}
function getRalHex(kod){
  if(!kod) return '#777';
  let r=ralList.find(x=>String(x.kod).trim()===String(kod).trim());
  return r?r.hex:'#777';
}
function getRalIsim(kod){
  let r=ralList.find(x=>String(x.kod).trim()===String(kod).trim());
  return r?r.isim:'';
}
function getContrast(hex){
  try{
    let c=hex.replace('#','');
    if(c.length===3) c=c.split('').map(x=>x+x).join('');
    let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
    let l=(0.299*r+0.587*g+0.114*b)/255;
    return l>0.6?'#111':'#fff';
  }catch(e){return '#fff'}
}
async function tryFetch(urls){for(let u of urls){try{let r=await fetch(u,{cache:'no-store'});if(r.ok){let t=await r.text();t=t.replace(/"fiyat"\s*:\s*(\d+),(\d+)/g,'"fiyat": $1.$2');let j=JSON.parse(t);if(j&&j.length>0)return {data:j};}}catch(e){}}return null}

  if(pr&&pr.data){let bl=pr.data.map(o=>({ad:(o.ad||'').trim(),fiyat:parseFloat(o.fiyat)||0}));bl.sort((a,b)=>a.ad.toUpperCase().localeCompare(b.ad.toUpperCase(),'tr'));urunler=bl.map(o=>[o.ad,o.fiyat]);}

  document.getElementById('setFirma').value=ayar.firmaAdi||'';document.getElementById('setFL').value=ayar.firmaLogo||'';document.getElementById('setJL').value=ayar.jotunLogo||'';document.getElementById('setKase').value=ayar.kaseLogo||'';document.getElementById('setAdres').value=ayar.firmaAdres||'';document.getElementById('setMail').value=ayar.firmaMail||'';document.getElementById('setWeb').value=ayar.firmaWeb||'';document.getElementById('setTel').value=ayar.telefon||'';document.getElementById('setBanka').value=ayar.firmaBanka||'';document.getElementById('setVeren').value=ayar.teklifVeren||'';
