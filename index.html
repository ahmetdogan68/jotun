<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAYDEMIR - FIYAT TEKLIF FORMU</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#012060}
.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:8px;padding-bottom:90px}
.header{background:#012060;color:#fff;padding:0 14px;height:72px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -8px 8px -8px}
.logoBay{height:56px;max-width:200px;background:#fff;border-radius:10px;padding:6px;object-fit:contain;border:3px solid #ffcc00}
.logoJotun{height:56px;max-width:160px;background:#fff;border-radius:12px;padding:6px;object-fit:contain;border:3px solid #ffcc00}
.card{background:#fff;border-radius:10px;padding:10px;margin-top:8px;border:2px solid #012060}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<div style="display:flex;gap:12px;align-items:center">
<img id="firmaLogo" src="" class="logoBay" style="display:none">
<div id="firmaYazi" style="font-weight:900;font-size:14px">BAYDEMIR</div>
</div>
<div style="display:flex;gap:12px;align-items:center">
<img id="headerJotunLogo" src="./jotun.png" class="logoJotun" onerror="this.style.display='none'">
<div class="settingsCol">
<button class="settingsBtn" onclick="openSettings()">⚙</button>
<div id="kurTxt" class="kurAlt">49.6802</div>
</div></div></div>


  <div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel">
<h3>⚙️ AYARLAR</h3>
<div style="margin-top:8px">Firma Adı<input id="setFirmaAdi" class="s" oninput="saveFirma()"></div>
<div style="margin-top:5px">Firma Logo URL<input id="setFirmaLogo" class="s" oninput="saveFirma()"></div>
<div style="margin-top:5px">Jotun Logo URL<input id="setJotunLogo" class="s" value="./jotun.png" oninput="saveFirma()"></div>
<div style="margin-top:5px">Telefon (WhatsApp)<input id="setTelefon" class="s" placeholder="05xx xxx xx xx" oninput="saveFirma()"></div>
<div style="margin-top:5px">Teklifi Veren<input id="setTeklifVeren" class="s" placeholder="İsim Soyisim" oninput="saveFirma()"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px">
<div>Kar %<input id="setKar" class="s" type="number" value="25" oninput="calc()"></div>
<div>KDV %<input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div></div>
<div style="margin-top:5px">Dolar<input id="setDolar" class="s" value="49,6802" oninput="calc()"></div>
<button onclick="fetchDolar()" style="margin-top:5px;width:100%;background:#0a7a2f;color:#fff;border:none;border-radius:6px;padding:8px;font-weight:800">🔄 DOLAR ÇEK</button>
<button onclick="saveSettings();closeSettings()" style="width:100%;padding:12px;background:#012060;color:#fff;border:none;border-radius:6px;font-weight:900;margin-top:10px">KAYDET KAPAT</button>
</div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">1 • RAL - <span id="ralSay">-</span></div>
<div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div>
<div class="bilgiKutu"><div class="bilgiUst">
<div class="esit"><input id="ralInput" placeholder="9010" readonly onclick="enableRalSearch()" onfocus="openRal()" style="border:none;width:100%;text-align:center;font-weight:900;font-size:13px"></div>
<div class="esit"><input id="pigment" placeholder="0,00" style="border:none;background:transparent;width:100%;text-align:center;font-size:12px;font-weight:900" inputmode="decimal" oninput="calc()"><span style="font-weight:900;font-size:10px;color:#012060;padding-right:4px">TL</span></div>
</div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL"></div></div>
<button class="searchBtn" onclick="enableRalSearch()">🔍</button><div id="ralDrop"></div></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">2 • ÜRÜN - <span id="canliSay">0</span></div>
<div class="select-box" style="margin-top:8px"><input id="urunInput" placeholder="Ürün ara" readonly onclick="enableUrunSearch()" onfocus="openUrun()" oninput="filterUrun()"><button class="searchBtn" onclick="enableUrunSearch()">🔍</button><div class="drop" id="urunDrop"></div></div>
<div id="urunDetay" style="font-size:10px;margin-top:5px;display:none;font-weight:700"></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">3 • AMBALAJ</div><div class="ambRow" id="ambList"></div></div>




  <div class="result">
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px;background:#1e1e1e;border-radius:8px;padding:10px">
<div><div style="font-size:9px;color:#888">LT MALİYET</div><div id="satisMaliyet" style="font-weight:900;font-size:14px;color:#fff">-</div></div>
<div><div style="font-size:9px;color:#888">LT SATIŞ</div><div id="satisLtTL" style="font-weight:900;font-size:16px;color:#ffcc00">-</div></div>
<div><div style="font-size:9px;color:#888">KOVA SATIŞ</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:11px;font-weight:800">-</div></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button onclick="teklifeEkle()" style="background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:12px;border-radius:10px;font-weight:900">➕ TEKLİFE EKLE</button>
<button onclick="kaydetHafiza()" style="background:#ffcc00;border:none;padding:12px;border-radius:10px;font-weight:900;color:#012060">💾 KAYDET</button>
</div>
</div>

<div class="card" style="background:#eef3ff">
<div style="display:flex;justify-content:space-between"><b style="font-size:11px">📋 TEKLİF (<span id="teklifSayi">0</span>)</b><button onclick="teklifTemizle()" style="background:#ff4444;color:#fff;border:none;border-radius:5px;padding:3px 6px;font-size:9px">TEMİZLE</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px">
<input id="musteriAd" class="s" placeholder="Müşteri Adı"><input id="teklifTarih" class="s" type="date"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px">
<input id="teklifTelefon" class="s" placeholder="Müşteri Tel"><input id="teklifVerenInput" class="s" placeholder="Teklifi Veren"></div>
<div style="display:grid;grid-template-columns:1fr auto;gap:5px;margin-top:5px">
<input id="firmaTelefon" class="s" placeholder="Firma WhatsApp No"><button onclick="whatsappGonder()" class="waBtn">💬 WhatsApp</button></div>
<div id="teklifList" style="margin-top:5px"></div>
<div id="teklifToplam" style="background:#012060;color:#fff;border-radius:6px;padding:6px;margin-top:5px;font-size:10px;display:none"></div>
<button onclick="teklifYazdir()" style="width:100%;margin-top:6px;background:#012060;color:#fff;border:none;border-radius:6px;padding:12px;font-weight:900">🖨️ FİYAT TEKLİF FORMU - YAZDIR / PDF</button>
</div>
</div>



  <script>
let urunler=[],ralList=[],ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"4.5L",lt:4.5},{ad:"18L",lt:18}];
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":25,"kdv":20,"dolar":"49,6802","firmaAdi":"BAYDEMIR BOYA","firmaLogo":"","jotunLogo":"./jotun.png","telefon":"","teklifVeren":""}');
let secUrunIdx=null,secAmbIdx=2,secLT=18,secRalHex="#FFF",sonHesap=null,tempRalKod="9010",secRalName="",jotunKayitlar=[],seciliRalKayitlari=[],teklifSepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');

function formatPara(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
function extractBaseNo(ad){let m=(ad||'').toUpperCase().match(/BASE\s*(\d+)/);return m?m[1]:null;}
function getBaseFamily(ad){let up=(ad||'').toUpperCase().replace(/\s*\(.*?LT.*?\)/gi,'').trim();let mm=up.match(/(.+?BASE\s*\d+)/);if(mm)return mm[1].replace(/COMP\.?\s*[AB].*/,'').trim();return up.replace(/COMP\.?\s*[AB].*/,'').trim().substring(0,30);}
function extractLT(ad){let m=(ad||'').match(/\(([0-9.,]+)\s*LT\)/i);if(m)return parseFloat(m[1].replace(',','.'))||18;return 18;}

async function fetchJsonTry(urls){for(let u of urls){try{let r=await fetch(u,{cache:"no-store"});if(r.ok){let txt=await r.text();txt=txt.replace(/"fiyat"\s*:\s*(\d+),(\d+)/g,'"fiyat": $1.$2');let j=JSON.parse(txt);if(j&&j.length>0)return {data:j};}}catch(e){}}return null;}

async function loadAll(){
let prodRes=await fetchJsonTry(['./products.json?v='+Date.now()]);
let baseListe=[];if(prodRes){baseListe=prodRes.data.map(o=>{return {ad:(o.ad||'').trim(),fiyat:parseFloat(o.fiyat)||0,lt:o.lt||extractLT(o.ad)||18};});}
baseListe.sort((a,b)=>a.ad.toUpperCase().localeCompare(b.ad.toUpperCase(),'tr'));
urunler=baseListe.map(o=>[o.ad,o.fiyat,o.lt]);document.getElementById('canliSay').innerText=urunler.length;
let ralRes=await fetchJsonTry(['./ral.json?v='+Date.now()]);if(ralRes){ralList=ralRes.data;document.getElementById('ralSay').innerText=ralList.length;}
let jotunRes=await fetchJsonTry(['./jotun_kayitlar.json?v='+Date.now()]);
if(jotunRes){jotunRes.data=jotunRes.data.map(k=>{let ltNum=parseInt(k.lt)||0;let prodLT=extractLT(k.product||'');if(ltNum==20||prodLT==20){k.lt=18;k.can_size='18L';if(k.product)k.product=k.product.replace(/\(20\s*LT\)/gi,'(18 LT)');}return k;});jotunKayitlar=jotunRes.data;}
document.getElementById('setFirmaAdi').value=ayarlar.firmaAdi||'';
document.getElementById('setFirmaLogo').value=ayarlar.firmaLogo||'';
document.getElementById('setJotunLogo').value=ayarlar.jotunLogo||'./jotun.png';
document.getElementById('setTelefon').value=ayarlar.telefon||'';
document.getElementById('setTeklifVeren').value=ayarlar.teklifVeren||'';
document.getElementById('firmaTelefon').value=ayarlar.telefon||'';
document.getElementById('teklifVerenInput').value=ayarlar.teklifVeren||'';
if(ayarlar.firmaLogo){document.getElementById('firmaLogo').src=ayarlar.firmaLogo;document.getElementById('firmaLogo').style.display='block';}
if(ayarlar.jotunLogo){document.getElementById('headerJotunLogo').src=ayarlar.jotunLogo;}
document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;
document.getElementById('setDolar').value=ayarlar.dolar;document.getElementById('kurTxt').innerText=ayarlar.dolar;
document.getElementById('teklifTarih').valueAsDate=new Date();renderAmb();renderTeklif();
}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveFirma(){ayarlar.firmaAdi=document.getElementById('setFirmaAdi').value;ayarlar.firmaLogo=document.getElementById('setFirmaLogo').value;ayarlar.jotunLogo=document.getElementById('setJotunLogo').value;ayarlar.telefon=document.getElementById('setTelefon').value;ayarlar.teklifVeren=document.getElementById('setTeklifVeren').value;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));document.getElementById('firmaTelefon').value=ayarlar.telefon;document.getElementById('teklifVerenInput').value=ayarlar.teklifVeren;}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||25;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim();saveFirma();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));document.getElementById('kurTxt').innerText=ayarlar.dolar;calc();closeSettings();}
async function fetchDolar(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();let kur=j.rates.TRY;if(kur){let s=kur.toFixed(4).replace('.',',');document.getElementById('setDolar').value=s;ayarlar.dolar=s;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));document.getElementById('kurTxt').innerText=s;calc();}}catch(e){}}


    function enableUrunSearch(){let i=document.getElementById('urunInput');i.removeAttribute('readonly');i.focus();openUrun();}
function enableRalSearch(){let i=document.getElementById('ralInput');i.removeAttribute('readonly');i.focus();openRal();}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun();}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal();}

function filterUrun(){
let q=document.getElementById('urunInput').value.toUpperCase().trim();
let drop=document.getElementById('urunDrop');let html=[];
if(tempRalKod&&jotunKayitlar.length>0){
let filtre=jotunKayitlar.filter(x=>String(x.ral_no).trim()===String(tempRalKod).trim());
let map=new Map();filtre.forEach(x=>{let k=(x.base_no||'')+"_"+(x.product||'').trim()+"_"+(x.ral_no||'');if(!map.has(k))map.set(k,x);});
seciliRalKayitlari=Array.from(map.values());
seciliRalKayitlari.forEach((k,ki)=>{
let baseNo=k.base_no||extractBaseNo(k.product);let au=null;
if(baseNo)au=urunler.find(u=>extractBaseNo(u[0])===String(baseNo)&&u[1]>0);
if(!au){let a=getBaseFamily(k.product);au=urunler.find(u=>getBaseFamily(u[0])===a&&u[1]>0);}
let f=au?`$${au[1]}`:"";
html.push(`<div class="item item-kayitli" onclick="selectUrunKayitliExact(${ki})"><div style="flex:1"><b>${k.product}</b> <small>${f} - RAL ${k.ral_no}</small></div><div style="background:#0a7a2f;color:#fff;padding:3px 6px;border-radius:5px">SEÇ</div></div>`);
});}
let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,500);
html.push(...list.map(o=>`<div class="item" onclick="selectUrun(${o.i})"><span style="flex:1">${o.r[0]}</span><b>$${o.r[1]}</b></div>`));
drop.innerHTML=html.join('');drop.style.display='block';}

function selectUrunKayitliExact(ki){
let k=seciliRalKayitlari[ki];if(!k)return;
let baseNo=k.base_no||extractBaseNo(k.product);let au=null;let fiyat=0;
if(baseNo){au=urunler.find(u=>extractBaseNo(u[0])===String(baseNo)&&u[1]>0);if(au)fiyat=au[1];}
if(!au){let a=getBaseFamily(k.product);au=urunler.find(u=>getBaseFamily(u[0])===a&&u[1]>0);if(au)fiyat=au[1];}
let uIdx=urunler.findIndex(u=>u[0].trim().toUpperCase()===(k.product||'').trim().toUpperCase());
if(uIdx!==-1)selectUrun(uIdx);else{urunler.push([k.product,fiyat,18]);selectUrun(urunler.length-1);}
document.getElementById('pigment').value=k.colorant_cost||'';document.getElementById('ralForm').value=k.formul||'';calc();}

function selectUrun(i){
secUrunIdx=i;let u=urunler[i];let inp=document.getElementById('urunInput');
inp.value=u[0];inp.setAttribute('readonly','true');document.getElementById('urunDrop').style.display='none';
document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerText=`✓ ${u[0]} • $${u[1]}`;renderAmb();calc();inp.blur();}

function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let cls="amb";if(i===secAmbIdx)cls+=" active";return `<div class="${cls}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('');}

function filterRal(){
if(!ralList||ralList.length===0)return;
let q=document.getElementById('ralInput').value.toUpperCase().trim();
let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,120);
document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="selectRal('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div><b>${r.kod}</b> ${r.isim}</div></div>`).join('');
document.getElementById('ralDrop').style.display='block';}

function selectRal(k){
let r=ralList.find(x=>x.kod===k);if(!r)return;
tempRalKod=r.kod;secRalHex=r.hex;secRalName=r.isim;
let sw=document.getElementById('swatch');sw.style.background=r.hex;sw.innerText='RAL '+r.kod;
let inp=document.getElementById('ralInput');inp.value=r.kod;inp.setAttribute('readonly','true');inp.blur();
document.getElementById('ralDrop').style.display='none';filterUrun();openUrun();calc();}

function calc(){
if(secUrunIdx===null)return;
let u=urunler[secUrunIdx];let urunFiyatDolar=parseFloat(u[1])||0;
let kovaLT=parseFloat(secLT)||18;
let kur=parseFloat((document.getElementById('setDolar').value||"49,6802").replace(',','.'))||49.6802;
let kar=parseFloat(document.getElementById('setKar').value)||25;
let kdv=parseFloat(document.getElementById('setKdv').value)||20;
let pigmentToplamTL=parseFloat((document.getElementById('pigment').value||"0").toString().replace(',','.'))||0;
let pigmentLTmaliyet=pigmentToplamTL/18;
let urunLTTL=urunFiyatDolar*kur;
let toplamLTmaliyet=urunLTTL+pigmentLTmaliyet;
let ltSatisTL=toplamLTmaliyet*(1+kar/100);
let kovaSatisTL=ltSatisTL*kovaLT;
let kovaKdvTL=kovaSatisTL*(1+kdv/100);
sonHesap={urun:u[0],ral:tempRalKod,hex:secRalHex,isim:secRalName,lt:kovaLT,kovaTl:kovaSatisTL,kovaKdv:kovaKdvTL,form:document.getElementById('ralForm').value};
document.getElementById('satisMaliyet').innerText=formatPara(toplamLTmaliyet);
document.getElementById('satisLtTL').innerText=formatPara(ltSatisTL);
document.getElementById('satisKova').innerText=formatPara(kovaSatisTL);
document.getElementById('satisKovaKdv').innerText='KDV DAHİL: '+formatPara(kovaKdvTL);}

function teklifeEkle(){if(!sonHesap)return alert('Önce seç');let adet=prompt('Kaç adet?','1');if(!adet)return;teklifSepet.push({...sonHesap,adet:parseInt(adet)||1});localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif();}
function renderTeklif(){
document.getElementById('teklifSayi').innerText=teklifSepet.length;
if(teklifSepet.length===0){document.getElementById('teklifList').innerHTML='<div style="font-size:9px;color:#999">Yok</div>';document.getElementById('teklifToplam').style.display='none';return}
let genel=0;
document.getElementById('teklifList').innerHTML=teklifSepet.map((t,i)=>{
let kova=t.kovaKdv||0;genel+=kova*t.adet;
return `<div style="display:flex;gap:6px;padding:8px;border:1px solid #ddd;border-radius:8px;margin-bottom:4px;background:#fff;align-items:center"><div style="width:24px;height:24px;background:${t.hex||'#fff'};border-radius:5px;border:1px solid #999"></div><div style="flex:1"><div style="font-weight:900;font-size:11px">${t.urun} - RAL ${t.ral}</div><div style="font-size:10px">Adet: ${t.adet} | ${formatPara(kova)}</div></div><button onclick="teklifSil(${i})" style="background:#ff4444;color:#fff;border:none;border-radius:6px;padding:6px 10px">❌</button></div>`;
}).join('');
document.getElementById('teklifToplam').style.display='block';document.getElementById('teklifToplam').innerText=`TOPLAM: ${formatPara(genel)}`;}

function teklifSil(i){teklifSepet.splice(i,1);localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif()}
function teklifTemizle(){if(confirm('Temizle?')){teklifSepet=[];localStorage.setItem('teklif_sepet','[]');renderTeklif()}}
function whatsappGonder(){
let tel=document.getElementById('firmaTelefon').value||ayarlar.telefon||'';if(!tel){alert('Telefon gir');return;}
let clean=tel.replace(/\D/g,'');if(clean.startsWith('0'))clean='90'+clean.substring(1);if(!clean.startsWith('90'))clean='90'+clean;
let musteri=document.getElementById('musteriAd').value||'Müşteri';
let text=`Merhaba ${musteri}, boya fiyat teklifiniz hazir. Toplam ${teklifSepet.length} kalem.`;
let url=`https://wa.me/${clean}?text=`+encodeURIComponent(text);window.open(url,'_blank');}



    function teklifYazdir(){
if(teklifSepet.length===0){alert('Boş');return;}
let musteri=document.getElementById('musteriAd').value||'Müşteri';
let musteriTel=document.getElementById('teklifTelefon').value||'';
let firmaTel=document.getElementById('firmaTelefon').value||ayarlar.telefon||'';
let veren=document.getElementById('teklifVerenInput').value||ayarlar.teklifVeren||'';
let tarih=document.getElementById('teklifTarih').value||new Date().toLocaleDateString('tr-TR');
let firma=ayarlar.firmaAdi||'BAYDEMIR BOYA';
let logo=ayarlar.firmaLogo||'';
let jotunLogo=ayarlar.jotunLogo||'./jotun.png';
let kdvOran=parseFloat(document.getElementById('setKdv').value)||20;
let toplamHaric=0,toplamDahil=0;
teklifSepet.forEach(t=>{toplamDahil+=t.kovaKdv*t.adet;toplamHaric+=t.kovaTl*t.adet;});
let kdvFark=toplamDahil-toplamHaric;
let rows=teklifSepet.map(t=>`
<tr>
<td style="text-align:center"><div style="width:26px;height:26px;background:${t.hex};border:1.5px solid #000;border-radius:5px;display:inline-block"></div><div style="font-size:9px;font-weight:900;margin-top:2px">RAL ${t.ral}</div></td>
<td><div style="font-weight:800;font-size:11px">${t.urun}</div><div style="font-size:9px;color:#555">${t.isim||''} ${t.form?('• '+t.form):''}</div></td>
<td style="text-align:center;font-weight:700">${t.adet} Adet</td>
<td style="text-align:right;font-weight:700">${formatPara(t.kovaKdv)}</td>
<td style="text-align:right;font-weight:900">${formatPara(t.kovaKdv*t.adet)}</td>
</tr>`).join('');

let html=`<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Fiyat Teklifi</title>
<style>
@page{size:A4 portrait;margin:12mm}*{box-sizing:border-box}body{font-family:Arial;margin:0;padding:0;color:#111;font-size:11px}
.page{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:12mm;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #012060;padding-bottom:10px}
.logos{display:flex;gap:12px;align-items:center}.logo{height:55px;background:#fff;border-radius:8px;padding:4px;border:2px solid #ffcc00;object-fit:contain}.logoJotun{height:55px;background:#fff;border-radius:8px;padding:4px;border:2px solid #012060;object-fit:contain}
.title{font-size:18px;font-weight:900;color:#012060}.subtitle{font-size:11px;color:#333;margin-top:2px}
.info{margin-top:12px;border:1.5px solid #012060;border-radius:8px;padding:10px;display:flex;justify-content:space-between;background:#f8f9fc}.info b{color:#012060}
table{width:100%;border-collapse:collapse;margin-top:14px}th{background:#012060;color:#fff;padding:9px 7px;text-align:left;font-size:10px}th:last-child,th:nth-child(4),th:nth-child(5){text-align:right}th:nth-child(3){text-align:center}
td{padding:9px 7px;border-bottom:1px solid #e0e0e0;vertical-align:middle}
.totals{margin-top:10px;display:flex;justify-content:flex-end}.totalsBox{width:260px;border:1.5px solid #012060;border-radius:8px;overflow:hidden}.totalsRow{display:flex;justify-content:space-between;padding:7px 10px;font-size:11px;border-bottom:1px solid #eee}.totalsRow.total{background:#012060;color:#fff;font-weight:900;font-size:13px}
.note{margin-top:12px;background:#fffbe6;border-left:4px solid #ffcc00;padding:8px 10px;border-radius:6px;font-size:9.5px;line-height:1.5;color:#333}
.sign{margin-top:auto;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:40px}.signBox{border-top:1.5px solid #111;padding-top:6px;text-align:center;font-size:10px}.signBox b{display:block;font-size:11px;margin-bottom:18px}
.footer{margin-top:10px;text-align:center;font-size:8.5px;color:#777;border-top:1px dashed #ccc;padding-top:6px}
@media print{body{background:#fff}.page{border:none;padding:0;margin:0;width:auto;min-height:auto}.no-print{display:none}}
</style></head><body>
<div class="page">
<div class="header">
<div class="logos">
${logo?`<img src="${logo}" class="logo">`:''}
<img src="${jotunLogo}" class="logoJotun" onerror="this.style.display='none'">
<div><div class="title">FİYAT TEKLİF FORMU</div><div class="subtitle">${firma} • Jotun Boya Sistemleri</div></div>
</div>
<div style="text-align:right"><div style="font-weight:900;font-size:12px">JOTUN</div><div style="font-size:10px">Tarih: ${tarih}</div></div>
</div>
<div class="info">
<div><b>Müşteri:</b> ${musteri}<br><b>Tel:</b> ${musteriTel||'-'}</div>
<div style="text-align:right"><b>Firma Tel / WhatsApp:</b> ${firmaTel||'-'}<br><b>Teklifi Veren:</b> ${veren||'-'}</div>
</div>
<table>
<thead><tr><th>RENK</th><th>ÜRÜN / FORMÜL</th><th>MİKTAR</th><th>BİRİM FİYAT</th><th>TOPLAM</th></tr></thead>
<tbody>${rows}</tbody>
</table>
<div class="totals">
<div class="totalsBox">
<div class="totalsRow"><span>Ara Toplam (KDV Hariç)</span><span>${formatPara(toplamHaric)}</span></div>
<div class="totalsRow"><span>KDV (%${kdvOran})</span><span>${formatPara(kdvFark)}</span></div>
<div class="totalsRow total"><span>GENEL TOPLAM KDV DAHİL</span><span>${formatPara(toplamDahil)}</span></div>
</div>
</div>
<div class="note">
<b>⚠️ Önemli Not:</b> Renk tonları; ekran, ışık ve yüzey farklılıkları nedeniyle değişiklik gösterebilir. Lütfen nihai renk kararınızı RAL kartelası ve/veya hazırlanacak numune üzerinden kontrol ediniz. Fiyatlarımız stok durumuna ve döviz kuruna bağlı olarak değişiklik gösterebilir. Teklif ${tarih} tarihinden itibaren 3 gün geçerlidir.<br>
<b>Uygulama önerisi:</b> En iyi sonuç için yüzeyi Jotun astar ile hazırlayınız ve teknik bültene uygun şekilde uygulayınız.
</div>
<div class="sign">
<div class="signBox"><b>Teklifi Veren</b><br>${veren}<br><br>İmza / Kaşe</div>
<div class="signBox"><b>Müşteri Onay</b><br>${musteri}<br><br>İmza</div>
</div>
<div class="footer">${firma} • Jotun Yetkili Satıcı • ${firmaTel?('Tel/WhatsApp: '+firmaTel+' • '):''} Bu belge bilgilendirme amaçlı fiyat teklif formudur. Renk teyidi için lütfen fiziksel RAL kartelasına bakınız.</div>
<div class="no-print" style="margin-top:15px;text-align:center;display:flex;gap:10px;justify-content:center">
<button onclick="window.print()" style="padding:12px 25px;background:#012060;color:#fff;border:none;border-radius:8px;font-weight:900">🖨️ YAZDIR / PDF AL - A4 Dikey</button>
<a href="https://wa.me/${firmaTel.replace(/\D/g,'').replace(/^0/,'90')}" target="_blank" style="padding:12px 20px;background:#25D366;color:#fff;border-radius:8px;font-weight:900;text-decoration:none">💬 WhatsApp'a Gönder</a>
<button onclick="window.close()" style="padding:12px 20px;background:#ccc;border:none;border-radius:8px">KAPAT</button>
</div>
</div>
</body></html>`;

let w=window.open('','_blank');w.document.write(html);w.document.close();
}
loadAll();
document.addEventListener('click',e=>{
if(!e.target.closest('.ralBoxKompakt')){let el=document.getElementById('ralDrop');if(el)el.style.display='none';}
if(!e.target.closest('.select-box')){let u=document.getElementById('urunDrop');if(u)u.style.display='none';}
});
document.getElementById('teklifVerenInput').addEventListener('input',function(){ayarlar.teklifVeren=this.value;document.getElementById('setTeklifVeren').value=this.value;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));});
document.getElementById('firmaTelefon').addEventListener('input',function(){ayarlar.telefon=this.value;document.getElementById('setTelefon').value=this.value;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));});

function kaydetHafiza(){
if(!sonHesap)return alert('Önce hesapla');
let kayit={
ral_no:sonHesap.ral,
product:sonHesap.urun,
base_no:extractBaseNo(sonHesap.urun),
lt:sonHesap.lt,
colorant_cost:document.getElementById('pigment').value,
formul:document.getElementById('ralForm').value
};
jotunKayitlar.push(kayit);
alert('Kaydedildi: '+kayit.ral_no+' - '+kayit.product);
}
</script>
</body>
</html>
