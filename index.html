<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BAYDEMIR - RAL 1 URUN 2 AMBALAJ 3 - FOCUS - YAZDIR</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:12px;padding-bottom:90px}.header{background:#012060;color:white;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;margin:0 -12px 10px -12px}.card{background:white;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative;overflow:visible;transition:box-shadow 0.3s, border-color 0.3s}.card.focused{box-shadow:0 0 0 3px #ff9900, 0 8px 20px rgba(0,0,0,0.2);border-color:#ff9900 !important}.select-box{position:relative;z-index:700;display:flex;gap:8px}.select-box input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:white;border-radius:12px;max-height:65vh;overflow:auto;z-index:9999;display:none;box-shadow:0 15px 40px rgba(0,0,0,0.4);border:2px solid #012060}.item{padding:12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;font-size:11px;cursor:pointer;background:white}.item.jcmKayitli{background:#fffbe6;border-left:5px solid #ff9900;border-bottom:2px solid #ff9900}.jcmBadgeUst{background:#ff9900;color:white;font-size:9px;font-weight:900;padding:3px 8px;border-radius:4px}.ralBoxKompakt{position:relative;display:flex;gap:8px;margin-top:8px}.swatchKompakt{width:100px;min-width:100px;height:62px;border-radius:10px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#012060;text-align:center}.bilgiKutu{flex:1;height:62px;border:2px solid #012060;border-radius:10px;background:white;display:flex;flex-direction:column;overflow:hidden}.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst input{border:none;text-align:center;font-size:14px;font-weight:900;padding:6px;flex:1}.bilgiUst input:first-child{flex:1;border-right:2px solid #012060}.bilgiUst .pigBox{flex:1;display:flex;align-items:center;background:#fffbe6}.pigBox.active{border:2px solid #ffcc00;background:#fff9c4}.bilgiAlt{flex:1;display:flex}.bilgiAlt input{border:none;padding-left:10px;font-size:13px;font-weight:700;background:#f0f4ff;width:100%}#ralDrop{position:absolute;top:70px;left:0;width:40%;background:white;border-radius:12px;max-height:50vh;overflow:auto;z-index:9999;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.35);border:2px solid #012060}.ralItem{padding:8px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.ralSw{width:36px;height:36px;border-radius:6px;border:1px solid #ddd}.s{padding:10px;border:2px solid #e5e5e5;border-radius:10px;width:100%;font-weight:700;font-size:13px}.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.amb{padding:14px;border:2px solid #e5e5e5;border-radius:10px;font-weight:800;text-align:center;cursor:pointer;background:white;font-size:13px}.amb.active{background:#012060;color:white;border-color:#012060}.result{background:#111;color:white;border-radius:16px;padding:14px;margin-top:10px}.big{font-size:22px;font-weight:900}.setInfo{background:#0a7a2f;color:white;border-radius:8px;padding:10px;margin-top:8px;font-size:11px;font-weight:700;display:none}@media(max-width:700px){.wrap{padding:4px}.header{height:52px}.card{padding:7px}.swatchKompakt{width:52px;min-width:52px;height:40px}.bilgiKutu{height:40px}#ralDrop{width:70%}.ambRow{grid-template-columns:1fr 1fr}}@media print{.noPrint{display:none !important} body{background:white} .wrap{background:white}}</style></head><body>
<div class="wrap"><div class="header"><div style="font-weight:900">BAYDEMİR - RAL 1 / URUN 2 / AMBALAJ 3 / FOCUS / YAZDIR</div><div id="kurTxt" style="font-size:10px;color:#ffcc00">TCMB: -</div></div>
<div class="card" id="card1" style="border:2px solid #012060"><div style="font-size:12px;font-weight:900;color:#012060">1 • RAL - RENK - <span id="jcmDurum" style="color:#ff9900;font-size:11px"></span></div><div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div><div class="bilgiKutu"><div class="bilgiUst"><input id="ralInput" placeholder="RAL KODU - 7021 yaz ENTER" onfocus="openRal();focusCard(1)" oninput="openRal()"><div class="pigBox" id="pigBox"><input id="pigment" placeholder="PIGMENT $" oninput="calc()" onfocus="focusCard(1)"></div></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL OTOMATIK"></div></div><div id="ralDrop"></div></div></div>
<div class="card" id="card2"><div style="display:flex;justify-content:space-between"><div style="font-size:12px;font-weight:900;color:#012060">2 • ÜRÜN - <span id="canliSay">0</span> - <span id="kaynak" style="color:#0a7a2f;font-size:10px"></span> - <span style="font-size:9px;color:#ff9900">KAYITLI ISE BASE ONCE - FOCUS OTOMATIK</span></div></div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="RAL sonrası otomatik buraya focus atar" onfocus="openUrun();focusCard(2)" oninput="openUrun()"><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div><div id="setInfo" class="setInfo"></div></div>
<div class="card" id="card3" style="border:2px solid #012060;background:#eef6ff"><div style="font-size:12px;font-weight:900;color:#012060">3 • AMBALAJ - <span id="ambSecili" style="font-size:10px">18L seçili</span> - <span style="font-size:9px;color:#ff9900">FOCUS OTOMATIK</span></div><div class="ambRow" id="ambList"></div></div>
<div class="result"><div id="hesapDetay" style="font-size:11px;color:#ccc">RAL seç -> ÜRÜN otomatik focus -> AMBALAJ otomatik focus</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;background:#1e1e1e;border-radius:10px;padding:12px"><div><div style="font-size:10px;color:#888">SATIŞ LT TL</div><div id="satisLtTL" style="font-weight:900">-</div><div id="formulDetay" style="font-size:9px;color:#aaa"></div></div><div><div style="font-size:10px;color:#888">KOVA KDV DAHİL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:13px"></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button id="btnTeklif" onclick="teklifeEkle()" style="background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:14px;border-radius:10px;font-weight:900">➕ TEKLİFE EKLE (ENTER)</button><button onclick="teklifYazdir()" style="background:white;color:#012060;padding:14px;border-radius:10px;font-weight:900">🖨️ YAZDIR / PDF - ÇALIŞIYOR</button></div></div>
<div class="card" style="background:#eef3ff;border:2px solid #012060"><div style="display:flex;justify-content:space-between"><b>📋 TEKLİF (<span id="teklifSayi">0</span>)</b><button onclick="teklifTemizle()" style="background:#ff4444;color:white;border:none;border-radius:8px;padding:6px 10px">TEMİZLE</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="musteriAd" class="s" placeholder="Müşteri"><input id="teklifTarih" class="s" type="date"></div><div id="teklifList" style="margin-top:8px"></div><div id="teklifToplam" style="background:#012060;color:white;border-radius:10px;padding:10px;margin-top:8px;display:none"></div></div>
</div>
<script>
let urunler=[],ralList=[],ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}];
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"kdv":20,"dolar":"49,58"}');
let secUrunIdx=null,secAmbIdx=2,secLT=18,secRalHex="#FFF",secRalName="",sonHesap=null,secUrunLT=18;
let teklifSepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');
let tempRalKod="",jotunKayitlar=JSON.parse(localStorage.getItem('jotun_kayitlar_v2')||'[]'),seciliRalKayitlari=[];
let YEDEK_URUN=[{"ad":"FUTURA CLASSIC BASE 1 COMP.A  (16,2 LT)","fiyat":7.25,"lt":16.2},{"ad":"FUTURA CLASSIC BASE 2 COMP.A  (16,2LT","fiyat":7.25,"lt":16.2},{"ad":"FUTURA CLASSIC BASE 3 COMP A (16.20 LT)","fiyat":6.8,"lt":16.2},{"ad":"HARDTOP AX BASE 1 A (14.4LT)","fiyat":6.5,"lt":14.4},{"ad":"BARRIER 65 COMP.A (7,2 LT)","fiyat":5.5,"lt":7.2}];
let YEDEK_RAL=[{kod:"7016",isim:"Antrasit Gri",hex:"#383E42"},{kod:"7021",isim:"Siyah Gri",hex:"#4D545B"},{kod:"9010",isim:"Saf Beyaz",hex:"#FFFFFF"}];
function focusCard(n){ document.querySelectorAll('.card').forEach(c=>c.classList.remove('focused')); let el=document.getElementById('card'+n); if(el){ el.classList.add('focused'); setTimeout(()=>{ el.classList.remove('focused'); }, 1800); } }
function baseNumAl(s){let m=s.match(/BASE\s*([1-3])/i);if(m)return m[1];return'1';}
function ralSecildi(k){tempRalKod=k;seciliRalKayitlari=jotunKayitlar.filter(x=>x.ral_no==k);let d=document.getElementById('jcmDurum');if(d){d.innerText=seciliRalKayitlari.length>0?'KAYITLI '+seciliRalKayitlari.length+' BASE '+seciliRalKayitlari.map(x=>x.base_no).join(',')+' ÜSTTE ✓':'KAYIT YOK';} filterUrun();}
function formatPara(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
async function loadAll(){let base=YEDEK_URUN;try{let r=await fetch('./products.json?v='+Date.now());if(r.ok){let j=await r.json(); if(j.length>0) base=j; document.getElementById('kaynak').innerText="products.json ✓ "+j.length;}}catch(e){} base.sort((a,b)=>a.ad.localeCompare(b.ad,'tr')); urunler=base.map(o=>[o.ad,o.fiyat||0,o.lt||0]); document.getElementById('canliSay').innerText=urunler.length; try{let r=await fetch('https://ahmetdogan68.github.io/ral/ral.json'); if(r.ok) ralList=await r.json();}catch(e){} if(!ralList||ralList.length==0) ralList=YEDEK_RAL; document.getElementById('teklifTarih').valueAsDate=new Date(); filterUrun(); renderAmb(); renderTeklif(); fetchDolar();}
async function fetchDolar(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();let k=j.rates.TRY;if(k){document.getElementById('kurTxt').innerText="TCMB: "+k.toFixed(2); calc();}}catch(e){}}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun();}
function filterUrun(){let q=document.getElementById('urunInput').value.toUpperCase().trim();let drop=document.getElementById('urunDrop');let html=[]; if(seciliRalKayitlari.length>0){html.push('<div style="background:#ff9900;color:white;padding:8px;font-weight:900;font-size:11px">⭐ RAL '+tempRalKod+' KAYITLI BASE '+seciliRalKayitlari.map(k=>k.base_no).join(',')+' ÜSTTE</div>'); seciliRalKayitlari.forEach(k=>{let uygun=urunler.filter(u=>baseNumAl(u[0])==k.base_no).slice(0,15); uygun.forEach(u=>{let i=urunler.indexOf(u); html.push('<div class="item jcmKayitli" onclick="selectUrunKayitli('+i+',\''+k.ral_no+'\',\''+k.base_no+'\')"><div>'+u[0]+' <span class="jcmBadgeUst">RAL '+k.ral_no+' BASE '+k.base_no+' ÖNCE</span><br><small>'+k.formul+'</small></div></div>');});}); html.push('<div style="background:#eee;padding:6px;font-size:10px">--- DİĞER ÜRÜNLER ---</div>');} let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,60); html.push(...list.map(o=>'<div class="item" onclick="selectUrun('+o.i+')"><div>'+o.r[0]+'<br><small>'+o.r[2]+'LT $'+o.r[1]+'</small></div></div>')); drop.innerHTML=html.join(''); drop.style.display='block';}
function selectUrunKayitli(i,ral,base){selectUrun(i);let k=jotunKayitlar.find(x=>x.ral_no==ral&&x.base_no==base); if(k){document.getElementById('pigment').value=k.colorant_cost; document.getElementById('ralForm').value=k.formul; calc();}}
function selectUrun(i){ secUrunIdx=i;let u=urunler[i]; document.getElementById('urunInput').value=u[0]; document.getElementById('urunDrop').style.display='none'; secUrunLT=parseFloat(u[2])||18; let idx=ambalajlar.findIndex(a=>a.lt>=secUrunLT-0.2); if(idx===-1) idx=2; secAmbIdx=idx; secLT=ambalajlar[idx].lt; document.getElementById('urunDetay').style.display='block'; document.getElementById('urunDetay').innerHTML='✓ '+u[0]; renderAmb(); calc(); setTimeout(()=>{ let card3=document.getElementById('card3'); if(card3){ card3.scrollIntoView({behavior:'smooth', block:'center'}); card3.classList.add('focused'); setTimeout(()=>card3.classList.remove('focused'), 1800); } let pig=document.getElementById('pigment'); if(pig){ pig.focus(); pig.select(); document.getElementById('pigBox').classList.add('active'); } }, 200); }
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let cls="amb"; if(i===secAmbIdx) cls+=" active"; return '<div class="'+cls+'" onclick="selectAmb('+i+')">'+a.ad+'</div>';}).join(''); document.getElementById('ambSecili').innerText=ambalajlar[secAmbIdx].ad+' seçili';}
function selectAmb(i){secAmbIdx=i; secLT=ambalajlar[i].lt; renderAmb(); calc(); setTimeout(()=>{ let btn=document.getElementById('btnTeklif'); if(btn){ btn.focus(); } }, 100); }
function openRal(){document.getElementById('ralDrop').style.display='block'; filterRal(); focusCard(1);}
function filterRal(){let q=document.getElementById('ralInput').value.toUpperCase().trim(); if(q.length===4 && /^\d{4}$/.test(q)){ let ex=ralList.find(r=>r.kod===q); if(ex){ selectRal(q); return; } } let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,100); document.getElementById('ralDrop').innerHTML=list.map(r=>'<div class="ralItem" onclick="selectRal(\''+r.kod+'\')"><div class="ralSw" style="background:'+r.hex+'"></div><div><b>RAL '+r.kod+'</b><br><small>'+r.isim+'</small></div></div>').join(''); document.getElementById('ralDrop').style.display='block';}
function selectRal(k){ let r=ralList.find(x=>x.kod===k); if(!r) return; tempRalKod=r.kod; secRalHex=r.hex; secRalName=r.isim; let sw=document.getElementById('swatch'); sw.style.background=r.hex; sw.innerText='RAL '+r.kod; document.getElementById('ralInput').value=r.kod; document.getElementById('ralDrop').style.display='none'; calc(); ralSecildi(k); setTimeout(()=>{ let card2=document.getElementById('card2'); if(card2){ card2.scrollIntoView({behavior:'smooth', block:'center'}); card2.classList.add('focused'); setTimeout(()=>card2.classList.remove('focused'), 1800); } let uInput=document.getElementById('urunInput'); if(uInput){ uInput.focus(); uInput.select(); openUrun(); } }, 180); }
function calc(){if(secUrunIdx===null) return; let pig=parseFloat((document.getElementById('pigment').value||"0").replace(',','.'))||0; let u=urunler[secUrunIdx]; let urunFiyat=parseFloat(u[1])||0; let urunLT=secUrunLT||18; let kovaLT=secLT||18; let toplam=(urunFiyat*urunLT)+pig; let maliyet=toplam/kovaLT; let kar=ayarlar.kar||30; let satisDolar=maliyet*(1+kar/100); let kur=49.58; let satisTl=satisDolar*kur; let kovaTl=satisTl*kovaLT; let kdv=ayarlar.kdv||20; let kovaKdv=kovaTl*(1+kdv/100); sonHesap={urun:u[0],ral:tempRalKod,hex:secRalHex,isim:secRalName,lt:kovaLT,pigment:pig,satisTlLt:satisTl,kovaTl:kovaTl,kovaKdv:kovaKdv,form:document.getElementById('ralForm').value,birimFiyat:urunFiyat}; document.getElementById('satisLtTL').innerText=formatPara(satisTl); document.getElementById('satisKova').innerText=formatPara(kovaTl); document.getElementById('satisKovaKdv').innerText='KDV DAHİL: '+formatPara(kovaKdv); document.getElementById('formulDetay').innerText='$'+urunFiyat+' x '+urunLT+'LT + $'+pig; document.getElementById('hesapDetay').innerHTML='<b>RAL '+tempRalKod+'</b> • BASE '+baseNumAl(u[0])+' • FOCUS AKTIF';}
function teklifeEkle(){if(!sonHesap){alert('Önce RAL ve ÜRÜN seç'); return;} let adet=prompt('Kaç kova?','1'); if(!adet) return; teklifSepet.push({...sonHesap,adet:parseInt(adet)||1}); localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet)); renderTeklif();}
function renderTeklif(){document.getElementById('teklifSayi').innerText=teklifSepet.length; if(teklifSepet.length==0){document.getElementById('teklifList').innerHTML='<div style="color:#999;padding:8px">Henüz yok</div>'; document.getElementById('teklifToplam').style.display='none'; return;} let t1=0,t2=0; document.getElementById('teklifList').innerHTML=teklifSepet.map((t,i)=>{t1+=t.kovaTl*t.adet; t2+=t.kovaKdv*t.adet; return '<div style="display:flex;gap:10px;padding:10px;border-bottom:1px dashed #ddd;align-items:center"><div style="width:30px;height:30px;background:'+t.hex+';border-radius:6px;border:1px solid #000"></div><div style="flex:1;font-size:12px"><b>'+t.urun+'</b><br>RAL '+t.ral+' x '+t.adet+'</div><button onclick="teklifSil('+i+')" style="background:#fdd;border:none;padding:6px">❌</button></div>';}).join(''); document.getElementById('teklifToplam').style.display='block'; document.getElementById('teklifToplam').innerHTML='TOPLAM: '+formatPara(t1)+'<br>GENEL: '+formatPara(t2);}
function teklifSil(i){teklifSepet.splice(i,1); localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet)); renderTeklif();}
function teklifTemizle(){if(confirm('Temizle?')){teklifSepet=[]; localStorage.setItem('teklif_sepet','[]'); renderTeklif();}}
function teklifYazdir(){let musteri=document.getElementById('musteriAd').value||'Müşteri'; let tarih=document.getElementById('teklifTarih').value||new Date().toLocaleDateString('tr-TR'); if(teklifSepet.length==0){alert('Boş');return;} let toplam=0,genel=0; teklifSepet.forEach(t=>{toplam+=t.kovaTl*t.adet; genel+=t.kovaKdv*t.adet;}); let rows=teklifSepet.map(t=>`<tr><td style="padding:8px;border:1px solid #ccc;text-align:center"><div style="width:16px;height:16px;background:${t.hex};border:1px solid #000;display:inline-block"></div></td><td style="padding:8px;border:1px solid #ccc;font-size:12px"><b>${t.urun}</b><br>RAL ${t.ral} - ${t.lt}LT - ${t.form||''}</td><td style="padding:8px;border:1px solid #ccc;text-align:center">${t.adet}</td><td style="padding:8px;border:1px solid #ccc;text-align:right">${formatPara(t.kovaTl)}</td><td style="padding:8px;border:1px solid #ccc;text-align:right;font-weight:900">${formatPara(t.kovaTl*t.adet)}</td><td style="padding:8px;border:1px solid #ccc;text-align:right">${formatPara(t.kovaKdv*t.adet)}</td></tr>`).join(''); let html=`<div style="font-family:Arial;padding:20px;max-width:800px;margin:0 auto"><h2 style="color:#012060">BAYDEMİR YAPI MARKET - TEKLİF</h2><div>Müşteri: <b>${musteri}</b> - ${tarih}</div><table style="width:100%;border-collapse:collapse;margin-top:15px"><thead><tr style="background:#012060;color:white"><th style="padding:8px">RENK</th><th>ÜRÜN</th><th>ADET</th><th>BİRİM</th><th>TOPLAM</th><th>KDV DAHİL</th></tr></thead><tbody>${rows}</tbody><tfoot><tr style="background:#eee;font-weight:900"><td colspan="4" style="padding:10px;border:1px solid #ccc;text-align:right">TOPLAM</td><td style="padding:10px;border:1px solid #ccc;text-align:right">${formatPara(toplam)}</td><td style="padding:10px;border:1px solid #ccc;text-align:right">${formatPara(genel)}</td></tr></tfoot></table></div>`; let w=window.open('','_blank','width=900,height=800'); w.document.write('<html><head><title>Teklif</title></head><body>'+html+'<div style="text-align:center;margin-top:20px"><button onclick="window.print()" style="padding:12px 30px;background:#012060;color:white;border:none;border-radius:8px;font-weight:900">🖨️ YAZDIR / PDF</button></div></body></html>'); w.document.close();}
loadAll();
document.addEventListener('click',e=>{if(!e.target.closest('.ralBoxKompakt')){let el=document.getElementById('ralDrop'); if(el) el.style.display='none';} if(!e.target.closest('.select-box')){let u=document.getElementById('urunDrop'); if(u) u.style.display='none';}});
</script></body></html>
