<!-- ===== PIGMENT KILIDI + FIYAT ALT SATIRDAN YAMASI - MEVCUT DOSYANA DOKUNMA, SADECE BUNU EN ALTA </body>'den ÖNCE YAPIŞTIR ===== -->
<script>
(function(){
  // 1) PIGMENT KILIDI - localStorage'da RAL -> pigment, bir kere yazilir degismez
  function kilitOku(){ try{ return JSON.parse(localStorage.getItem('jotun_pigment_kilit')||'{}') }catch(e){ return {} } }
  function kilitYaz(o){ localStorage.setItem('jotun_pigment_kilit', JSON.stringify(o)) }
  function kilitVar(ral){ let m=kilitOku(); return m[String(ral||'').trim()]||null }

  // Eski kayitlardaki pigmenti bir kerelik kilide tasi
  try{
    let m=kilitOku(); let deg=false;
    (kayitlar||[]).forEach(function(k){ let rk=String(k.ral_no||'').trim(); if(rk && k.colorant_cost && !m[rk]){ let v=parseFloat(String(k.colorant_cost).replace(/\./g,'').replace(',','.'))||0; if(v>0){ m[rk]={pigment:v, tarih:new Date().toISOString()}; deg=true; } } });
    if(deg) kilitYaz(m);
  }catch(e){}

  // 2) ORIJINAL FONKSIYONLARI SAKLA
  var _origSelectRal = window.selectRal;
  var _origSelectKayit = window.selectKayit;
  var _origSelectSik = window.selectSik;
  var _origKaydet = window.kaydet;
  var _origCalc = window.calc;
  var _origFilterUrun = window.filterUrun;

  // 3) FIYAT: ALT SATIRDA YAZAN YERDEN AL
  // Senin resimdeki alt satir = #urunDetay icindeki "$7" veya dropdown'daki "$7"
  // Biz fiyati urunler listesinden degil, secilen satirdaki gercek yazidan okuyoruz
  function altSatirdanFiyatOku(){
    // a) urunDetay'daki $... yazisi
    var d=document.getElementById('urunDetay');
    if(d && d.innerText){
      var m=d.innerText.match(/\$\s*([\d.,]+)/);
      if(m) return parseFloat(m[1].replace(',','.'))||0;
    }
    // b) urunInput'un yanindaki secili satir
    return 0;
  }
  // calc icinde kullanilacak global: son secilen urunun gercek fiyati
  window.__secilenFiyat = 0;

  // 4) RAL SECILINCE -> pigmenti kilitten doldur, kilitliyse kutuyu kilitle
  window.selectRal = function(k){
    _origSelectRal(k);
    setTimeout(function(){
      var kilit=kilitVar(k);
      var pig=document.getElementById('pigment');
      var durum=document.getElementById('pigmentDurum');
      if(kilit && pig){
        pig.value=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(kilit.pigment);
        pig.setAttribute('readonly','true');
        pig.style.background='rgba(0,200,83,.08)';
      } else if(pig){
        // kilit yoksa bos birak, kullanici ilk kez yazacak - ama eski kayittaki pigment varsa onu koy
        if(!pig.value || pig.value==='0,00' || pig.value==='0'){
          var eski=(kayitlar||[]).find(function(x){ return String(x.ral_no).trim()===String(k).trim() && x.colorant_cost });
          if(eski) pig.value=eski.colorant_cost;
        }
        pig.removeAttribute('readonly');
        pig.style.background='transparent';
      }
      if(window.calc) window.calc();
    },50);
  };

  // 5) URUN SECILINCE -> fiyati ALT SATIRDAN al, urunler listesine de yaz ki calc dogru alsin
  // selectUrun orijinali zaten urunDetay'a "$fiyat" yaziyor, biz calc'i yamaliyoruz
  window.calc = function(){
    if(secUrun!==null && typeof urunler!=='undefined' && urunler[secUrun]){
      // Alt satirdaki fiyati oku
      var alt=altSatirdanFiyatOku();
      if(alt>0){
        urunler[secUrun][1]=alt;
        window.__secilenFiyat=alt;
      } else if(window.__secilenFiyat>0){
        urunler[secUrun][1]=window.__secilenFiyat;
      }
      // Eger hala 0 ise: dropdown'daki secili satirdaki fiyati dene
      if(!urunler[secUrun][1] || urunler[secUrun][1]==0){
        // findExactPrice ile products.json'dan dene, yoksa 0 birakma - kullaniciya goster
        var live=null;
        try{ live=findExactPrice(urunler[secUrun][0]); }catch(e){}
        if(live && live>0) urunler[secUrun][1]=live;
      }
    }
    // Pigment kilitliyse, input'taki pigmenti kilitli degerle ez (degistirilemesin)
    var kilit=tempRal ? kilitVar(tempRal) : null;
    if(kilit){
      var pig=document.getElementById('pigment');
      if(pig) pig.value=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(kilit.pigment);
    }
    return _origCalc();
  };

  // 6) KAYDET -> pigmenti ilk seferde kilitle, kayda FIYAT yazma
  window.kaydet = async function(){
    if(!son) return alert('Once sec');
    var pigVal=document.getElementById('pigment').value||'0';
    var pigNum=parseFloat(String(pigVal).replace(/\./g,'').replace(',','.'))||0;
    var ralKod=son.ral||tempRal;
    var kilit=kilitVar(ralKod);
    if(!kilit){
      if(pigNum<=0){ if(!confirm('Pigment 0 görünüyor, 0 olarak kilitlensin mi?')) return; }
      var m=kilitOku(); m[String(ralKod).trim()]={pigment:pigNum, tarih:new Date().toISOString()}; kilitYaz(m);
      alert('🔒 Pigment kilitlendi: RAL '+ralKod+' = '+pigVal+' TL - Artik degismez. Baz fiyati her zaman guncelden alinacak.');
    } else {
      // Kilitliyse kayda kilitli pigmenti yaz
      document.getElementById('pigment').value=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(kilit.pigment);
    }
    return _origKaydet();
  };

  // 7) URUN LISTESINDE $0 - ESKI KAYIT GOSTERME
  window.filterUrun = function(){
    _origFilterUrun();
    // Dropdown icindeki "$0 - ESKI KAYIT" yazilarini duzelt
    setTimeout(function(){
      document.querySelectorAll('#urunDrop .it').forEach(function(el){
        var t=el.innerText||'';
        if(t.includes('$0 - ESKI KAYIT') || t.includes('$0 - ESKİ KAYIT')){
          // Bu satirin urun adini bul, guncel fiyati bul
          var urunAd=(el.querySelector('b')||{}).innerText||'';
          var live=null;
          try{ live=findExactPrice(urunAd); }catch(e){}
          // Alt satirdaki fiyati da dene
          if(!live || live<=0){
            var m=t.match(/\$\s*([\d.,]+)/);
            if(m) live=parseFloat(m[1].replace(',','.'))||0;
          }
          if(live && live>0){
            el.innerHTML=el.innerHTML.replace(/\$0 - ESKİ KAYIT/g,'$'+live+' (GÜNCEL)').replace(/\$0 - ESKI KAYIT/g,'$'+live+' (GÜNCEL)');
          } else {
            el.innerHTML=el.innerHTML.replace(/\$0 - ESKİ KAYIT/g,'⚠ FİYAT ALT SATIRDAN ALINACAK').replace(/\$0 - ESKI KAYIT/g,'⚠ FİYAT ALT SATIRDAN ALINACAK');
          }
        }
      });
    },30);
  };

  // 8) SIK secilince de pigment kilitten gelsin
  window.selectSik = function(i){
    _origSelectSik(i);
    setTimeout(function(){
      var k=(bulutCache.length>0?bulutCache:JSON.parse(localStorage.getItem('jotun_kayitlar_extra')||'[]'))[i];
      if(k){
        var kilit=kilitVar(k.ral_no);
        if(kilit){ document.getElementById('pigment').value=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(kilit.pigment); }
        if(window.calc) window.calc();
      }
    },80);
  };

  console.log('✅ Yama yüklendi: pigment kilidi + fiyat alt satirdan');
})();
</script>
