  }).join('');
  if(extra.length<8){
    html+=Array(8-extra.length).fill(0).map((_,i)=>`<div class="sikCard" style="border:1px dashed #bbb;background:#fff"><div class="sikTop"><div style="width:14px;height:14px;border:1px dashed #bbb;border-radius:3px"></div><div class="sikRal" style="color:#aaa;font-size:8px">${extra.length+i+1}. Boş</div></div><div class="sikBody" style="background:#eee;color:#999;font-size:5px">BOŞ</div></div>`).join('');

rror="this.style.display='none'"><div style='font-size:10px;font-weight:900;margin-top:4px'>Tarih: ${tarih}</div></div></div><div class='titleCenter'><b>FİYAT TEKLİF FORMU</b></div><div class='musteriBox'><b>Musteri: ${must}</b> Tel: ${mustTel} Adres: ${mustAdres}</div><table><thead><tr><th>RENK</th><th>ÜRÜN</th><th>MİKTAR</th><th>BİRİM</th><th>TOPLAM</th></tr></thead><tbody>${rows}</tbody></table><div class='totals'><div class='box'><div class='row'><span>Ara Toplam</span><span>${fmt(haric)}</span></div><div class='row'><span>KDV (%${kdvO})</span><span>${fmt(fark)}</span></div><div class='row total'><span>GENEL TOPLAM</span><span>${fmt(dahil)}</span></div></div></div><div class='noteFull'><b>NOT:</b> Renk tonları farklılık gosterebilir. Fiyatlar ${tarih} tarihli kurlara goredir.</div><div class='contactFull'><b>BANKA:</b> ${fBanka}</div><div class='signRow'><div class='signBox'><b>Teklifi Veren</b><br>${veren}${kaseHtml}<br>Kaşe / İmza</div><div class='signBox'><b>Müşteri Onay</b><br>${must}<br><br><br>Kaşe / İmza</div></div><div class='no-print'><button onclick='window.print()' style='padding:10px 20px;background:#012060;color:#fff;border:none;border-radius:5px;font-weight:900;cursor:pointer'>YAZDIR / PDF</button><button onclick='window.close()' style='padding:10px 16px;background:#eee;border:1px solid #ccc;border-radius:5px;cursor:pointer'>KAPAT</button></div></div></body></html>`;let w=window.open('','_blank');w.document.write(h);w.document.close();}
