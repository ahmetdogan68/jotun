<!DOCTYPE html><html lang='tr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BAYDEMIR</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}.w{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:8px;padding-bottom:90px}.h{background:#012060;color:#fff;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -8px 8px -8px}.logo{height:50px;background:#fff;border-radius:8px;padding:4px;border:2px solid #ffcc00;object-fit:contain}.c{background:#fff;border-radius:10px;padding:10px;margin-top:8px;border:2px solid #012060;position:relative}.sb{position:relative;display:flex;gap:6px}.sb input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}.drop{position:absolute;top:105%;left:0;right:0;background:#fff;border-radius:10px;max-height:320px;overflow:auto;z-index:3000;display:none;box-shadow:0 12px 30px rgba(0,0,0,.3);border:2px solid #012060}.it{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;cursor:pointer}.it-k{background:#fffbe6;border-left:5px solid #0a7a2f}.rb{display:flex;gap:6px;margin-top:6px;align-items:center;position:relative}.sw{width:58px;height:44px;border-radius:8px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}.bil{flex:1;height:44px;border:2px solid #012060;border-radius:8px;background:#fff;display:flex;flex-direction:column;overflow:hidden}.bilU{display:flex;flex:1;border-bottom:2px solid #012060}.bilU div{flex:1;display:flex;align-items:center;justify-content:center}.bilU div:first-child{border-right:2px solid #012060}.bilA{flex:1;display:flex}.bilA input{border:none;width:100%;padding-left:6px;font-size:10px;font-weight:700;background:#f0f4ff}#ralDrop{position:absolute;top:50px;left:0;width:100%;max-width:420px;background:#fff;border-radius:10px;max-height:280px;overflow:auto;z-index:4000;display:none;box-shadow:0 15px 40px rgba(0,0,0,.5);border:2px solid #012060}.ri{padding:7px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.rs{width:24px;height:24px;border-radius:5px;border:1px solid #ddd}.s{padding:7px;border:2px solid #e5e5e5;border-radius:8px;width:100%;font-weight:700}.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px}.amb{padding:10px;border:3px solid #e5e5e5;border-radius:8px;font-weight:900;text-align:center;cursor:pointer;background:#fff}.amb.on{background:#012060;color:#fff;border-color:#ffcc00}.res{background:#111;color:#fff;border-radius:10px;padding:10px;margin-top:8px}.big{font-size:17px;font-weight:900}.setBtn{background:#ffcc00;border:none;width:24px;height:24px;border-radius:5px;font-weight:900;color:#012060;cursor:pointer}.kur{font-size:11px;color:#ffcc00;font-weight:900;background:#000;padding:2px 6px;border-radius:5px;border:1px solid #ffcc00}.setP{display:none;position:fixed;top:0;right:0;width:100%;max-width:400px;height:100%;background:#fff;z-index:99999;padding:12px;overflow:auto}.over{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:99998}.btnS{background:#012060;color:#fff;border:none;border-radius:7px;padding:0 8px;font-weight:900;cursor:pointer;min-width:32px}.wa{background:#25D366;color:#fff;border:none;border-radius:7px;padding:9px;font-weight:900;cursor:pointer}</style></head><body><div class='w'><div class='h'><div style='display:flex;gap:10px;align-items:center'><img id='fLogo' src='' class='logo' style='display:none'><div style='font-weight:900'>BAYDEMIR</div></div><div style='display:flex;gap:10px;align-items:center'><img id='jLogo' src='./jotun.png' class='logo' style='border-color:#012060'><div style='display:flex;flex-direction:column;align-items:center;gap:2px'><button class='setBtn' onclick='openSet()'>⚙</button><div id='kurTxt' class='kur'>49,6802</div></div></div></div><div class='over' id='over' onclick='closeSet()'></div><div class='setP' id='setP'><h3>AYARLAR</h3><div style='margin-top:8px'>Firma<input id='setFirma' class='s'></div><div style='margin-top:4px'>Firma Logo URL<input id='setFL' class='s'></div><div style='margin-top:4px'>Jotun Logo URL<input id='setJL' class='s' value='./jotun.png'></div><div style='margin-top:4px'>Telefon<input id='setTel' class='s'></div><div style='margin-top:4px'>Veren<input id='setVeren' class='s'></div><div style='display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px'><div>Kar%<input id='setKar' class='s' type='number' value='25'></div><div>KDV%<input id='setKdv' class='s' type='number' value='20'></div></div><div style='margin-top:4px'>Dolar<input id='setDolar' class='s' value='49,6802'></div><button onclick='fetchDolar()' style='margin-top:5px;width:100%;background:#0a7a2f;color:#fff;border:none;border-radius:6px;padding:8px;font-weight:800'>DOLAR CEK</button><button onclick='saveSet();closeSet()' style='width:100%;padding:11px;background:#012060;color:#fff;border:none;border-radius:6px;font-weight:900;margin-top:8px'>KAYDET KAPAT</button></div><div class='c'><div style='font-size:11px;font-weight:900;color:#012060'>1 - RAL - <span id='ralSay'>-</span></div><div class='rb'><div class='sw' id='swatch'>BOS</div><div class='bil'><div class='bilU'><div><input id='ralInput' placeholder='5015' readonly onclick='enableRal()' oninput='filterRal()' style='border:none;width:100%;text-align:center;font-weight:900'></div><div style='background:#fffbe6'><input id='pigment' placeholder='0,00' style='border:none;background:transparent;width:100%;text-align:center;font-weight:900' oninput='calc()'><span style='font-size:10px;font-weight:900;padding-right:3px'>TL</span></div></div><div class='bilA'><input id='ralForm' placeholder='FORMUL'></div></div><button class='btnS' onclick='enableRal()'>🔍</button><div id='ralDrop'></div></div></div><div class='c'><div style='font-size:11px;font-weight:900;color:#012060'>2 - URUN - <span id='canliSay'>0</span> - KAYITLI: <span id='kayitSay'>0</span></div><div class='sb' style='margin-top:6px'><input id='urunInput' placeholder='Urun ara' readonly onclick='enableUrun()' oninput='filterUrun()'><button class='btnS' onclick='enableUrun()'>🔍</button><div class='drop' id='urunDrop'></div></div><div id='urunDetay' style='font-size:10px;margin-top:4px;display:none;font-weight:700'></div></div><div class='c'><div style='font-size:11px;font-weight:900;color:#012060'>3 - AMBALAJ</div><div class='ambRow' id='ambList'></div></div><div class='res'><div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#1e1e1e;border-radius:8px;padding:8px'><div><div style='font-size:9px;color:#888'>LT MALIYET</div><div id='maliyet' style='font-weight:900'>-</div></div><div><div style='font-size:9px;color:#888'>LT SATIS</div><div id='ltSatis' style='font-weight:900;color:#ffcc00'>-</div></div><div><div style='font-size:9px;color:#888'>KOVA SATIS</div><div id='kova' class='big'>-</div><div id='kovaKdv' style='color:#ffcc00;font-size:11px;font-weight:800'>-</div></div></div><div style='display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px'><button onclick='teklifeEkle()' style='background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:10px;border-radius:8px;font-weight:900'>EKLE</button><button onclick='kaydet()' style='background:#ffcc00;border:none;padding:10px;border-radius:8px;font-weight:900;color:#012060'>KAYDET</button></div></div><div class='c' style='background:#eef3ff'><div style='display:flex;justify-content:space-between'><b style='font-size:11px'>TEKLIF (<span id='teklifSayi'>0</span>)</b><button onclick='temizle()' style='background:#ff4444;color:#fff;border:none;border-radius:5px;padding:3px 6px;font-size:9px'>TEMIZLE</button></div><div style='display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px'><input id='musteriAd' class='s' placeholder='Musteri Adi'><input id='tarih' class='s' type='date'></div><div style='display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px'><input id='musteriTel' class='s' placeholder='Musteri Tel'><input id='verenInput' class='s' placeholder='Teklifi Veren'></div><div style='display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:4px'><input id='firmaTel' class='s' placeholder='Firma WhatsApp'><button onclick='waGonder()' class='wa'>WhatsApp</button></div><div id='teklifList' style='margin-top:5px'></div><div id='teklifToplam' style='background:#012060;color:#fff;border-radius:6px;padding:6px;margin-top:4px;font-size:10px;display:none'></div><button onclick='yazdir()' style='width:100%;margin-top:6px;background:#012060;color:#fff;border:none;border-radius:6px;padding:11px;font-weight:900'>FIYAT TEKLIF FORMU - YAZDIR / PDF</button></div></div>
<script>
let urunler=[],ralList=[],kayitlar=[],secKayit=[],amb=[{ad:'3.6L',lt:3.6},{ad:'4.5L',lt:4.5},{ad:'18L',lt:18}];
let ayar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":25,"kdv":20,"dolar":"49,6802","firmaAdi":"BAYDEMIR BOYA","firmaLogo":"","jotunLogo":"./jotun.png","telefon":"","teklifVeren":""}');
let secUrun=null,secAmb=2,secLT=18,secHex='#FFF',son=null,tempRal='',secName='',sepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');
function fmt(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
function baseNo(a){let m=(a||'').toUpperCase().match(/BASE\s*(\d+)/);return m?m[1]:null}
function fam(a){let u=(a||'').toUpperCase().replace(/\s*\(.*?LT.*?\)/gi,'').trim();let mm=u.match(/(.+?BASE\s*\d+)/);if(mm)return mm[1].replace(/COMP.*/, '').trim();return u.substring(0,30)}
function ltNo(a){let m=(a||'').match(/\(([0-9.,]+)\s*LT\)/i);if(m)return parseFloat(m[1].replace(',','.'))||18;return 18}
async function tryFetch(urls){for(let u of urls){try{let r=await fetch(u,{cache:'no-store'});if(r.ok){let t=await r.text();t=t.replace(/"fiyat"\s*:\s*(\d+),(\d+)/g,'"fiyat": $1.$2');let j=JSON.parse(t);if(j&&j.length>0)return {data:j};}}catch(e){}}return null}
async function loadAll(){let pr=await tryFetch(['./products.json?v='+Date.now()]);let bl=[];if(pr){bl=pr.data.map(o=>({ad:(o.ad||'').trim(),fiyat:parseFloat(o.fiyat)||0}));}bl.sort((a,b)=>a.ad.toUpperCase().localeCompare(b.ad.toUpperCase(),'tr'));urunler=bl.map(o=>[o.ad,o.fiyat]);document.getElementById('canliSay').innerText=urunler.length;let rr=await tryFetch(['./ral.json?v='+Date.now()]);if(rr){ralList=rr.data;document.getElementById('ralSay').innerText=ralList.length}let jr=await tryFetch(['./jotun_kayitlar.json?v='+Date.now()]);if(jr){jr.data=jr.data.map(k=>{if(parseInt(k.lt)==20||ltNo(k.product)==20){k.lt=18;k.can_size='18L';if(k.product)k.product=k.product.replace(/\(20\s*LT\)/gi,'(18 LT)')}return k});kayitlar=jr.data;document.getElementById('kayitSay').innerText=kayitlar.length}document.getElementById('setFirma').value=ayar.firmaAdi||'';document.getElementById('setFL').value=ayar.firmaLogo||'';document.getElementById('setJL').value=ayar.jotunLogo||'./jotun.png';document.getElementById('setTel').value=ayar.telefon||'';document.getElementById('setVeren').value=ayar.teklifVeren||'';document.getElementById('firmaTel').value=ayar.telefon||'';document.getElementById('verenInput').value=ayar.teklifVeren||'';if(ayar.firmaLogo){document.getElementById('fLogo').src=ayar.firmaLogo;document.getElementById('fLogo').style.display='block'}if(ayar.jotunLogo)document.getElementById('jLogo').src=ayar.jotunLogo;document.getElementById('setKar').value=ayar.kar;document.getElementById('setKdv').value=ayar.kdv;document.getElementById('setDolar').value=ayar.dolar;document.getElementById('kurTxt').innerText=ayar.dolar;document.getElementById('tarih').valueAsDate=new Date();renderAmb();renderTeklif()}
function openSet(){document.getElementById('setP').style.display='block';document.getElementById('over').style.display='block'}function closeSet(){document.getElementById('setP').style.display='none';document.getElementById('over').style.display='none'}
function saveF(){ayar.firmaAdi=document.getElementById('setFirma').value;ayar.firmaLogo=document.getElementById('setFL').value;ayar.jotunLogo=document.getElementById('setJL').value;ayar.telefon=document.getElementById('setTel').value;ayar.teklifVeren=document.getElementById('setVeren').value;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayar));}
function saveSet(){saveF();ayar.kar=parseFloat(document.getElementById('setKar').value)||25;ayar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayar.dolar=document.getElementById('setDolar').value;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayar));document.getElementById('kurTxt').innerText=ayar.dolar;document.getElementById('firmaTel').value=ayar.telefon;document.getElementById('verenInput').value=ayar.teklifVeren;closeSet();calc()}
async function fetchDolar(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();let k=j.rates.TRY;if(k){let s=k.toFixed(4).replace('.',',');document.getElementById('setDolar').value=s;ayar.dolar=s;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayar));document.getElementById('kurTxt').innerText=s;calc()}}catch(e){}}
function enableUrun(){let i=document.getElementById('urunInput');i.removeAttribute('readonly');i.focus();openUrun()}function enableRal(){let i=document.getElementById('ralInput');i.removeAttribute('readonly');i.focus();openRal()}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun()}function openRal(){document.getElementById('ralDrop').style.display='block';filterRal()}
function filterUrun(){let q=document.getElementById('urunInput').value.toUpperCase().trim();let d=document.getElementById('urunDrop');let h=[];if(tempRal && kayitlar.length>0){let f=kayitlar.filter(x=>String(x.ral_no).trim()===String(tempRal).trim());let m=new Map();f.forEach(x=>{let k=(x.base_no||'')+'_'+(x.product||'').trim()+'_'+(x.ral_no||'');if(!m.has(k))m.set(k,x)});secKayit=Array.from(m.values());secKayit.forEach((k,i)=>{let bn=k.base_no||baseNo(k.product);let au=null;if(bn)au=urunler.find(u=>baseNo(u[0])===String(bn)&&u[1]>0);if(!au){let a=fam(k.product);au=urunler.find(u=>fam(u[0])===a&&u[1]>0)}let ff=au?`$${au[1]}`:'';h.push(`<div class='it it-k' onclick='selectKayit(${i})'><div style='flex:1'><b>${k.product}</b> <small>${ff} - RAL ${k.ral_no}</small></div><div style='background:#0a7a2f;color:#fff;padding:3px 6px;border-radius:5px'>SEC</div></div>`);});}let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,200);h.push(...list.map(o=>`<div class='it' onclick='selectUrun(${o.i})'><span style='flex:1'>${o.r[0]}</span><b>$${o.r[1]}</b></div>`));d.innerHTML=h.join('');d.style.display='block';}
function selectKayit(i){let k=secKayit[i];if(!k)return;let bn=k.base_no||baseNo(k.product);let au=null;let f=0;if(bn){au=urunler.find(u=>baseNo(u[0])===String(bn)&&u[1]>0);if(au)f=au[1]}if(!au){let a=fam(k.product);au=urunler.find(u=>fam(u[0])===a&&u[1]>0);if(au)f=au[1]}let idx=urunler.findIndex(u=>u[0].trim().toUpperCase()===(k.product||'').trim().toUpperCase());if(idx!==-1)selectUrun(idx);else{urunler.push([k.product,f]);selectUrun(urunler.length-1)}document.getElementById('pigment').value=k.colorant_cost||'';document.getElementById('ralForm').value=k.formul||'';calc();}
function selectUrun(i){secUrun=i;let u=urunler[i];let inp=document.getElementById('urunInput');inp.value=u[0];inp.setAttribute('readonly','true');document.getElementById('urunDrop').style.display='none';document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerText=`✓ ${u[0]} • $${u[1]}`;renderAmb();calc();inp.blur()}
function renderAmb(){document.getElementById('ambList').innerHTML=amb.map((a,i)=>{let c='amb';if(i===secAmb)c+=' on';return `<div class='${c}' onclick='secAmb=${i};secLT=${a.lt};renderAmb();calc()'>${a.ad}</div>`}).join('')}
function filterRal(){let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,80);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class='ri' onclick='selectRal("${r.kod}")'><div class='rs' style='background:${r.hex}'></div><div><b>${r.kod}</b> ${r.isim}</div></div>`).join('');document.getElementById('ralDrop').style.display='block';}
function selectRal(k){let r=ralList.find(x=>x.kod===k);if(!r)return;tempRal=r.kod;secHex=r.hex;secName=r.isim;let sw=document.getElementById('swatch');sw.style.background=r.hex;sw.innerText='RAL '+r.kod;let inp=document.getElementById('ralInput');inp.value=r.kod;inp.setAttribute('readonly','true');inp.blur();document.getElementById('ralDrop').style.display='none';filterUrun();openUrun();calc();}
function calc(){if(secUrun===null)return;let u=urunler[secUrun];let fiyatD=parseFloat(u[1])||0;let kLT=parseFloat(secLT)||18;let kur=parseFloat((document.getElementById('setDolar').value||'49,6802').replace(',','.'))||49.6802;let kar=parseFloat(document.getElementById('setKar').value)||25;let kdv=parseFloat(document.getElementById('setKdv').value)||20;let pigTL=parseFloat((document.getElementById('pigment').value||'0').toString().replace(',','.'))||0;let pigLT=pigTL/18;let urunLT=fiyatD*kur;let toplamLT=urunLT+pigLT;let ltSatis=toplamLT*(1+kar/100);let kovaS=ltSatis*kLT;let kovaK=kovaS*(1+kdv/100);son={urun:u[0],ral:tempRal,hex:secHex,isim:secName,lt:kLT,kovaTl:kovaS,kovaKdv:kovaK,form:document.getElementById('ralForm').value};document.getElementById('maliyet').innerText=fmt(toplamLT);document.getElementById('ltSatis').innerText=fmt(ltSatis);document.getElementById('kova').innerText=fmt(kovaS);document.getElementById('kovaKdv').innerText='KDV DAHIL: '+fmt(kovaK);}
function teklifeEkle(){if(!son)return alert('Once sec');let a=prompt('Kac adet?','1');if(!a)return;sepet.push({...son,adet:parseInt(a)||1});localStorage.setItem('teklif_sepet',JSON.stringify(sepet));renderTeklif()}
function renderTeklif(){document.getElementById('teklifSayi').innerText=sepet.length;if(sepet.length===0){document.getElementById('teklifList').innerHTML='<div style="font-size:9px;color:#999">Yok</div>';document.getElementById('teklifToplam').style.display='none';return}let g=0;document.getElementById('teklifList').innerHTML=sepet.map((t,i)=>{let k=t.kovaKdv||0;g+=k*t.adet;return `<div style='display:flex;gap:6px;padding:7px;border:1px solid #ddd;border-radius:7px;margin-bottom:3px;background:#fff;align-items:center'><div style='width:22px;height:22px;background:${t.hex||'#fff'};border-radius:5px;border:1px solid #999'></div><div style='flex:1'><div style='font-weight:900;font-size:11px'>${t.urun} - RAL ${t.ral}</div><div style='font-size:10px'>Adet:${t.adet} | ${fmt(k)}</div></div><button onclick='sil(${i})' style='background:#ff4444;color:#fff;border:none;border-radius:5px;padding:5px 8px'>X</button></div>`}).join('');document.getElementById('teklifToplam').style.display='block';document.getElementById('teklifToplam').innerText=`TOPLAM: ${fmt(g)}`}
function sil(i){sepet.splice(i,1);localStorage.setItem('teklif_sepet',JSON.stringify(sepet));renderTeklif()}function temizle(){if(confirm('Temizle?')){sepet=[];localStorage.setItem('teklif_sepet','[]');renderTeklif()}}
function waGonder(){let tel=document.getElementById('firmaTel').value||ayar.telefon||'';if(!tel){alert('Telefon gir');return}let clean=tel.replace(/\D/g,'');if(clean.startsWith('0'))clean='90'+clean.substring(1);if(!clean.startsWith('90'))clean='90'+clean;let must=document.getElementById('musteriAd').value||'Musteri';let txt=`Merhaba ${must}, boya fiyat teklifiniz hazir. ${sepet.length} kalem.`;window.open(`https://wa.me/${clean}?text=`+encodeURIComponent(txt),'_blank')}
