<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:12px;padding-bottom:90px}.header{background:#012060;color:white;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;margin:0 -12px 10px -12px}.card{background:white;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative;overflow:visible}.card:nth-of-type(1){z-index:800}.card:nth-of-type(2){z-index:600}.select-box{position:relative;z-index:700;display:flex;gap:8px}.select-box input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:white;border-radius:12px;max-height:65vh;overflow:auto;z-index:9999;display:none;box-shadow:0 15px 40px rgba(0,0,0,0.4);border:2px solid #012060}.item{padding:12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;font-size:11px;cursor:pointer;background:white}.item.setItem{background:#eaffea;border-left:5px solid #0a7a2f}.setBadge{background:#0a7a2f;color:white;font-size:8px;font-weight:900;padding:3px 8px;border-radius:4px}.compBadge{background:#012060;color:#ffcc00;font-size:8px;padding:2px 6px;border-radius:4px}.addBtnMain{background:#0a7a2f;color:white;border:none;border-radius:10px;padding:12px 14px;font-weight:900;cursor:pointer}.ralBoxKompakt{position:relative;display:flex;gap:8px;margin-top:8px}.swatchKompakt{width:100px;min-width:100px;height:62px;border-radius:10px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#012060;text-align:center}.bilgiKutu{flex:1;height:62px;border:2px solid #012060;border-radius:10px;background:white;display:flex;flex-direction:column;overflow:hidden;transition:all 0.3s}.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst input{border:none;text-align:center;font-size:14px;font-weight:900;padding:6px;flex:1}.bilgiUst input:first-child{flex:1;border-right:2px solid #012060}.bilgiUst .pigBox{flex:1;display:flex;align-items:center;background:#fffbe6;transition:all 0.3s}.pigBox.active{border:2px solid #ffcc00;background:#fff9c4;box-shadow:0 0 10px rgba(255,204,0,0.5)}.bilgiAlt{flex:1;display:flex}.bilgiAlt input{border:none;padding-left:10px;font-size:13px;font-weight:700;background:#f0f4ff;width:100%}#ralDrop{position:absolute;top:70px;left:0;width:33.33%;background:white;border-radius:12px;max-height:50vh;overflow:auto;z-index:9999;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.35);border:2px solid #012060}.ralItem{padding:8px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.ralSw{width:36px;height:36px;border-radius:6px;border:1px solid #ddd}.s{padding:10px;border:2px solid #e5e5e5;border-radius:10px;width:100%;font-weight:700;font-size:13px}.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.amb{padding:10px;border:2px solid #e5e5e5;border-radius:10px;font-weight:800;text-align:center;cursor:pointer;background:white}.amb.active{background:#012060;color:white}.result{background:#111;color:white;border-radius:16px;padding:14px;margin-top:10px}.big{font-size:22px;font-weight:900}.setInfo{background:#0a7a2f;color:white;border-radius:8px;padding:10px;margin-top:8px;font-size:11px;font-weight:700;display:none}.settingsBtn{background:#ffcc00;border:none;width:22px;height:22px;border-radius:6px;font-weight:900;color:#012060;cursor:pointer}.settingsCol{display:flex;flex-direction:column;align-items:center;gap:2px}.kurAlt{font-size:9px;color:#ffcc00;font-weight:800}.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:white;z-index:99999;padding:16px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99998}.firmaInput{margin-top:8px}.firmaInput label{font-size:10px;font-weight:900;color:#012060;display:block}.yeniUrunModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100000;align-items:center;justify-content:center}.yeniUrunBox{background:white;border-radius:16px;padding:20px;width:90%;max-width:400px}.teklifRow{display:flex;gap:10px;padding:10px;border-bottom:1px dashed #ddd;align-items:center}.cokGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px}.cokMini{background:white;border:2px solid #012060;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}.cokSw{width:50px;height:50px;min-width:50px;border-radius:10px;border:2px solid #012060}
.logoJotun{height:48px !important;width:auto !important;max-width:110px !important;object-fit:contain;display:block}
.logoBay{height:40px !important;width:auto !important;max-width:110px !important;object-fit:contain}
@media(max-width:700px){.wrap{padding:4px}.header{height:52px}.card{padding:7px}.swatchKompakt{width:52px;min-width:52px;height:40px}.bilgiKutu{height:40px}#ralDrop{width:70%}.ambRow{grid-template-columns:1fr 1fr}.logoJotun{height:34px !important;max-width:80px !important}.logoBay{height:30px !important;max-width:80px !important}}

<body>
<div class="wrap noPrint">
<div class="header"><div style="display:flex;align-items:center;gap:10px"><img id="firmaLogo" src="" class="logoBay" style="display:none"><div id="firmaYazi" style="font-weight:900;font-size:14px">BAYDEMİR YAPI MARKET</div></div><div style="display:flex;align-items:center;gap:10px"><img src="./jotun.png" class="logoJotun" onerror="this.style.display='none'"><div class="settingsCol"><button class="settingsBtn" onclick="openSettings()">⚙️</button><div id="kurTxt" class="kurAlt">TCMB: -</div><div id="urunSay" style="font-size:9px;color:white"></div></div></div></div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel"><h3>⚙️ AYARLAR & FİRMA</h3><div style="background:#eef3ff;border:2px solid #012060;border-radius:12px;padding:10px;margin-top:12px"><b>🏢 FİRMA</b><div class="firmaInput"><label>FİRMA ADI</label><input id="setFirmaAdi" class="s" oninput="saveFirma()"></div><div class="firmaInput"><label>ADRES</label><input id="setFirmaAdres" class="s" oninput="saveFirma()"></div><div class="firmaInput"><label>TELEFON</label><input id="setFirmaTel" class="s" oninput="saveFirma()"></div><div class="firmaInput"><label>MAİL</label><input id="setFirmaMail" class="s" oninput="saveFirma()"></div><div class="firmaInput"><label>LOGO URL</label><input id="setFirmaLogo" class="s" oninput="saveFirma()"></div></div><div style="background:#fffbe6;border:2px solid #ffcc00;border-radius:12px;padding:10px;margin-top:12px"><b>💰 FİYAT - BİRİM = LT FİYATI</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><label style="font-size:10px;font-weight:900">Kar %</label><input id="setKar" class="s" type="number" value="30" oninput="calc()"></div><div><label style="font-size:10px;font-weight:900">KDV %</label><input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div></div><div style="margin-top:8px"><label style="font-size:10px;font-weight:900">Dolar - LT FİYATI x DOLAR = TL</label><input id="setDolar" class="s" oninput="calc()"></div><button onclick="fetchDolar()" style="margin-top:8px;width:100%;background:#0a7a2f;color:white;border:none;border-radius:10px;padding:10px;font-weight:800">🔄 DOLAR ÇEK</button><div id="kurInfo" style="font-size:11px;color:green;margin-top:6px"></div></div><button onclick="saveSettings();closeSettings()" style="width:100%;padding:14px;background:#012060;color:white;border:none;border-radius:10px;font-weight:900;margin-top:16px">✅ KAYDET KAPAT</button></div>
<div class="yeniUrunModal" id="yeniUrunModal" onclick="if(event.target===this)closeYeniUrun()"><div class="yeniUrunBox"><h3 style="color:#012060">➕ YENİ ÜRÜN - BİRİM = LT FİYATI</h3><div class="firmaInput"><label>ÜRÜN ADI (LT ile)</label><input id="yeniAd" class="s" placeholder="FUTURA CLASSIC BASE 1 (16,2 LT)"></div><div class="firmaInput"><label>LT</label><input id="yeniLt" class="s" type="number" step="0.1" placeholder="18.2"></div><div class="firmaInput"><label>KATEGORİ</label><select id="yeniKat" class="s"><option>Poliüretan Sonkat</option><option>Epoxy Sonkat</option><option>Çinko Astar</option><option>Alkid Astar</option><option>Alkid Sonkat</option><option>Tiner</option><option>Shopprimer Astar</option><option>Tank Astarı</option><option>Steelmaster</option></select></div><div class="firmaInput"><label>LT FİYATI $ (BİRİM FİYAT)</label><input id="yeniFiyat" class="s" type="number" step="0.1" placeholder="7.25"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button onclick="closeYeniUrun()" style="padding:12px;border-radius:10px;border:2px solid #ccc;background:white;font-weight:900">İPTAL</button><button onclick="saveYeniUrun()" style="padding:12px;border-radius:10px;border:none;background:#0a7a2f;color:white;font-weight:900">✅ KAYDET</button></div></div></div>

<!-- 1. RAL - EN USTE ALINDI - VERILER RAL ADRESINDEN -->
<div class="card" style="border:2px solid #012060"><div style="font-size:11px;font-weight:900;color:#012060">1 • RENK - RAL KODU / PIGMENT - <span style="font-size:9px;color:#0a7a2f">VERİLER https://ahmetdogan68.github.io/ral/ral.json</span> - <span id="jcmKayitInfo" style="background:#ff9900;color:white;padding:2px 6px;border-radius:4px;font-size:9px"></span></div><div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div><div class="bilgiKutu"><div class="bilgiUst"><input id="ralInput" placeholder="RAL KODU" onfocus="openRal()" oninput="openRal()"><div class="pigBox" id="pigBox"><input id="pigment" placeholder="PIGMENT" oninput="onPigmentChange()"></div></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL - BURAYA KAYIT OTOMATIK GELECEK - SONRA JOTUN'DA KULLANILACAK"></div></div><div id="ralDrop"></div></div><div style="margin-top:10px"><div style="font-size:11px;font-weight:900;color:#012060">2 • AMBALAJ (OTO: 13.5LT → 18L)</div><div class="ambRow" id="ambList"></div></div></div>

<!-- 2. URUN - RAL'DAN SONRA -->
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:11px;font-weight:900;color:#012060">3 • ÜRÜN - <span id="canliSay">0</span> adet - <span id="kaynak" style="color:#0a7a2f;font-size:10px"></span> - <span style="background:#0a7a2f;color:white;padding:2px 6px;border-radius:4px;font-size:9px">BİRİM=LT FİYATI - COMP LT DAHİL</span></div><button onclick="loadAll()" style="background:#eef3ff;border:1px solid #012060;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:900">🔄 YENİLE</button></div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="FUTURA CLASSIC, BARRIER, HARDTOP..." onfocus="openUrun()" oninput="openUrun()"><button class="addBtnMain" onclick="openYeniUrun()">+ YENİ ÜRÜN</button><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div><div id="setInfo" class="setInfo"></div></div>
