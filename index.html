<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAYDEMIR - FIX 0 ADET - PARCALI</title>
<style>
/* 1.GENEL */*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:12px}
/* 2.HEADER */.header{background:#012060;color:white;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;margin:0 -12px 10px -12px}
/* 3.KART */.card{background:white;border-radius:16px;padding:14px;margin-top:12px;position:relative;overflow:visible}.card:nth-of-type(1){z-index:600}
/* 4.URUN */.select-box{position:relative;z-index:700;display:flex;gap:8px}.select-box input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:white;border-radius:12px;max-height:65vh;overflow:auto;z-index:9999;display:none;box-shadow:0 15px 40px rgba(0,0,0,0.4);border:2px solid #012060}.item{padding:10px 12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;font-size:12px;cursor:pointer}.addBtnMain{background:#0a7a2f;color:white;border:none;border-radius:10px;padding:12px 14px;font-weight:900}
/* 5.RENK */.ralBoxKompakt{position:relative;display:flex;gap:8px;margin-top:8px}.swatchKompakt{width:100px;min-width:100px;height:62px;border-radius:10px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:#999}.bilgiKutu{flex:1;height:62px;border:2px solid #012060;border-radius:10px;background:white;display:flex;flex-direction:column;overflow:hidden}.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst input{border:none;text-align:center;font-weight:900;padding:6px;flex:1}.bilgiUst input:first-child{border-right:2px solid #012060}.bilgiUst .pigBox{flex:1;display:flex;align-items:center;background:#fffbe6}.s{padding:10px;border:2px solid #e5e5e5;border-radius:10px;width:100%;font-weight:700}.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.amb{padding:10px;border:2px solid #e5e5e5;border-radius:10px;font-weight:800;text-align:center;cursor:pointer;background:white}.amb.active{background:#012060;color:white}.result{background:#111;color:white;border-radius:16px;padding:14px;margin-top:10px}.big{font-size:22px;font-weight:900}.settingsBtn{background:#ffcc00;border:none;width:22px;height:22px;border-radius:6px;font-weight:900;color:#012060}.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:white;z-index:99999;padding:16px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99998}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div style="font-weight:900">BAYDEMİR - <span id="urunSay">0</span> ÜRÜN - <span id="kaynak" style="font-size:10px;color:#ffcc00"></span></div><div><button class="settingsBtn" onclick="openSettings()">⚙️</button></div></div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div><div class="settingsPanel" id="settingsPanel"><h3>AYARLAR</h3><div id="kurInfo" style="font-size:11px;margin-top:6px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div><label>Kar %</label><input id="setKar" class="s" type="number" value="30" oninput="calc()"></div><div><label>KDV %</label><input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div></div><input id="setDolar" class="s" style="margin-top:8px" oninput="calc()"><button onclick="exportJson()" style="width:100%;margin-top:12px;background:#012060;color:#ffcc00;border:2px solid #ffcc00;border-radius:10px;padding:12px;font-weight:900">📥 GÜNCEL products.json İNDİR - DİREKT LİSTEYE EKLE</button><button onclick="saveSettings();closeSettings()" style="width:100%;padding:14px;background:#012060;color:white;border:none;border-radius:10px;font-weight:900;margin-top:16px">KAYDET KAPAT</button></div>
<div class="card"><div style="display:flex;justify-content:space-between"><div style="font-size:11px;font-weight:900;color:#012060">1 • ÜRÜN - SÜREKLİ YENİ LİSTEYİ ÇEKİYOR - <span id="canliSay">0</span> adet</div><button onclick="loadAll()" style="background:#eef3ff;border:1px solid #012060;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:900">🔄 YENİLE</button></div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="OPTIPRO, PILOT, CONSEAL..." onfocus="openUrun()" oninput="openUrun()"><button class="addBtnMain" onclick="openYeniUrun()">+ YENİ ÜRÜN</button><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div></div>
<div class="card"><div style="font-size:11px;font-weight:900">2 • RENK - YENİ SAYFADA RAL KODU / PIGMENT BOŞ KALIYOR</div><div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div><div class="bilgiKutu"><div class="bilgiUst"><input id="ralInput" placeholder="RAL KODU" onfocus="openRal()" oninput="openRal()"><div class="pigBox" id="pigBox"><input id="pigment" placeholder="PIGMENT" oninput="onPigmentChange()"></div></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL"></div></div><div id="ralDrop" style="position:absolute;top:70px;left:0;width:33%;background:white;border-radius:12px;max-height:50vh;overflow:auto;z-index:9999;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.35);border:2px solid #012060"></div></div><div style="margin-top:10px"><div style="font-size:11px;font-weight:900">3 • AMBALAJ (OTO: 13.5LT → 18L)</div><div class="ambRow" id="ambList"></div></div></div>
<div class="result"><div id="hesapDetay" style="font-size:11px;color:#ccc">Ürün ve renk seç, hesap otomatik gelecek</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;background:#1e1e1e;border-radius:10px;padding:12px"><div><div style="font-size:10px;color:#888">SATIŞ LT TL</div><div id="satisLtTL" style="font-weight:900">-</div><div id="formulDetay" style="font-size:9px;color:#aaa"></div></div><div><div style="font-size:10px;color:#888">KOVA KDV DAHİL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:13px;font-weight:800">-</div></div></div></div>
</div>
<script>
let urunler=[];let ralList=[{kod:"7021",isim:"Siyah Gri",hex:"#4D545B"},{kod:"9010",isim:"Beyaz",hex:"#FFF"}];
let ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}];
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"kdv":20,"dolar":"49,58"}');
let customUrunler=JSON.parse(localStorage.getItem('custom_urunler_v3')||'[]');
let secUrunIdx=null,secAmbIdx=2,secLT=18,tcmbKur=49.58,secRalHex="#FFFFFF",secRalName="",sonHesap=null,secUrunLT=18;
let YEDEK=[{"ad":"BARRIER 65 COMP.A (7,2 LT)","fiyat":0,"lt":7.2,"kategori":"Çinko Astar"},{"ad":"OPTIPRO UNI TC BASE 1 A (13,5 LT)","fiyat":7.25,"lt":13.5,"kategori":"Poliüretan Sonkat"},{"ad":"OPTIPRO UNI TC BASE 3 A (13.5 LT)","fiyat":6.8,"lt":13.5,"kategori":"Poliüretan Sonkat"},{"ad":"PILOT QD PRIMER GREY (20 LT)","fiyat":3.8,"lt":20,"kategori":"Alkid Astar"},{"ad":"PILOT QD TOPCOAT BASE 1 (18 LT)","fiyat":5,"lt":18,"kategori":"Alkid Sonkat"}];
function formatPara(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
async function loadAll(){
  let base=[];
  try{
    let r=await fetch('./products.json?v='+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    let d=await r.json();
    if(!d||d.length===0) throw new Error("Bos liste");
    base=d;
    document.getElementById('kaynak').innerText="products.json ✓ "+d.length;
    document.getElementById('kurInfo').innerHTML="<span style='color:green'>✓ products.json çekildi: "+d.length+" ürün - "+new Date().toLocaleTimeString('tr-TR')+"</span>";
  }catch(e){
    base=YEDEK;
    document.getElementById('kaynak').innerText="YEDEK - products.json hatalı!";
    document.getElementById('kurInfo').innerHTML="<span style='color:red'>⚠️ products.json çekilemedi, YEDEK kullanılıyor.<br>GitHub'da products.json dosyasını kontrol et. Hata: "+e.message+"</span>";
    console.warn("products.json hatası, yedek:", e);
  }
  let merged=[...base];
  for(let c of customUrunler){let i=merged.findIndex(x=>x.ad.toUpperCase()===c.ad.toUpperCase());if(i>-1)merged[i]=c;else merged.push(c);}
  merged.sort((a,b)=>a.ad.toUpperCase().localeCompare(b.ad.toUpperCase(),'tr'));
  urunler=merged.map(o=>[o.ad,o.fiyat,o.lt,o.kategori||""]);
  document.getElementById('canliSay').innerText=urunler.length;
  document.getElementById('urunSay').innerText=urunler.length;
  filterUrun();
  document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;document.getElementById('setDolar').value=ayarlar.dolar;
  renderAmb();fetchDolar();bosaltRalPigment();
}
function bosaltRalPigment(){document.getElementById('ralInput').value='';document.getElementById('pigment').value='';document.getElementById('ralForm').value='';document.getElementById('swatch').innerText='BOŞ';}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||30;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));calc()}
async function fetchDolar(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();let k=j.rates.TRY;if(k){tcmbKur=k;document.getElementById('setDolar').value=k.toFixed(4).replace('.',',');calc();}}catch(e){}}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun();}
function filterUrun(){let q=document.getElementById('urunInput').value.toUpperCase().trim();let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,120);document.getElementById('urunDrop').innerHTML=list.map(o=>{let f=o.r[1]>0?`$${o.r[1]}`:`<span style="color:red">YOK</span>`;return `<div class="item"><div style="flex:1" onclick="selectUrun(${o.i})">${o.r[0]}<br><small>${o.r[3]} ${o.r[2]}LT</small></div><div><b>${f}</b><button style="margin-left:6px;background:#ffcc00;border:none;border-radius:6px;padding:4px 8px" onclick="event.stopPropagation();fiyatDuzenle(${o.i})">✏️</button></div></div>`}).join('');document.getElementById('urunDrop').style.display='block';}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';secUrunLT=parseFloat(u[2])||18;let ni=ambalajlar.findIndex(a=>a.lt>=secUrunLT-0.2);if(secUrunLT>=13&&secUrunLT<=14)ni=ambalajlar.findIndex(a=>a.ad==="18L");if(ni===-1)ni=2;secAmbIdx=ni;secLT=ambalajlar[ni].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML=`✓ ${u[0]} $${u[1]}`;renderAmb();calc();}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let c="amb";if(i===secAmbIdx)c+=" active";return `<div class="${c}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('');}
function fiyatDuzenle(i){let u=urunler[i];let y=prompt(u[0]+" Yeni $:",u[1]);if(y===null)return;let f=parseFloat(y.replace(',','.'))||0;let idx=customUrunler.findIndex(x=>x.ad.toUpperCase()===u[0].toUpperCase());if(idx>-1)customUrunler[idx].fiyat=f;else customUrunler.push({ad:u[0],fiyat:f,lt:u[2],kategori:u[3]});localStorage.setItem('custom_urunler_v3',JSON.stringify(customUrunler));loadAll();}
function openYeniUrun(){let ad=prompt("ÜRÜN ADI (LT ile ÖRN: YENI (18 LT)):");if(!ad)return;let m=ad.match(/([\d.,]+)\s*LT/i);let lt=m?parseFloat(m[1].replace(',','.')):18;let kat=prompt("Kategori:","Poliüretan Sonkat");let f=parseFloat(prompt("Fiyat $:","5").replace(',','.'))||0;customUrunler.push({ad,fiyat:f,lt,kategori:kat});localStorage.setItem('custom_urunler_v3',JSON.stringify(customUrunler));alert("✅ "+ad+" direkt listeye eklendi! "+urunler.length+" oldu. Ayarlar → İNDİR ile kalıcı yap.");loadAll();}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal()}
function filterRal(){let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)).slice(0,100);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div style="padding:8px;display:flex;gap:8px;cursor:pointer" onclick="selectRal('${r.kod}')"><div style="width:20px;height:20px;background:${r.hex}"></div>RAL ${r.kod}</div>`).join('');}
function selectRal(k){let r=ralList.find(x=>x.kod===k);document.getElementById('ralInput').value=r.kod;document.getElementById('ralDrop').style.display='none';secRalHex=r.hex;secRalName=r.isim;document.getElementById('swatch').style.background=r.hex;document.getElementById('swatch').innerText='RAL '+r.kod;calc();}
function onPigmentChange(){calc();}
function calc(){if(secUrunIdx===null)return;let pig=parseFloat((document.getElementById('pigment').value||"0").replace(',','.').replace(/[^0-9.]/g,''))||0;let u=urunler[secUrunIdx];let uf=parseFloat(u[1])||0;let ult=secUrunLT||18;let klt=secLT||18;let td=(uf*ult)+pig;let md=td/klt;let kar=parseFloat(document.getElementById('setKar').value)||30;let sd=md*(1+kar/100);let kur=parseFloat((document.getElementById('setDolar').value||"49,58").replace(',','.').replace(/[^0-9.]/g,''))||tcmbKur;let st=sd*kur;let kt=st*klt;let kdv=parseFloat(document.getElementById('setKdv').value)||20;let kk=kt*(1+kdv/100);document.getElementById('satisLtTL').innerText=formatPara(st);document.getElementById('satisKova').innerText=formatPara(kt);document.getElementById('satisKovaKdv').innerText='KDV DAHİL: '+formatPara(kk);document.getElementById('formulDetay').innerText=`($${uf} x ${ult} + $${pig}) / ${klt} = $${md.toFixed(3)}`;document.getElementById('hesapDetay').innerText=`RAL ${document.getElementById('ralInput').value||'RAL KODU'} • $${pig} - YAZDIKTAN SONRA KALIYOR`;}
function exportJson(){let all=urunler.map(r=>({ad:r[0],fiyat:r[1],lt:r[2],kategori:r[3]}));let b=new Blob([JSON.stringify(all,null,2)],{type:"application/json"});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='products.json';a.click();}
loadAll();
setInterval(()=>{loadAll();},60000);
document.addEventListener('click',e=>{if(!e.target.closest('.ralBoxKompakt'))document.getElementById('ralDrop').style.display='none';if(!e.target.closest('.select-box'))document.getElementById('urunDrop').style.display='none';});
</script></body></html>
