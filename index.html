<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAYDEMIR V4 - DUZGUN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}
.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:12px}
.header{background:#012060;color:#fff;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:200;margin:-12px -12px 12px -12px}
.card{background:#fff;border-radius:16px;padding:14px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);position:relative}
.select-box{position:relative;display:flex;gap:8px}.select-box input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}
.drop{position:absolute;top:105%;left:0;right:0;background:#fff;border-radius:12px;max-height:65vh;overflow:auto;z-index:9999;display:none;box-shadow:0 15px 40px rgba(0,0,0,.4);border:2px solid #012060}
.item{padding:12px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;cursor:pointer}
.item.jcmKayitli{background:#fffbe6;border-left:6px solid #0a7a2f}
.ralBox{display:flex;gap:8px;margin-top:8px}.swatch{width:90px;height:60px;border-radius:10px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}
.bilgi{flex:1;border:2px solid #012060;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.bilgiUst{display:flex;border-bottom:2px solid #012060}.bilgiUst input{border:none;text-align:center;font-weight:900;padding:8px;flex:1}
.bilgiUst input:first-child{border-right:2px solid #012060}.bilgiAlt input{border:none;padding:8px;background:#fffbe6;font-weight:700;width:100%}
#ralDrop{position:absolute;top:65px;left:0;width:50%;background:#fff;border-radius:12px;max-height:40vh;overflow:auto;z-index:9999;display:none;box-shadow:0 12px 30px rgba(0,0,0,.3);border:2px solid #012060}
.ralItem{padding:8px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}
.ralSw{width:32px;height:32px;border-radius:6px;border:1px solid #ddd}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.amb{padding:12px;border:2px solid #ddd;border-radius:10px;text-align:center;font-weight:800;cursor:pointer}
.amb.active{background:#012060;color:#fff}
.result{background:#111;color:#fff;border-radius:16px;padding:14px;margin-top:14px}.big{font-size:20px;font-weight:900}
.s{padding:10px;border:2px solid #ddd;border-radius:10px;width:100%;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><b>BAYDEMİR YAPI MARKET</b><div id="urunSay" style="font-size:11px"></div></div>

<!-- 1 RAL -->
<div class="card" style="border:2px solid #012060">
<div style="font-size:12px;font-weight:900">1 • RAL - <span id="jcmDurum" style="color:#0a7a2f"></span> <span id="jcmKayitInfo" style="background:#0a7a2f;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px"></span></div>
<div class="ralBox"><div class="swatch" id="swatch">BOŞ</div><div class="bilgi"><div class="bilgiUst"><input id="ralInput" placeholder="RAL 7016" onfocus="IS_RAL.open()" oninput="IS_RAL.open()"><input id="pigment" placeholder="PIGMENT $" oninput="IS_HESAP.calc()" style="background:#fffbe6"></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL"></div></div><div id="ralDrop"></div></div>
</div>

<!-- 2 URUN -->
<div class="card" style="border:2px solid #012060">
<div style="font-size:12px;font-weight:900">2 • ÜRÜN - <span id="canliSay">0</span></div>
<div class="select-box" style="margin-top:8px"><input id="urunInput" placeholder="RAL yazınca üstte formüllü çıkacak" onfocus="IS_URUN.open()" oninput="IS_URUN.open()"><div class="drop" id="urunDrop"></div></div>
<div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div>
</div>

<!-- 3 AMBALAJ -->
<div class="card" style="border:2px solid #012060;background:#eef6ff"><div style="font-size:12px;font-weight:900">3 • AMBALAJ - <span id="ambSecili">18L</span></div><div class="ambRow" id="ambList"></div></div>

<!-- HESAP -->
<div class="result"><div id="hesapDetay" style="font-size:11px;color:#ccc">RAL -> URUN -> AMBALAJ</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;background:#1e1e1e;border-radius:10px;padding:12px"><div><div style="font-size:10px;color:#888">SATIŞ LT</div><div id="satisLtTL" style="font-weight:900">-</div></div><div><div style="font-size:10px;color:#888">KOVA KDV DAHİL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:12px"></div></div></div></div>

</div>

<script>
let G={urunler:[],ralList:[],ambalajlar:[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}],ayarlar:{kar:30,kdv:20,dolar:"49,58"},secUrunIdx:null,secAmbIdx:2,secLT:18,secUrunLT:18,tempRalKod:"",jotunKayitlar:[],seciliRalKayitlari:[],YEDEK_URUN:[{"ad":"FUTURA CLASSIC BASE 1 COMP.A  (16,2 LT)","fiyat":7.25,"lt":16.2},{"ad":"FUTURA CLASSIC BASE 2 COMP.A  (16,2LT","fiyat":7.25,"lt":16.2},{"ad":"FUTURA CLASSIC BASE 3 COMP A (16.20 LT)","fiyat":6.8,"lt":16.2}],YEDEK_RAL:[{kod:"7016",isim:"Antrasit Gri",hex:"#383E42"},{kod:"7021",isim:"Siyah Gri",hex:"#4D545B"},{kod:"9010",isim:"Beyaz",hex:"#fff"}]};

const IS_RAL={
open(){document.getElementById('ralDrop').style.display='block';this.filter();},
filter(){if(!G.ralList.length)G.ralList=G.YEDEK_RAL;let q=document.getElementById('ralInput').value.toUpperCase().trim();if(q.length===4&&/^\d{4}$/.test(q)){let ex=G.ralList.find(r=>r.kod===q);if(ex){this.select(q);return;}}let list=G.ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,60);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="IS_RAL.select('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div><b>RAL ${r.kod}</b><br><small>${r.isim}</small></div></div>`).join('');},
select(k){let r=G.ralList.find(x=>x.kod===k);if(!r)return;G.tempRalKod=r.kod;G.secRalHex=r.hex;document.getElementById('ralInput').value=r.kod;document.getElementById('swatch').style.background=r.hex;document.getElementById('swatch').innerText='RAL '+r.kod;document.getElementById('ralDrop').style.display='none';this.secildi(k);},
secildi(k){G.tempRalKod=k;G.seciliRalKayitlari=G.jotunKayitlar.filter(x=>x.ral_no==k);document.getElementById('jcmDurum').innerText=G.seciliRalKayitlari.length?`KAYITLI ${G.seciliRalKayitlari.length} ADET ÜSTTE`:'KAYIT YOK';IS_URUN.filter();IS_URUN.open();},
async loadAll(){
let base=G.YEDEK_URUN;try{let r=await fetch('./products.json?v='+Date.now());if(r.ok){let j=await r.json();if(j.length>0)base=j;}}catch(e){}
base.sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));G.urunler=base.map(o=>[o.ad,o.fiyat||0,o.lt||0]);
document.getElementById('canliSay').innerText=G.urunler.length;document.getElementById('urunSay').innerText=G.urunler.length+" ürün";
try{let r=await fetch('https://ahmetdogan68.github.io/ral/ral.json');if(r.ok)G.ralList=await r.json();}catch(e){}if(!G.ralList.length)G.ralList=G.YEDEK_RAL;
try{let res=await fetch('./jotun_kayitlar.json?v='+Date.now());if(res.ok){let gh=await res.json();G.jotunKayitlar=gh;document.getElementById('jcmKayitInfo').innerText=G.jotunKayitlar.length+' KAYIT ✓';}}catch(e){try{let res2=await fetch('https://ahmetdogan68.github.io/ral/jotun_kayitlar.json?v='+Date.now());if(res2.ok){G.jotunKayitlar=await res2.json();}}catch(e2){}}
IS_AMBALAJ.render();
}
};

const IS_URUN={
open(){document.getElementById('urunDrop').style.display='block';this.filter();},
filter(){
let q=document.getElementById('urunInput').value.toUpperCase().trim();
let drop=document.getElementById('urunDrop');let html=[];
if(G.seciliRalKayitlari && G.seciliRalKayitlari.length>0){
html.push(`<div style="background:#0a7a2f;color:white;padding:8px 10px;font-weight:900;font-size:11px;position:sticky;top:0">✅ RAL ${G.tempRalKod} FORMÜLLÜ ÜSTTE - YANINDA FORMÜL YAZILI</div>`);
G.seciliRalKayitlari.forEach(k=>{
let uygun = G.urunler.filter(u=>{let m=u[0].match(/BASE\s*([1-3])/i);return m&&m[1]==k.base_no;});
if(uygun.length===0) uygun=[G.urunler[0]];
uygun.slice(0,1).forEach(u=>{
let i=G.urunler.indexOf(u);let kIdx=G.jotunKayitlar.indexOf(k);
html.push(`<div class="item jcmKayitli" onclick="IS_URUN.selectKayitli(${i},${kIdx})"><div style="flex:1"><b>${u[0]}</b><br><span style="background:#012060;color:#fff;padding:2px 6px;border-radius:4px">BASE ${k.base_no}</span> <span style="background:#ff9900;padding:2px 6px;border-radius:4px">${k.can_size}</span> <span style="background:#0a7a2f;color:#fff;padding:2px 6px;border-radius:4px">$${k.colorant_cost}</span><div style="margin-top:4px;background:#fff;border:1px dashed #ff9900;padding:5px 8px;border-radius:6px;font-weight:700">FORMÜL: ${k.formul||''}</div></div><div style="background:#0a7a2f;color:#fff;padding:10px;border-radius:8px;font-weight:900">SEÇ</div></div>`);
});
});
html.push(`<div style="background:#012060;color:#fff;padding:6px 10px;font-weight:900;font-size:10px">--- DİĞER TÜM ÜRÜNLER (KOMPLE LİSTE) ---</div>`);
}
let list = G.urunler.map((r,idx)=>({r:r,idx:idx})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,100);
html.push(...list.map(o=>`<div class="item" onclick="IS_URUN.select(${o.idx})"><div><b>${o.r[0]}</b><br><small>${o.r[2]}LT - $${o.r[1]}</small></div><div>›</div></div>`));
drop.innerHTML=html.join('');drop.style.display='block';
},
selectKayitli(urunIdx,kayitIdx){let k=G.jotunKayitlar[kayitIdx];let u=G.urunler[urunIdx];G.secUrunIdx=urunIdx;G.secUrunLT=parseFloat(u[2])||18;document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';document.getElementById('pigment').value=k.colorant_cost||'';document.getElementById('ralForm').value=k.formul||'';document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML=`✅ FORMÜLLÜ: <b>${u[0]}</b> | BASE ${k.base_no} | $${k.colorant_cost}`;IS_AMBALAJ.render();IS_HESAP.calc();},
select(i){G.secUrunIdx=i;let u=G.urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';G.secUrunLT=parseFloat(u[2])||18;let idx=G.ambalajlar.findIndex(a=>a.lt>=G.secUrunLT-0.2);if(idx===-1)idx=2;G.secAmbIdx=idx;G.secLT=G.ambalajlar[idx].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML='✓ '+u[0];IS_AMBALAJ.render();IS_HESAP.calc();}
};

const IS_AMBALAJ={render(){document.getElementById('ambList').innerHTML=G.ambalajlar.map((a,i)=>{let cls="amb";if(i===G.secAmbIdx)cls+=" active";return `<div class="${cls}" onclick="IS_AMBALAJ.select(${i})">${a.ad}</div>`;}).join('');document.getElementById('ambSecili').innerText=G.ambalajlar[G.secAmbIdx].ad+' seçili';},select(i){G.secAmbIdx=i;G.secLT=G.ambalajlar[i].lt;this.render();IS_HESAP.calc();}};
const IS_HESAP={calc(){if(G.secUrunIdx===null)return;let pig=parseFloat((document.getElementById('pigment').value||"0").replace(',','.'))||0;let u=G.urunler[G.secUrunIdx];let urunFiyat=parseFloat(u[1])||0;let urunLT=G.secUrunLT||18;let kovaLT=G.secLT||18;let toplam=(urunFiyat*urunLT)+pig;let maliyet=toplam/kovaLT;let kar=30;let satisDolar=maliyet*(1+kar/100);let kur=49.58;let satisTl=satisDolar*kur;let kovaTl=satisTl*kovaLT;let kdv=20;let kovaKdv=kovaTl*(1+kdv/100);document.getElementById('satisLtTL').innerText=satisTl.toFixed(2)+' TL';document.getElementById('satisKova').innerText=kovaTl.toFixed(2)+' TL';document.getElementById('satisKovaKdv').innerText='KDV DAHİL: '+kovaKdv.toFixed(2)+' TL';}};

IS_RAL.loadAll();
document.addEventListener('click',e=>{if(!e.target.closest('.ralBox')){let el=document.getElementById('ralDrop');if(el)el.style.display='none';}if(!e.target.closest('.select-box')){let u=document.getElementById('urunDrop');if(u)u.style.display='none';}});
</script>
</body>
</html>
