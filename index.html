<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JOTUN FINAL</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f4f7;padding:8px;padding-bottom:90px}
.header{background:#0a2342;color:white;padding:10px 12px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:8px;z-index:200}
.jotun-logo{height:26px;background:#ffcc00;padding:3px 6px;border-radius:4px}
.firma-logo{height:20px;max-width:70px;background:white;padding:2px 4px;border-radius:4px;object-fit:contain}
.card{background:white;border-radius:14px;padding:12px;margin-top:10px}
.select-box{position:relative}.select-box input{width:100%;padding:16px;border:2px solid #0a2342;border-radius:12px;font-size:16px;font-weight:700}
.drop{position:absolute;top:60px;left:0;right:0;background:white;border-radius:12px;max-height:60vh;overflow:auto;z-index:300;display:none;box-shadow:0 10px 30px rgba(0,0,0,0.25);border:1px solid #ddd}
.item{padding:12px;border-bottom:1px solid #eee;font-size:13px;display:flex;justify-content:space-between}
.amb{padding:12px;border:2px solid #ddd;border-radius:10px;font-weight:800;text-align:center;margin:4px 0;cursor:pointer}.amb.active{background:#0a2342;color:white}
.s{padding:10px;border:2px solid #ddd;border-radius:8px;width:100%;font-size:14px}
.ralBox{display:flex;gap:8px;background:#f9f9f9;padding:10px;border-radius:12px;border:1px solid #eee}
.swatch{width:44px;height:44px;border-radius:8px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-weight:800;color:white;font-size:11px}
.ralCol{flex:1;display:flex;flex-direction:column;gap:6px}.ralRow{display:grid;grid-template-columns:1fr 100px;gap:6px}
.result{background:#111;color:white;border-radius:14px;padding:12px;margin-top:10px}.big{font-size:24px;font-weight:900}
.settingsBtn{background:#ffcc00;border:none;padding:8px 12px;border-radius:20px;font-weight:900}
.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:white;z-index:999;padding:14px;overflow:auto}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:998}
.cokGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.cokMini{background:white;border:1px solid #e5e5e5;border-radius:10px;padding:6px 8px;display:flex;gap:6px;cursor:pointer}
.cokDot{width:14px;height:14px;border-radius:4px;border:1px solid #ddd}
.urunListItem{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;font-size:12px}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;gap:6px;align-items:center">
<img src="https://jcm.jotun.com/assets/logo-jotun-Bjw4Kkeb.svg" class="jotun-logo">
<img id="firmaLogo" class="firma-logo" style="display:none">
</div>
<button class="settingsBtn" onclick="openSettings()">⚙️ AYARLAR</button>
</div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel">
<h3 style="margin:0">⚙️ AYARLAR</h3>
<div style="margin-top:12px"><label style="font-size:12px;font-weight:800">Firma Logosu (küçük)</label><input type="file" id="logoInput" accept="image/*" onchange="uploadLogo()" style="width:100%"></div>
<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
<input id="setKar" class="s" type="number" placeholder="Kar %"><input id="setDolar" class="s" placeholder="Dolar"><input id="setDiger" class="s" placeholder="Kova TL">
</div>
<div style="margin-top:14px;background:#fffbe6;padding:10px;border-radius:10px;border:1px dashed #ffcc00">
<b>➕ ÜRÜN EKLE</b>
<div style="display:grid;grid-template-columns:1fr 70px 50px;gap:6px;margin-top:6px">
<input id="newUrunAd" class="s" placeholder="Ürün adı"><input id="newUrunFiyat" class="s" placeholder="$"><input id="newUrunLt" class="s" placeholder="LT">
</div>
<button onclick="addUrun()" style="width:100%;margin-top:6px;background:#0a2342;color:white;border:none;border-radius:8px;padding:10px;font-weight:800">EKLE</button>
<div id="urunYonetimList" style="max-height:35vh;overflow:auto;background:white;border:1px solid #eee;border-radius:8px;margin-top:8px"></div>
<button onclick="resetUrunler()" style="width:100%;margin-top:6px;background:#eee;border:none;border-radius:8px;padding:8px;font-size:11px">Fabrika listesine dön</button>
</div>
<button onclick="closeSettings()" style="width:100%;padding:14px;background:#0a2342;color:white;border:none;border-radius:10px;font-weight:800;margin-top:12px">KAPAT</button>
</div>

<div class="card"><b>1. ÜRÜN</b><div class="select-box"><input id="urunInput" placeholder="Ürün ara..." onfocus="openUrun()" oninput="openUrun()" onclick="openUrun()"><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:12px;margin-top:6px;display:none"></div></div>
<div class="card"><b>2. RAL + PİGMENT</b><div class="ralBox"><div class="swatch" id="swatch" style="background:#ddd;color:#333">RAL</div><div class="ralCol"><div class="ralRow"><input id="ralInput" class="s" placeholder="RAL" oninput="onRALChange()"><input id="pigment" class="s" placeholder="20,37" oninput="calc()"></div><input id="ralForm" class="s" placeholder="Formül" oninput="calc()"><div id="foundInfo" style="font-size:11px;color:green;display:none"></div></div></div><div style="margin-top:8px"><b>3. AMBALAJ</b><div id="ambList"></div></div></div>
<div class="result"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><div style="font-size:10px;color:#aaa">MALİYET</div><div id="maliyetDolar" style="color:#ffcc00;font-weight:800">- $</div><button onclick="kaydetHafiza()" style="width:100%;margin-top:8px;background:#ffcc00;border:none;padding:10px;border-radius:8px;font-weight:900">💾 KAYDET</button></div><div><div style="font-size:10px;color:#aaa">SATIŞ $</div><div id="satisDolar" style="color:#0f0;font-size:20px;font-weight:900">- $</div><div style="font-size:10px;color:#aaa;margin-top:6px">SATIŞ TL</div><div id="satisTL" class="big">- TL</div></div></div><div style="font-size:11px;margin-top:8px"><span id="secim" style="color:#ccc">-</span></div></div>
<div class="card" style="background:#fffbe6"><b>⭐ ÇOK KULLANILANLAR - sadece RAL + ürün</b><div id="hafizaList" class="cokGrid"></div></div>

<script>
// SENİN LİSTEN - buraya hepsini koydum
let defaultUrunler=[
["PILOT QD PRIMER GREY (20 LT)",4.5,20],["PILOT QD PRIMER RED (20 LT)",4.5,20],["PILOT QD PRIMER WHITE",4.5,18],
["SPEEDY ENAMEL BASE 1",10,18],["SPEEDY ENAMEL BASE 2",10,18],["SPEEDY ENAMEL BASE 3",10,18],["SPEEDY ENAMEL BASE 5",10,18],["SPEEDY ENAMEL BASE 6",10,18],
["PILOT II BASE 1 (4.50 LT)",6,4.5],["PILOT II BASE 2 (4.50 LT)",6,4.5],["PILOT II BASE 3 (4.50 LT)",6,4.5],["PILOT II BASE 1 (18.00 LT)",6,18],["PILOT II BASE 2 (18.00 LT)",6,18],["PILOT II BASE 3 (18.00 LT)",6,18],
["PILOT QD PRIMER RAL 9002",6.1,18],["PILOT II BASE 6 (4.50 LT)",6.5,4.5],["PILOT II BASE 6 (18 LT)",6.5,18],["PILOT II BASE 5 (18 LT)",6.5,18],
["PILOT QD TOPCOAT BASE 1 (18 LT)",5.5,18],["PILOT QD TOPCOAT BASE 2 (18 LT)",5.5,18],["PILOT QD TOPCOAT BASE 3 (18 LT)",5.5,18],["PILOT QD TOPCOAT BASE 5 (18 LT)",5.5,18],["PILOT QD TOPCOAT BASE 6 (18 LT)",5.5,18],
["PILOT ACR BASE 1 (18 LT)",6,18],["PILOT ACR BASE 2 (18 LT)",6,18],["PILOT ACR BASE 3 (18 L)",6,18],["PILOT ACR BASE 5 (18 L)",6,18],["PILOT ACR BASE 6 (18 LT)",6,18],
["CONSEAL TU BASE 1 (18 LT)",5,18],["CONSEAL TU BASE 2 (18 LT)",5,18],["CONSEAL TU BASE 3 (18 LT)",5,18],["CONSEAL TU BASE 1 (4.5 LT)",5,4.5],["CONSEAL TU BASE 2 (4.5 LT)",5,4.5],["CONSEAL TU BASE 3 (4.50 LT)",5,4.5],["CONSEAL TU BASE 5 (18 LT)",5,18],["CONSEAL TU BASE 6 (4,50 LT)",5,4.5],["CONSEAL TU BASE 6 (18 LT)",5,18],
["HARDTOP XP BASE 1 COMP.A (16.40 LT)",5,16.4],["HARDTOP XP BASE 2 COMP.A (16.40 LT)",5,16.4],["HARDTOP XP BASE 3 COMP.A (16.40 LT)",5,16.4],["HARDTOP AX BASE 1 A (3.6 LT)",5,3.6],["HARDTOP AX BASE 1 A (14.4LT)",5,14.4],["HARDTOP AX BASE 3 A (14.4 LT)",5,14.4],
["PENGUARD EXP CF BASE 1 A (14,4LT)",5,14.4],["PENGUARD EXP CF BASE 3 A (14,4 LT)",5,14.4],["PENGUARD EXP CF COMP. B (4.00 LT)",5,4],["JOTAMASTIC 90 BASE 1 COMP. A",5,14],["FUTURA CLASSIC BASE 1 COMP.A (16,2 LT)",5,16.2],
["JOTAFLOOR PU TC BS1 A (15LT)",10,15],["JOTAFLOOR PU TC COMP B (3LT)",10,3],
["JOTUN THINNER NO.2 LT",5,1],["JOTUN THINNER NO.10 LT",5,1],["BARRIER 80 COMP.A",5,7],["TANKGUARD 412 COMP.A RED",5,16],["STEELMASTER 600 WF WHITE 18.5 LT",5,18.5]
];
let urunler=JSON.parse(localStorage.getItem('jotun_urunler_v2')||'null')||defaultUrunler;
let ambalajlar=[{ad:"3.6 L",lt:3.6,cost:6},{ad:"5 L",lt:5,cost:8},{ad:"20 L",lt:20,cost:20}];
let db=JSON.parse(localStorage.getItem('urun_ral_lt_hafiza')||'{}');
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"dolar":"","diger":40,"logo":""}');
let secUrunIdx=0,secAmbIdx=2,secLT=20,tcmbKur=34.5;
function parsePara(v){if(!v&&v!==0)return 0;return parseFloat(String(v).replace(',','.').replace(/[^0-9.-]/g,''))||0}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block';renderUrunYonetim()}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none';saveSettings()}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||30;ayarlar.dolar=document.getElementById('setDolar').value.trim();ayarlar.diger=parseFloat(document.getElementById('setDiger').value)||40;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));calc()}
function uploadLogo(){let f=document.getElementById('logoInput').files[0];if(!f)return;let r=new FileReader();r.onload=e=>{ayarlar.logo=e.target.result;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));showLogo()};r.readAsDataURL(f)}
function showLogo(){if(ayarlar.logo){document.getElementById('firmaLogo').src=ayarlar.logo;document.getElementById('firmaLogo').style.display='block'}}
function saveUrunler(){localStorage.setItem('jotun_urunler_v2',JSON.stringify(urunler));renderUrunYonetim()}
function addUrun(){let ad=document.getElementById('newUrunAd').value.trim();let fiyat=parsePara(document.getElementById('newUrunFiyat').value);let lt=parseFloat(document.getElementById('newUrunLt').value)||18;if(!ad){alert('Ad gir');return}if(!fiyat)fiyat=5;let idx=urunler.findIndex(u=>u[0].toUpperCase()===ad.toUpperCase());if(idx>=0)urunler[idx]=[ad,fiyat,lt];else urunler.push([ad,fiyat,lt]);document.getElementById('newUrunAd').value='';document.getElementById('newUrunFiyat').value='';document.getElementById('newUrunLt').value='';saveUrunler();filterUrun()}
function deleteUrun(i){if(!confirm(urunler[i][0]+' sil?'))return;urunler.splice(i,1);saveUrunler();filterUrun()}
function resetUrunler(){if(!confirm('Fabrika listesine dön?'))return;urunler=JSON.parse(JSON.stringify(defaultUrunler));saveUrunler()}
function renderUrunYonetim(){document.getElementById('urunYonetimList').innerHTML=urunler.map((u,i)=>`<div class="urunListItem"><div><b>${u[0]}</b><br>$${u[1]} / ${u[2]}LT</div><button onclick="deleteUrun(${i})" style="background:#ff4444;color:white;border:none;border-radius:6px;padding:4px 8px">Sil</button></div>`).join('')}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun()}
function filterUrun(){let q=document.getElementById('urunInput').value.toUpperCase().trim();let list=urunler.map((r,i)=>({r,i})).filter(o=>{if(q.length<2)return true;return o.r[0].toUpperCase().includes(q)}).slice(0,120);document.getElementById('urunDrop').innerHTML=list.map(o=>`<div class="item" onclick="selectUrun(${o.i})"><span>${o.r[0]}</span><b>$${o.r[1]}</b></div>`).join('');document.getElementById('urunDrop').style.display='block'}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';let lt=u[2]||18;if(lt>=10)secAmbIdx=2;else if(lt>=4.5)secAmbIdx=1;else secAmbIdx=0;secLT=ambalajlar[secAmbIdx].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML=`<b>${u[0]}</b> → $${u[1]}/LT`;document.getElementById('ralInput').value='';document.getElementById('pigment').value='';document.getElementById('ralForm').value='';document.getElementById('swatch').style.background='#ddd';document.getElementById('swatch').innerText='RAL';renderAmb();calc()}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let c='amb';if(i===secAmbIdx)c+=' active';return `<div class="${c}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('')}
function onRALChange(){let ral=document.getElementById('ralInput').value.trim();if(!ral){calc();return}document.getElementById('swatch').style.background='#383E42';document.getElementById('swatch').innerText=ral;let found=db[ral]||Object.keys(db).find(k=>k.includes(ral))&&db[Object.keys(db).find(k=>k.includes(ral))];if(found&&found.pigmentDisplay){document.getElementById('pigment').value=found.pigmentDisplay;document.getElementById('ralForm').value=found.form||'';document.getElementById('foundInfo').style.display='block';document.getElementById('foundInfo').innerText='✓ Hafızadan'}calc()}
function kaydetHafiza(){let ral=document.getElementById('ralInput').value.trim();if(!ral){alert('RAL gir');return}let pig=document.getElementById('pigment').value.trim();let data={pigmentDisplay:pig,form:document.getElementById('ralForm').value,color:document.getElementById('swatch').style.background,lt:secLT,ral:ral,urun:urunler[secUrunIdx][0].split('(')[0].trim(),ts:Date.now()};db[ral]=data;db[`${data.urun}__${ral}__${secLT}`]=data;localStorage.setItem('urun_ral_lt_hafiza',JSON.stringify(db));renderHafiza()}
function renderHafiza(){let keys=Object.keys(db).filter(k=>k.includes('__')).sort((a,b)=>(db[b].ts||0)-(db[a].ts||0)).slice(0,21);if(keys.length===0){document.getElementById('hafizaList').innerHTML='<div style="font-size:11px;color:#999">Henüz yok</div>';return}document.getElementById('hafizaList').innerHTML=keys.map(k=>{let o=db[k];return `<div class="cokMini" onclick="document.getElementById('ralInput').value='${o.ral}';onRALChange();calc()"><div class="cokDot" style="background:${o.color||'#383E42'}"></div><div><div style="font-weight:900;font-size:12px">${o.ral}</div><div style="font-size:9px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px">${o.urun}</div></div></div>`}).join('')}
function calc(){let u=urunler[secUrunIdx];if(!u)return;let pig=parsePara(document.getElementById('pigment').value);let amb=ambalajlar[secAmbIdx];let kar=ayarlar.kar||30;let diger=ayarlar.diger||40;let kur=ayarlar.dolar?parsePara(ayarlar.dolar):34.5;let boya=amb.lt*u[1];let toplam=boya+pig;let satis=toplam*(1+kar/100);let satisTL=satis*kur+diger+amb.cost;document.getElementById('secim').innerText=`${u[0]} | ${document.getElementById('ralInput').value||'-'} | ${amb.ad}`;document.getElementById('maliyetDolar').innerText=`$${toplam.toFixed(2)}`;document.getElementById('satisDolar').innerText=`$${satis.toFixed(2)}`;document.getElementById('satisTL').innerText=`${satisTL.toFixed(2)} TL`}
document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setDolar').value=ayarlar.dolar;document.getElementById('setDiger').value=ayarlar.diger;showLogo();renderAmb();renderHafiza();renderUrunYonetim();calc();
document.addEventListener('click',e=>{if(!e.target.closest('.select-box'))document.getElementById('urunDrop').style.display='none'})
</script>
</body>
</html>
