<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAYDEMIR - KOMPLE - 219 URUN - CANLI - RAL USTTE + KAYITLI + COMP.B + KOMPLE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}
.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:12px;padding-bottom:90px}
.header{background:#012060;color:white;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -12px 10px -12px}
.logoBay{height:50px;max-width:140px;object-fit:contain;background:white;border-radius:4px;padding:2px}
.logoJotun{height:46px;background:white;border-radius:6px;padding:2px}
.card{background:white;border-radius:16px;padding:14px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative}
.card-ral{z-index:1000 !important;overflow:visible !important;border:2px solid #012060}
.card-urun{z-index:100 !important;border:2px solid #012060}
.select-box{position:relative;z-index:200;display:flex;gap:8px}.select-box input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}
.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:white;border-radius:12px;max-height:70vh;overflow:auto;z-index:2000;display:none;box-shadow:0 15px 40px rgba(0,0,0,0.4);border:2px solid #012060}
.item{padding:12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;font-size:12px;cursor:pointer;background:white;align-items:center}
.item:hover{background:#eef3ff}
.item.jcmKayitli{background:#fffbe6;border-left:6px solid #0a7a2f;border-bottom:2px solid #ff9900}
.ralBoxKompakt{position:relative;display:flex;gap:8px;margin-top:8px;overflow:visible !important;z-index:1001}
.swatchKompakt{width:100px;min-width:100px;height:62px;border-radius:10px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#012060;text-align:center}
.bilgiKutu{flex:1;height:62px;border:2px solid #012060;border-radius:10px;background:white;display:flex;flex-direction:column;overflow:hidden}
.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst input{border:none;text-align:center;font-size:14px;font-weight:900;padding:6px;flex:1}.bilgiUst input:first-child{border-right:2px solid #012060}
.bilgiAlt{flex:1;display:flex}.bilgiAlt input{border:none;padding-left:10px;font-size:13px;font-weight:700;background:#f0f4ff;width:100%}
#ralDrop{position:absolute;top:72px;left:0;width:100%;max-width:480px;background:white;border-radius:12px;max-height:65vh;overflow:auto;z-index:99999 !important;display:none;box-shadow:0 20px 60px rgba(0,0,0,0.6);border:3px solid #012060}
.ralItem{padding:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.ralSw{width:40px;height:40px;border-radius:8px;border:1px solid #ddd;min-width:40px}
.s{padding:10px;border:2px solid #e5e5e5;border-radius:10px;width:100%;font-weight:700;font-size:13px}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.amb{padding:10px;border:2px solid #e5e5e5;border-radius:10px;font-weight:800;text-align:center;cursor:pointer;background:white}.amb.active{background:#012060;color:white}
.result{background:#111;color:white;border-radius:16px;padding:14px;margin-top:10px}.big{font-size:22px;font-weight:900}
.settingsBtn{background:#ffcc00;border:none;width:28px;height:28px;border-radius:8px;font-weight:900;color:#012060;cursor:pointer}.settingsCol{display:flex;flex-direction:column;align-items:center;gap:2px}.kurAlt{font-size:9px;color:#ffcc00;font-weight:800}
.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:white;z-index:99999;padding:16px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99998}
.firmaInput{margin-top:8px}.firmaInput label{font-size:10px;font-weight:900;color:#012060;display:block;margin-bottom:2px}
.yeniUrunModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100000;align-items:center;justify-content:center}.yeniUrunBox{background:white;border-radius:16px;padding:20px;width:90%;max-width:400px}
.teklifRow{display:flex;gap:10px;padding:10px;border-bottom:1px dashed #ddd;align-items:center}
.cokGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px}
.cokMini{background:white;border:2px solid #012060;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.cokSw{width:50px;height:50px;min-width:50px;border-radius:10px;border:2px solid #012060}
@media print{.noPrint{display:none!important}#printArea{display:block!important}}
</style>
</head>
<body>
<div class="wrap noPrint">
<div class="header"><div style="display:flex;align-items:center;gap:10px"><img id="firmaLogo" src="" class="logoBay" style="display:none"><div id="firmaYazi" style="font-weight:900;font-size:14px">BAYDEMİR YAPI MARKET</div></div><div style="display:flex;align-items:center;gap:10px"><img src="./jotun.png" class="logoJotun" onerror="this.style.display='none'"><div class="settingsCol"><button class="settingsBtn" onclick="openSettings()">⚙️</button><div id="kurTxt" class="kurAlt">-</div><div id="urunSay" style="font-size:9px;color:white"></div></div></div></div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel"><h3>⚙️ AYARLAR</h3><div id="kurInfo" style="font-size:11px;color:green;margin-top:12px"></div><div id="ralDurum" style="font-size:11px;color:#0a7a2f;margin-top:6px;font-weight:900"></div><div id="jotunDurum" style="font-size:11px;color:#012060;margin-top:6px;font-weight:900"></div><div style="margin-top:12px"><label>Kar %</label><input id="setKar" class="s" type="number" value="30" oninput="calc()"></div><div style="margin-top:8px"><label>KDV %</label><input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div><div style="margin-top:8px"><label>Dolar</label><input id="setDolar" class="s" oninput="calc()"></div><button onclick="saveSettings();closeSettings()" style="width:100%;padding:14px;background:#012060;color:white;border:none;border-radius:10px;font-weight:900;margin-top:16px">KAYDET KAPAT</button></div>

<div class="card card-ral"><div style="font-size:11px;font-weight:900;color:#012060">1 • RAL - <span id="ralSay">yükleniyor...</span> - ÜSTTE SABİT</div><div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div><div class="bilgiKutu"><div class="bilgiUst"><input id="ralInput" placeholder="RAL 7016" onfocus="openRal()" oninput="openRal()"><div style="flex:1;display:flex;background:#fffbe6"><input id="pigment" placeholder="PIGMENT $ - OTOMATİK" oninput="calc()"></div></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL - OTOMATİK"></div></div><div id="ralDrop"></div></div></div>

<div class="card card-urun"><div style="display:flex;justify-content:space-between"><div style="font-size:11px;font-weight:900;color:#012060">2 • ÜRÜN - <span id="canliSay">0</span> adet - <span id="kaynak" style="color:#0a7a2f;font-size:10px"></span> - KOMPLE 219 - CANLI FIYAT</div><button onclick="loadAll()" style="background:#eef3ff;border:1px solid #012060;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:900">🔄 YENİLE</button></div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="ARA - BARRIER, FUTURA..." onfocus="openUrun()" oninput="openUrun()"><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">3 • AMBALAJ</div><div class="ambRow" id="ambList"></div></div>

<div class="result"><div id="hesapDetay" style="font-size:11px;color:#ccc">Ürün ve renk seç</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;background:#1e1e1e;border-radius:10px;padding:12px"><div><div style="font-size:10px;color:#888">SATIŞ LT TL</div><div id="satisLtTL" style="font-weight:900">-</div><div id="formulDetay" style="font-size:9px;color:#aaa;margin-top:4px"></div></div><div><div style="font-size:10px;color:#888">KOVA KDV DAHİL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00"></div></div></div></div>

<div class="card" style="background:#eef3ff;border:2px solid #012060"><div style="display:flex;justify-content:space-between"><b>📋 TEKLİF (<span id="teklifSayi">0</span>)</b><button onclick="teklifTemizle()" style="background:#ff4444;color:white;border:none;border-radius:8px;padding:6px 10px">TEMİZLE</button></div><div id="teklifList" style="margin-top:8px"></div></div>
<div class="card" style="background:#fffbe6"><b style="font-size:13px">⭐ ÇOK KULLANILANLAR</b><div id="hafizaList" class="cokGrid"></div></div>
</div>

<script>
let urunler=[],ralList=[],ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}];
let db=JSON.parse(localStorage.getItem('urun_ral_lt_hafiza')||'{}');
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"kdv":20,"dolar":"49,58"}');
let secUrunIdx=null,secAmbIdx=2,secLT=18,tcmbKur=49.58,secRalHex="#FFF",sonHesap=null,secUrunLT=18,tempRalKod="",secRalName="",jotunKayitlar=[],seciliRalKayitlari=[];
let teklifSepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');

function formatPara(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}

async function fetchJsonTry(urls){
  for(let u of urls){
    try{
      let r=await fetch(u,{cache:"no-store"});
      if(r.ok){
        let txt=await r.text();
        let j=JSON.parse(txt);
        if(j&&j.length>0)return {data:j, url:u};
      }
    }catch(e){console.log('FAIL '+u+' '+e.message);}
  }
  return null;
}

async function loadAll(){
  // PRODUCTS.JSON - CANLI - 219 SATIR - LT 0 OLANI ADINDAN CEK
  let prodUrls=['./products.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/products.json?v='+Date.now(),'https://ahmetdogan68.github.io/jotun/products.json?v='+Date.now()];
  let prodRes=await fetchJsonTry(prodUrls);
  let baseListe=[];
  if(prodRes){
    baseListe=prodRes.data.map(o=>{
      let ad=(o.ad||'').trim();
      let lt=parseFloat(o.lt)||0;
      if(lt===0){
        let m=ad.match(/([\d.,]+)\s*LT/i);
        if(m){lt=parseFloat(m[1].replace(',','.'))||18;}
        else lt=18;
      }
      let fiyat=parseFloat(o.fiyat);
      if(isNaN(fiyat))fiyat=0;
      return {ad:ad, fiyat:fiyat, lt:lt, kategori:o.kategori||''};
    });
    // COMP.B FIYATI AYNI
    let mapA={};
    baseListe.forEach(o=>{
      let ad=o.ad.toUpperCase();
      if((ad.includes('COMP.A')||ad.includes('COMP A')) && o.fiyat>0){
        let key=ad.replace(/COMP\.?\s*A.*/,'').trim();
        mapA[key]=o.fiyat;
      }
    });
    baseListe=baseListe.map(o=>{
      let ad=o.ad.toUpperCase();
      if((ad.includes('COMP.B')||ad.includes('COMP B')) && o.fiyat===0){
        let key=ad.replace(/COMP\.?\s*B.*/,'').trim();
        if(mapA[key]!==undefined)o.fiyat=mapA[key];
      }
      return o;
    });
    document.getElementById('kaynak').innerText=`products.json ✓ ${baseListe.length} - CANLI - ADINDAN LT CEKILDI`;
    document.getElementById('kurInfo').innerText=`✓ products.json: ${baseListe.length} ürün - 219 satır - lt 0 olanlar adından çekildi - ${prodRes.url.split('/').pop()}`;
  }else{
    document.getElementById('kaynak').innerText=`YEDEK BOŞ - products.json çekilemedi!`;
    document.getElementById('kurInfo').innerText=`⚠️ products.json çekilemedi - GitHub valid yap`;
  }
  baseListe.sort((a,b)=>a.ad.toUpperCase().localeCompare(b.ad.toUpperCase(),'tr'));
  urunler=baseListe.map(o=>[o.ad, o.fiyat, o.lt]);
  document.getElementById('canliSay').innerText=urunler.length;
  document.getElementById('urunSay').innerText=urunler.length+" ürün";

  // RAL.JSON - 213 RENK CANLI
  let ralUrls=['./ral.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/ral.json?v='+Date.now()];
  let ralRes=await fetchJsonTry(ralUrls);
  if(ralRes){ralList=ralRes.data;document.getElementById('ralSay').innerText=ralList.length+' renk ✓ CANLI';document.getElementById('ralDurum').innerText='✓ RAL: '+ralList.length+' renk';}

  // JOTUN_KAYITLAR.JSON - CANLI
  let jotunUrls=['./jotun_kayitlar.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/jotun_kayitlar.json?v='+Date.now()];
  let jotunRes=await fetchJsonTry(jotunUrls);
  if(jotunRes){jotunKayitlar=jotunRes.data;document.getElementById('jotunDurum').innerText=`✓ JOTUN KAYIT: ${jotunKayitlar.length} formül - CANLI`; }

  document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;document.getElementById('setDolar').value=ayarlar.dolar;
  filterUrun();renderAmb();bosaltRalPigment();renderHafiza();renderTeklif();
}
function bosaltRalPigment(){document.getElementById('ralInput').value='';document.getElementById('pigment').value='';document.getElementById('ralForm').value='';document.getElementById('swatch').innerText='BOŞ';document.getElementById('swatch').style.background='#fff';tempRalKod="";}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||30;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));calc()}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun();}
function filterUrun(){
  let q=document.getElementById('urunInput').value.toUpperCase().trim();
  let drop=document.getElementById('urunDrop');
  let html=[];

  // 1) KAYITLI OLAN USTTE
  if(tempRalKod && jotunKayitlar.length>0){
    let filtre=jotunKayitlar.filter(x=>String(x.ral_no)===String(tempRalKod));
    let map=new Map();
    filtre.forEach(x=>{let key=(x.base_no||'')+"_"+(x.product||'').substring(0,40);if(!map.has(key))map.set(key,x);});
    seciliRalKayitlari=Array.from(map.values()).slice(0,5);
    if(seciliRalKayitlari.length>0){
      html.push(`<div style="background:#0a7a2f;color:white;padding:8px 10px;font-weight:900;font-size:11px;position:sticky;top:0">✅ RAL ${tempRalKod} KAYITLI - ${seciliRalKayitlari.length} ADET ÜSTTE - SEÇİNCE PIGMENT+FORMÜL YUKARI</div>`);
      seciliRalKayitlari.forEach((k,ki)=>{
        let anaUrunAd=k.product||'';
        let uIdx=urunler.findIndex(u=>u[0].toUpperCase()===anaUrunAd.toUpperCase());
        if(uIdx===-1)uIdx=urunler.findIndex(u=>u[0].toUpperCase().includes(anaUrunAd.substring(0,25).toUpperCase()));
        if(uIdx===-1)uIdx=urunler.findIndex(u=>u[0].toUpperCase().includes('BASE '+k.base_no));
        if(uIdx===-1)uIdx=0;
        html.push(`<div class="item jcmKayitli" onclick="selectUrunKayitli(${uIdx},${ki})"><div style="flex:1"><b>📌 KAYITLI: ${anaUrunAd||'BASE '+k.base_no}</b><br><span style="background:#012060;color:white;padding:2px 6px;border-radius:4px">BASE ${k.base_no}</span> <span style="background:#ff9900;padding:2px 6px;border-radius:4px">${k.can_size||''}</span> <span style="background:#0a7a2f;color:white;padding:2px 6px;border-radius:4px">$${k.colorant_cost||0} PIGMENT</span><div style="margin-top:4px;background:white;border:1px dashed #ff9900;padding:5px 8px;border-radius:6px;font-size:11px">FORMÜL: ${k.formul||''}</div></div><div style="background:#0a7a2f;color:white;padding:10px 12px;border-radius:8px;font-weight:900">SEÇ</div></div>`);
        // 2) O URUNUN COMP.B SI
        if(uIdx>=0){
          let anaAd=urunler[uIdx][0].toUpperCase();
          let baseKey=anaAd.replace(/COMP\.?\s*[AB].*/,'').trim();
          let compBIdx=urunler.findIndex(u=>{let ad=u[0].toUpperCase();return ad.includes(baseKey)&& (ad.includes('COMP.B')||ad.includes('COMP B')) && u[0].toUpperCase()!==anaAd;});
          if(compBIdx!==-1){
            let compB=urunler[compBIdx];
            html.push(`<div class="item" style="background:#eef3ff;border-left:6px solid #012060" onclick="selectUrun(${compBIdx})"><div style="flex:1"><b>↳ ${compB[0]} - COMP.B - AYNI FIYAT</b><br><small style="color:#0a7a2f">${compB[2]}LT - Fiyat COMP.A ile aynı</small></div><b style="color:#012060">$${compB[1]}</b></div>`);
          }
        }
      });
      html.push(`<div style="background:#012060;color:white;padding:6px 10px;font-weight:900;font-size:10px">--- DİĞER TÜM ÜRÜNLER - ${urunler.length} ADET KOMPLE LİSTE - CANLI ---</div>`);
    }
  }
  // 3) KOMPLE LISTE - 219 ADET
  let list=urunler.map((r,i)=>({r,i})).filter(o=>{if(!q)return true;return o.r[0].toUpperCase().includes(q);}).slice(0,300);
  html.push(...list.map(o=>`<div class="item" onclick="selectUrun(${o.i})"><span>${o.r[0]} - ${o.r[2]}LT</span><b style="color:#012060">$${o.r[1]}</b></div>`));
  drop.innerHTML=html.join('');drop.style.display='block';
}
function selectUrunKayitli(uIdx,ki){
  selectUrun(uIdx);
  let k=seciliRalKayitlari[ki];
  if(k){document.getElementById('pigment').value=k.colorant_cost||'';document.getElementById('ralForm').value=k.formul||'';calc();}
}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';secUrunLT=parseFloat(u[2])||18;let newIdx=ambalajlar.findIndex(a=>a.lt>=secUrunLT-0.2);if(newIdx===-1)newIdx=2;secAmbIdx=newIdx;secLT=ambalajlar[secAmbIdx].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML=`✓ ${u[0]} • $${u[1]}/LT • ${secUrunLT}LT`;renderAmb();calc();}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let cls="amb";if(i===secAmbIdx)cls+=" active";return `<div class="${cls}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('');}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal();}
function filterRal(){if(!ralList||ralList.length===0)return;let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,120);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="selectRal('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div><b>RAL ${r.kod}</b> - ${r.isim}</div></div>`).join('');document.getElementById('ralDrop').style.display='block';}
function selectRal(k){let r=ralList.find(x=>x.kod===k);if(!r)return;tempRalKod=r.kod;secRalHex=r.hex;secRalName=r.isim;let sw=document.getElementById('swatch');sw.style.background=r.hex;sw.innerText='RAL '+r.kod;sw.style.color=r.hex==="#FFFFFF"?"#012060":"#fff";document.getElementById('ralInput').value=r.kod;document.getElementById('ralDrop').style.display='none';filterUrun();openUrun();calc();}
function calc(){if(secUrunIdx===null)return;let pig=parseFloat((document.getElementById('pigment').value||"0").replace(',','.'))||0;let u=urunler[secUrunIdx];let urunFiyat=parseFloat(u[1])||0;let urunLT=parseFloat(secUrunLT)||18;let kovaLT=parseFloat(secLT)||18;let toplam=(urunFiyat*urunLT)+pig;let maliyet=toplam/kovaLT;let kar=parseFloat(document.getElementById('setKar').value)||30;let satis=maliyet*(1+kar/100);let kur=parseFloat((document.getElementById('setDolar').value||"49,58").replace(',','.'))||49.58;let tl=satis*kur;let kovaTl=tl*kovaLT;let kdv=parseFloat(document.getElementById('setKdv').value)||20;let kovaKdv=kovaTl*(1+kdv/100);document.getElementById('satisLtTL').innerText=tl.toFixed(2)+' TL';document.getElementById('satisKova').innerText=kovaTl.toFixed(2)+' TL';document.getElementById('satisKovaKdv').innerText='KDV DAHİL: '+kovaKdv.toFixed(2)+' TL';document.getElementById('hesapDetay').innerHTML=`<b>RAL ${tempRalKod} ${secRalName}</b> - Pigment $${pig} - Liste ${urunler.length} ürün CANLI`;document.getElementById('formulDetay').innerText=`($${urunFiyat} x ${urunLT}LT + $${pig}) / ${kovaLT}LT`;}
function renderHafiza(){document.getElementById('hafizaList').innerHTML='';}
function renderTeklif(){document.getElementById('teklifSayi').innerText=teklifSepet.length;}
