html<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYDEMIR - FIYAT TEKLIF FORMU</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:8px;padding-bottom:90px}.header{background:#012060;color:#fff;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -8px 8px -8px}.logo{height:50px;background:#fff;border-radius:8px;padding:4px;border:2px solid #ffcc00;object-fit:contain}.card{background:#fff;border-radius:10px;padding:10px;margin-top:8px;border:2px solid #012060;position:relative}.select-box{position:relative;display:flex;gap:6px}.select-box input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}.drop{position:absolute;top:105%;left:0;right:0;background:#fff;border-radius:10px;max-height:320px;overflow:auto;z-index:3000;display:none;box-shadow:0 12px 30px rgba(0,0,0,.3);border:2px solid #012060}.item{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;cursor:pointer}.item-kayitli{background:#fffbe6;border-left:5px solid #0a7a2f}.ralBox{display:flex;gap:6px;margin-top:6px;align-items:center;position:relative}.sw{width:58px;height:44px;border-radius:8px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}.bilgi{flex:1;height:44px;border:2px solid #012060;border-radius:8px;background:#fff;display:flex;flex-direction:column;overflow:hidden}.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst div{flex:1;display:flex;align-items:center;justify-content:center}.bilgiUst div:first-child{border-right:2px solid #012060}.bilgiAlt{flex:1;display:flex}.bilgiAlt input{border:none;width:100%;padding-left:6px;font-size:10px;font-weight:700;background:#f0f4ff}#ralDrop{position:absolute;top:50px;left:0;width:100%;max-width:420px;background:#fff;border-radius:10px;max-height:300px;overflow:auto;z-index:4000;display:none;box-shadow:0 15px 40px rgba(0,0,0,.5);border:2px solid #012060}.ralI{padding:7px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.ralS{width:24px;height:24px;border-radius:5px;border:1px solid #ddd}.s{padding:7px;border:2px solid #e5e5e5;border-radius:8px;width:100%;font-weight:700}.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px}.amb{padding:10px;border:3px solid #e5e5e5;border-radius:8px;font-weight:900;text-align:center;cursor:pointer;background:#fff}.amb.active{background:#012060;color:#fff;border-color:#ffcc00}.result{background:#111;color:#fff;border-radius:10px;padding:10px;margin-top:8px}.big{font-size:17px;font-weight:900}.settingsBtn{background:#ffcc00;border:none;width:24px;height:24px;border-radius:5px;font-weight:900;color:#012060;cursor:pointer}.settingsCol{display:flex;flex-direction:column;align-items:center;gap:2px}.kurAlt{font-size:11px;color:#ffcc00;font-weight:900;background:#000;padding:2px 6px;border-radius:5px;border:1px solid #ffcc00}.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:400px;height:100%;background:#fff;z-index:99999;padding:12px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:99998}.btnS{background:#012060;color:#fff;border:none;border-radius:7px;padding:0 8px;font-weight:900;cursor:pointer;min-width:32px}.waBtn{background:#25D366;color:#fff;border:none;border-radius:7px;padding:9px;font-weight:900;cursor:pointer}</style></head><body><div class="wrap"><div class="header"><div style="display:flex;gap:10px;align-items:center"><img id="firmaLogo" src="" class="logo" style="display:none"><div id="firmaYazi" style="font-weight:900">BAYDEMIR</div></div><div style="display:flex;gap:10px;align-items:center"><img id="jotunLogo" src="./jotun.png" class="logo" style="border-color:#012060" onerror="this.style.display='none'"><div class="settingsCol"><button class="settingsBtn" onclick="openSet()">⚙</button><div id="kurTxt" class="kurAlt">49,6802</div></div></div></div><div class="overlay" id="overlay" onclick="closeSet()"></div><div class="settingsPanel" id="setPanel"><h3>AYARLAR</h3><div style="margin-top:8px">Firma<input id="setFirma" class="s" oninput="saveF()"></div><div style="margin-top:4px">Firma Logo URL<input id="setFirmaLogo" class="s" oninput="saveF()"></div><div style="margin-top:4px">Jotun Logo URL<input id="setJotun" class="s" value="./jotun.png" oninput="saveF()"></div><div style="margin-top:4px">Telefon<input id="setTel" class="s" oninput="saveF()"></div><div style="margin-top:4px">Veren<input id="setVeren" class="s" oninput="saveF()"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px"><div>Kar%<input id="setKar" class="s" type="number" value="25" oninput="calc()"></div><div>KDV%<input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div></div><div style="margin-top:4px">Dolar<input id="setDolar" class="s" value="49,6802" oninput="calc()"></div><button onclick="fetchDolar()" style="margin-top:5px;width:100%;background:#0a7a2f;color:#fff;border:none;border-radius:6px;padding:8px;font-weight:800">DOLAR CEK</button><button onclick="saveSet();closeSet()" style="width:100%;padding:11px;background:#012060;color:#fff;border:none;border-radius:6px;font-weight:900;margin-top:8px">KAYDET KAPAT</button></div><div class="card"><div style="font-size:11px;font-weight:900;color:#012060">1 - RAL - <span id="ralSay">-</span></div><div class="ralBox"><div class="sw" id="swatch">BOS</div><div class="bilgi"><div class="bilgiUst"><div><input id="ralInput" placeholder="9010" readonly onclick="enableRal()" style="border:none;width:100%;text-align:center;font-weight:900"></div><div style="background:#fffbe6"><input id="pigment" placeholder="0,00" style="border:none;background:transparent;width:100%;text-align:center;font-weight:900" oninput="calc()"><span style="font-size:10px;font-weight:900;padding-right:3px">TL</span></div></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMUL"></div></div><button class="btnS" onclick="enableRal()">🔍</button><div id="ralDrop"></div></div></div><div class="card"><div style="font-size:11px;font-weight:900;color:#012060">2 - URUN - <span id="canliSay">0</span></div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="Urun ara" readonly onclick="enableUrun()" oninput="filterUrun()"><button class="btnS" onclick="enableUrun()">🔍</button><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:10px;margin-top:4px;display:none;font-weight:700"></div></div><div class="card"><div style="font-size:11px;font-weight:900;color:#012060">3 - AMBALAJ</div><div class="ambRow" id="ambList"></div></div><div class="result"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#1e1e1e;border-radius:8px;padding:8px"><div><div style="font-size:9px;color:#888">LT MALIYET</div><div id="maliyet" style="font-weight:900">-</div></div><div><div style="font-size:9px;color:#888">LT SATIS</div><div id="ltSatis" style="font-weight:900;color:#ffcc00">-</div></div><div><div style="font-size:9px;color:#888">KOVA SATIS</div><div id="kova" class="big">-</div><div id="kovaKdv" style="color:#ffcc00;font-size:11px;font-weight:800">-</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button onclick="teklifeEkle()" style="background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:10px;border-radius:8px;font-weight:900">EKLE</button><button onclick="kaydet()" style="background:#ffcc00;border:none;padding:10px;border-radius:8px;font-weight:900;color:#012060">KAYDET</button></div></div><div class="card" style="background:#eef3ff"><div style="display:flex;justify-content:space-between"><b style="font-size:11px">TEKLIF (<span id="teklifSayi">0</span>)</b><button onclick="temizle()" style="background:#ff4444;color:#fff;border:none;border-radius:5px;padding:3px 6px;font-size:9px">TEMIZLE</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px"><input id="musteriAd" class="s" placeholder="Musteri Adi"><input id="teklifTarih" class="s" type="date"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px"><input id="musteriTel" class="s" placeholder="Musteri Tel"><input id="verenInput" class="s" placeholder="Teklifi Veren"></div><div style="display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:4px"><input id="firmaTel" class="s" placeholder="Firma WhatsApp"><button onclick="waGonder()" class="waBtn">WhatsApp</button></div><div id="teklifList" style="margin-top:5px"></div><div id="teklifToplam" style="background:#012060;color:#fff;border-radius:6px;padding:6px;margin-top:4px;font-size:10px;display:none"></div><button onclick="yazdir()" style="width:100%;margin-top:6px;background:#012060;color:#fff;border:none;border-radius:6px;padding:11px;font-weight:900">FIYAT TEKLIF FORMU - YAZDIR / PDF</button></div></div>
