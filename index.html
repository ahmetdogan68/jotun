<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAYDEMIR - TAM AYARLAR - SADE LISTE - 219 KOMPLE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}
.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:12px;padding-bottom:90px}
.header{background:#012060;color:white;padding:0 12px;height:60px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -12px 10px -12px}
.logoBay{height:46px;background:white;border-radius:4px;padding:2px}.logoJotun{height:42px;background:white;border-radius:6px;padding:2px}
.card{background:white;border-radius:12px;padding:12px;margin-top:10px;box-shadow:0 2px 6px rgba(0,0,0,0.06);position:relative}
.card-ral{z-index:1000 !important;border:2px solid #012060}.card-urun{z-index:100 !important;border:2px solid #012060}
.select-box{position:relative;display:flex;gap:8px}.select-box input{flex:1;padding:11px;border:2px solid #012060;border-radius:10px;font-weight:800}
.drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:white;border-radius:10px;max-height:68vh;overflow:auto;z-index:2000;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.3);border:2px solid #012060}
.item{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;cursor:pointer;align-items:center;gap:8px}
.item:hover{background:#f0f5ff}
.item-kayitli{background:#fffbe6;border-left:5px solid #0a7a2f}
.badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:9px;font-weight:900;color:white;margin-right:3px}
.badge-base{background:#012060}.badge-lt{background:#ff9900;color:#111}.badge-pig{background:#0a7a2f}
.ralBoxKompakt{position:relative;display:flex;gap:8px;margin-top:8px;z-index:1001}
.swatchKompakt{width:90px;min-width:90px;height:56px;border-radius:8px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.bilgiKutu{flex:1;height:56px;border:2px solid #012060;border-radius:8px;background:white;display:flex;flex-direction:column;overflow:hidden}
.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst input{border:none;text-align:center;font-size:13px;font-weight:900;padding:5px;flex:1}.bilgiUst input:first-child{border-right:2px solid #012060}
.bilgiAlt{flex:1;display:flex}.bilgiAlt input{border:none;padding-left:8px;font-size:11px;font-weight:700;background:#f0f4ff;width:100%}
#ralDrop{position:absolute;top:62px;left:0;width:100%;max-width:460px;background:white;border-radius:10px;max-height:60vh;overflow:auto;z-index:99999 !important;display:none;box-shadow:0 15px 40px rgba(0,0,0,0.5);border:2px solid #012060}
.ralItem{padding:8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer;font-size:11px}.ralSw{width:32px;height:32px;border-radius:6px;border:1px solid #ddd;min-width:32px}
.s{padding:9px;border:2px solid #e5e5e5;border-radius:8px;width:100%;font-weight:700;font-size:12px}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:6px}.amb{padding:8px;border:2px solid #e5e5e5;border-radius:8px;font-weight:800;text-align:center;cursor:pointer;background:white;font-size:12px}.amb.active{background:#012060;color:white}
.result{background:#111;color:white;border-radius:12px;padding:12px;margin-top:10px}.big{font-size:20px;font-weight:900}
.settingsBtn{background:#ffcc00;border:none;width:26px;height:26px;border-radius:6px;font-weight:900;color:#012060;cursor:pointer}
.settingsCol{display:flex;flex-direction:column;align-items:center;gap:2px}.kurAlt{font-size:9px;color:#ffcc00;font-weight:800}
.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:white;z-index:99999;padding:14px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99998}
.firmaInput{margin-top:8px}.firmaInput label{font-size:9px;font-weight:900;color:#012060;display:block;margin-bottom:2px}
.teklifRow{display:flex;gap:8px;padding:8px;border-bottom:1px dashed #ddd;align-items:center;font-size:11px}
.cokGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;margin-top:6px}
.cokMini{background:white;border:1px solid #012060;border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:11px}
.cokSw{width:36px;height:36px;min-width:36px;border-radius:6px;border:1px solid #012060}
@media print{.noPrint{display:none!important}#printArea{display:block!important}}
</style>
</head>
<body>
<div class="wrap noPrint">
<div class="header"><div style="display:flex;gap:8px;align-items:center"><img id="firmaLogo" src="" class="logoBay" style="display:none"><div id="firmaYazi" style="font-weight:900;font-size:13px">BAYDEMİR YAPI MARKET</div></div><div style="display:flex;gap:8px;align-items:center"><img src="./jotun.png" class="logoJotun" onerror="this.style.display='none'"><div class="settingsCol"><button class="settingsBtn" onclick="openSettings()">⚙️</button><div id="kurTxt" class="kurAlt">-</div><div id="urunSay" style="font-size:9px;color:white"></div></div></div></div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel">
<h3>⚙️ AYARLAR & FİRMA</h3>
<div style="background:#eef3ff;border:2px solid #012060;border-radius:10px;padding:10px;margin-top:10px"><b style="font-size:11px">🏢 FİRMA BİLGİLERİ</b>
<div class="firmaInput"><label>FİRMA ADI</label><input id="setFirmaAdi" class="s" oninput="saveFirma()"></div>
<div class="firmaInput"><label>ADRES</label><input id="setFirmaAdres" class="s" oninput="saveFirma()"></div>
<div class="firmaInput"><label>TELEFON</label><input id="setFirmaTel" class="s" oninput="saveFirma()"></div>
<div class="firmaInput"><label>MAİL</label><input id="setFirmaMail" class="s" oninput="saveFirma()"></div>
<div class="firmaInput"><label>LOGO URL (https://...)</label><input id="setFirmaLogo" class="s" oninput="saveFirma()"></div>
</div>
<div style="background:#fffbe6;border:2px solid #ffcc00;border-radius:10px;padding:10px;margin-top:10px"><b style="font-size:11px">💰 FİYAT AYARLARI</b>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><div><label style="font-size:9px;font-weight:900">Kar %</label><input id="setKar" class="s" type="number" value="30" oninput="calc()"></div><div><label style="font-size:9px;font-weight:900">KDV %</label><input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div></div>
<div style="margin-top:6px"><label style="font-size:9px;font-weight:900">Dolar Kuru</label><input id="setDolar" class="s" oninput="calc()"></div>
<button onclick="fetchDolar()" style="margin-top:6px;width:100%;background:#0a7a2f;color:white;border:none;border-radius:8px;padding:8px;font-weight:800;font-size:11px">🔄 DOLAR TCMB'DEN ÇEK</button>
<div id="kurInfo" style="font-size:10px;color:green;margin-top:6px"></div><div id="ralDurum" style="font-size:10px;color:#0a7a2f;margin-top:4px"></div><div id="jotunDurum" style="font-size:10px;color:#012060;margin-top:4px"></div>
</div>
<button onclick="saveSettings();closeSettings()" style="width:100%;padding:12px;background:#012060;color:white;border:none;border-radius:8px;font-weight:900;margin-top:12px">✅ KAYDET KAPAT</button>
</div>

<div class="card card-ral"><div style="font-size:11px;font-weight:900;color:#012060">1 • RAL - <span id="ralSay">-</span></div><div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div><div class="bilgiKutu"><div class="bilgiUst"><input id="ralInput" placeholder="7016" onfocus="openRal()" oninput="openRal()"><input id="pigment" placeholder="$ PIGMENT" style="background:#fffbe6" oninput="calc()"></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL"></div></div><div id="ralDrop"></div></div></div>

<div class="card card-urun"><div style="font-size:11px;font-weight:900;color:#012060">2 • ÜRÜN - <span id="canliSay">0</span> adet - <span id="kaynak" style="font-size:9px;color:#0a7a2f"></span></div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="ARA" onfocus="openUrun()" oninput="openUrun()"><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:10px;margin-top:4px;display:none"></div></div>

<div class="card"><div style="font-size:10px;font-weight:900;color:#012060">3 • AMBALAJ</div><div class="ambRow" id="ambList"></div></div>

<div class="result"><div id="hesapDetay" style="font-size:11px;color:#ccc">Ürün ve renk seç</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;background:#1e1e1e;border-radius:8px;padding:10px"><div><div style="font-size:9px;color:#888">LT TL</div><div id="satisLtTL" style="font-weight:900">-</div><div id="formulDetay" style="font-size:9px;color:#aaa;margin-top:3px"></div></div><div><div style="font-size:9px;color:#888">KOVA KDV DAHİL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:11px;font-weight:800">-</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button onclick="kaydetHafiza()" style="background:#ffcc00;border:none;padding:12px;border-radius:8px;font-weight:900;color:#012060">💾 KAYDET</button><button onclick="teklifeEkle()" style="background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:12px;border-radius:8px;font-weight:900">➕ TEKLİFE EKLE</button></div></div>

<div class="card" style="background:#eef3ff;border:2px solid #012060"><div style="display:flex;justify-content:space-between"><b style="font-size:12px;color:#012060">📋 TEKLİF (<span id="teklifSayi">0</span>)</b><button onclick="teklifTemizle()" style="background:#ff4444;color:white;border:none;border-radius:6px;padding:4px 8px;font-size:10px">TEMİZLE</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><input id="musteriAd" class="s" placeholder="Müşteri"><input id="teklifTarih" class="s" type="date"></div><div id="teklifList" style="margin-top:6px"></div><div id="teklifToplam" style="background:#012060;color:white;border-radius:8px;padding:8px;margin-top:6px;font-size:11px;display:none;text-align:right"></div><button onclick="teklifYazdir()" style="width:100%;margin-top:8px;background:#012060;color:white;border:none;border-radius:8px;padding:12px;font-weight:900">🖨️ YAZDIR / PDF</button></div>

<div class="card" style="background:#fffbe6"><b style="font-size:11px">⭐ ÇOK KULLANILANLAR</b><div id="hafizaList" class="cokGrid"></div></div>
</div>

<div id="printArea" style="display:none;background:white;padding:20px;color:#111"><div style="display:flex;justify-content:space-between;border-bottom:2px solid #012060;padding-bottom:8px"><div style="display:flex;gap:10px"><img id="printLogo" src="" style="height:50px;display:none"><div><div id="printFirma" style="font-weight:900;font-size:12px"></div><div id="printAdres" style="font-size:10px"></div><div id="printTelMail" style="font-size:10px"></div></div></div><img src="./jotun.png" style="height:40px"></div><div style="text-align:center;font-weight:900;margin:12px 0;padding:8px;border:2px solid #012060;font-size:13px">FİYAT TEKLİF FORMU</div><div style="display:flex;justify-content:space-between;font-size:11px"><div>Müşteri: <span id="printMusteri">-</span></div><div>Tarih: <span id="printTarih">-</span></div></div><div id="printListe" style="margin-top:10px"></div><div id="printToplam" style="margin-top:10px;font-size:11px;text-align:right"></div></div>

<script>
let urunler=[],ralList=[],ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}];
let db=JSON.parse(localStorage.getItem('urun_ral_lt_hafiza')||'{}');
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"kdv":20,"dolar":"49,58","firmaAdi":"BAYDEMİR YAPI MARKET","firmaAdres":"","firmaTel":"","firmaMail":"","firmaLogo":""}');
let secUrunIdx=null,secAmbIdx=2,secLT=18,secRalHex="#FFF",sonHesap=null,secUrunLT=18,tempRalKod="",secRalName="",jotunKayitlar=[],seciliRalKayitlari=[],teklifSepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');

function formatPara(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
async function fetchJsonTry(urls){
  for(let u of urls){
    try{
      let r=await fetch(u,{cache:"no-store"});
      if(r.ok){
        let txt=await r.text();
        txt=txt.replace(/"fiyat"\s*:\s*(\d+),(\d+)/g,'"fiyat": $1.$2');
        let j=JSON.parse(txt);
        if(j&&j.length>0)return {data:j, url:u};
      }
    }catch(e){}
  }
  return null;
}
async function loadAll(){
  let prodUrls=['./products.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/products.json?v='+Date.now()];
  let prodRes=await fetchJsonTry(prodUrls);
  let baseListe=[];
  if(prodRes){
    baseListe=prodRes.data.map(o=>{
      let ad=(o.ad||'').trim();
      let lt=parseFloat(o.lt)||0;
      if(lt===0){let m=ad.match(/([\d.,]+)\s*LT/i); if(m)lt=parseFloat(m[1].replace(',','.'))||18; else lt=18;}
      return {ad:ad, fiyat:parseFloat(o.fiyat)||0, lt:lt};
    });
    let fiyatMap={};
    baseListe.forEach(o=>{
      let key=o.ad.toUpperCase().replace(/COMP\.?\s*[AB].*/,'').replace(/\(.*\)/,'').trim().substring(0,30);
      if(o.fiyat>0 && (o.ad.toUpperCase().includes('COMP.A')||o.ad.toUpperCase().includes('BASE'))){
        if(!fiyatMap[key] || fiyatMap[key]===0) fiyatMap[key]=o.fiyat;
      }
    });
    baseListe=baseListe.map(o=>{
      let ad=o.ad.toUpperCase();
      if(ad.includes('COMP.B')||ad.includes('COMP B')){
        let baseAd=o.ad.toUpperCase().replace(/COMP\.?\s*B.*/,'').trim();
        let aOlan=baseListe.find(x=>x.ad.toUpperCase().includes(baseAd.substring(0,15)) && x.fiyat>0);
        if(aOlan) o.fiyat=aOlan.fiyat;
      }
      return o;
    });
    document.getElementById('kaynak').innerText=`${baseListe.length} CANLI - A/B AYNI FIYAT`;
  }
  baseListe.sort((a,b)=>a.ad.toUpperCase().localeCompare(b.ad.toUpperCase(),'tr'));
  urunler=baseListe.map(o=>[o.ad, o.fiyat, o.lt]);
  document.getElementById('canliSay').innerText=urunler.length;
  document.getElementById('urunSay').innerText=urunler.length;
  let ralUrls=['./ral.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/ral.json?v='+Date.now()];
  let ralRes=await fetchJsonTry(ralUrls);
  if(ralRes){ralList=ralRes.data;document.getElementById('ralSay').innerText=ralList.length;document.getElementById('ralDurum').innerText='RAL: '+ralList.length;}
  let jotunUrls=['./jotun_kayitlar.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/jotun_kayitlar.json?v='+Date.now()];
  let jotunRes=await fetchJsonTry(jotunUrls);
  if(jotunRes){jotunKayitlar=jotunRes.data;document.getElementById('jotunDurum').innerText='KAYIT: '+jotunKayitlar.length;}
  document.getElementById('setFirmaAdi').value=ayarlar.firmaAdi||'';document.getElementById('setFirmaAdres').value=ayarlar.firmaAdres||'';document.getElementById('setFirmaTel').value=ayarlar.firmaTel||'';document.getElementById('setFirmaMail').value=ayarlar.firmaMail||'';document.getElementById('setFirmaLogo').value=ayarlar.firmaLogo||'';if(ayarlar.firmaLogo){document.getElementById('firmaLogo').src=ayarlar.firmaLogo;document.getElementById('firmaLogo').style.display='block';document.getElementById('firmaYazi').innerText=ayarlar.firmaAdi;}
  document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;document.getElementById('setDolar').value=ayarlar.dolar;
  document.getElementById('teklifTarih').valueAsDate=new Date();
  filterUrun();renderAmb();bosaltRalPigment();renderHafiza();renderTeklif();
}
function bosaltRalPigment(){document.getElementById('ralInput').value='';document.getElementById('pigment').value='';document.getElementById('ralForm').value='';document.getElementById('swatch').innerText='BOŞ';document.getElementById('swatch').style.background='#fff';tempRalKod="";}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveFirma(){ayarlar.firmaAdi=document.getElementById('setFirmaAdi').value.trim();ayarlar.firmaAdres=document.getElementById('setFirmaAdres').value.trim();ayarlar.firmaTel=document.getElementById('setFirmaTel').value.trim();ayarlar.firmaMail=document.getElementById('setFirmaMail').value.trim();ayarlar.firmaLogo=document.getElementById('setFirmaLogo').value.trim();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));document.getElementById('firmaYazi').innerText=ayarlar.firmaAdi||'BAYDEMİR';if(ayarlar.firmaLogo){document.getElementById('firmaLogo').src=ayarlar.firmaLogo;document.getElementById('firmaLogo').style.display='block';}}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||30;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim();saveFirma();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));calc()}
async function fetchDolar(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();let kur=j.rates.TRY;if(kur){let s=kur.toFixed(4).replace('.',',');document.getElementById('setDolar').value=s;ayarlar.dolar=s;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));document.getElementById('kurTxt').innerText=kur.toFixed(2);calc();}}catch(e){}}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun();}
function filterUrun(){
  let q=document.getElementById('urunInput').value.toUpperCase().trim();
  let drop=document.getElementById('urunDrop');
  let html=[];
  if(tempRalKod && jotunKayitlar.length>0){
    let filtre=jotunKayitlar.filter(x=>String(x.ral_no)===String(tempRalKod));
    let map=new Map();
    filtre.forEach(x=>{let key=(x.base_no||'')+"_"+(x.product||'').substring(0,30);if(!map.has(key))map.set(key,x);});
    seciliRalKayitlari=Array.from(map.values()).slice(0,10);
    if(seciliRalKayitlari.length>0){
      seciliRalKayitlari.forEach((k,ki)=>{
        let uIdx=urunler.findIndex(u=>u[0].toUpperCase()=== (k.product||'').toUpperCase());
        if(uIdx===-1)uIdx=urunler.findIndex(u=>u[0].toUpperCase().includes((k.product||'').substring(0,20).toUpperCase()));
        if(uIdx===-1)uIdx=0;
        let anaUrun=urunler[uIdx];
        let kisaFormul=(k.formul||'').substring(0,60);
        html.push(`<div class="item item-kayitli" onclick="selectUrunKayitli(${uIdx},${ki})"><div style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><span class="badge badge-base">BASE ${k.base_no}</span><span class="badge badge-lt">${k.can_size||''}</span><span class="badge badge-pig">$${k.colorant_cost||0}</span> <b>${anaUrun?anaUrun[0]:k.product}</b> <span style="font-size:10px;color:#444">| ${kisaFormul}</span></div><div style="background:#0a7a2f;color:white;padding:4px 8px;border-radius:6px;font-weight:900;font-size:10px">SEÇ</div></div>`);
      });
    }
  }
  let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,400);
  html.push(...list.map(o=>{
    let fiyatTxt=o.r[1]===0?`$0`: `$${o.r[1]}`;
    let compNote='';
    let adU=o.r[0].toUpperCase();
    if(adU.includes('COMP.B')||adU.includes('COMP B')) compNote=' =A';
    return `<div class="item" onclick="selectUrun(${o.i})"><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.r[0]} - ${o.r[2]}LT</span><b style="color:#012060;white-space:nowrap">${fiyatTxt}${compNote}</b></div>`;
  }));
  drop.innerHTML=html.join('');drop.style.display='block';
}
function selectUrunKayitli(uIdx,ki){selectUrun(uIdx);let k=seciliRalKayitlari[ki];if(k){document.getElementById('pigment').value=k.colorant_cost||'';document.getElementById('ralForm').value=k.formul||'';calc();}}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';secUrunLT=parseFloat(u[2])||18;secAmbIdx=ambalajlar.findIndex(a=>a.lt>=secUrunLT-0.2);if(secAmbIdx===-1)secAmbIdx=2;secLT=ambalajlar[secAmbIdx].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerText=`✓ ${u[0]} • $${u[1]}/LT • ${secUrunLT}LT`;renderAmb();calc();}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let cls="amb";if(i===secAmbIdx)cls+=" active";return `<div class="${cls}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('');}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal();}
function filterRal(){if(!ralList||ralList.length===0)return;let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,120);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="selectRal('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div><b>${r.kod}</b> ${r.isim}</div></div>`).join('');document.getElementById('ralDrop').style.display='block';}
function selectRal(k){let r=ralList.find(x=>x.kod===k);if(!r)return;tempRalKod=r.kod;secRalHex=r.hex;secRalName=r.isim;let sw=document.getElementById('swatch');sw.style.background=r.hex;sw.innerText='RAL '+r.kod;sw.style.color=r.hex==="#FFFFFF"?"#012060":"#fff";document.getElementById('ralInput').value=r.kod;document.getElementById('ralDrop').style.display='none';filterUrun();openUrun();calc();}
function calc(){if(secUrunIdx===null)return;let pig=parseFloat((document.getElementById('pigment').value||"0").replace(',','.'))||0;let u=urunler[secUrunIdx];let urunFiyat=parseFloat(u[1])||0;let urunLT=parseFloat(secUrunLT)||18;let kovaLT=parseFloat(secLT)||18;let toplam=(urunFiyat*urunLT)+pig;let maliyet=toplam/kovaLT;let kar=parseFloat(document.getElementById('setKar').value)||30;let satis=maliyet*(1+kar/100);let kur=parseFloat((document.getElementById('setDolar').value||"49,58").replace(',','.'))||49.58;let tl=satis*kur;let kovaTl=tl*kovaLT;let kdv=parseFloat(document.getElementById('setKdv').value)||20;let kovaKdv=kovaTl*(1+kdv/100);sonHesap={urun:u[0],ral:tempRalKod,hex:secRalHex,isim:secRalName,lt:kovaLT,pigment:pig,satisTlLt:tl,kovaTl:kovaTl,kovaKdv:kovaKdv,form:document.getElementById('ralForm').value,urunLT:urunLT,urunFiyat:urunFiyat};document.getElementById('satisLtTL').innerText=formatPara(tl);document.getElementById('satisKova').innerText=formatPara(kovaTl);document.getElementById('satisKovaKdv').innerText=`KDV DAHİL: ${formatPara(kovaKdv)}`;document.getElementById('hesapDetay').innerHTML=`RAL ${tempRalKod} - $${pig} PIGMENT - ${urunler.length} ürün`;document.getElementById('formulDetay').innerText=`($${urunFiyat} x ${urunLT}LT + $${pig}) / ${kovaLT}LT`;}
function kaydetHafiza(){if(!sonHesap)return alert('Önce seç');let key=`${sonHesap.urun}__${sonHesap.ral}__${Date.now()}`;db[key]={...sonHesap,ts:Date.now(),pigmentDisplay:document.getElementById('pigment').value,urunTam:sonHesap.urun};localStorage.setItem('urun_ral_lt_hafiza',JSON.stringify(db));renderHafiza();}
function renderHafiza(){let keys=Object.keys(db).filter(k=>k.includes('__')).sort((a,b)=>(db[b].ts||0)-(db[a].ts||0));let uniq=[];let seen={};for(let k of keys){let s=`${db[k].ral}__${db[k].urun}`;if(!seen[s]){seen[s]=true;uniq.push(k)}}if(uniq.length===0){document.getElementById('hafizaList').innerHTML='<div style="font-size:10px;color:#999;padding:6px">Henüz yok</div>';return}document.getElementById('hafizaList').innerHTML=uniq.slice(0,20).map(k=>{let o=db[k];return `<div class="cokMini" onclick="yukleCok('${k.replace(/'/g,"\\'")}')"><div class="cokSw" style="background:${o.hex||'#fff'}"></div><div style="flex:1"><div style="font-weight:900">${o.urun}</div><div>RAL ${o.ral}</div></div></div>`}).join('')}
function yukleCok(k){let o=db[k];if(!o)return;let idx=urunler.findIndex(u=>u[0]===o.urunTam||u[0]===o.urun);if(idx!==-1)selectUrun(idx);tempRalKod=o.ral||'';secRalHex=o.hex||'#fff';secRalName=o.isim||'';document.getElementById('swatch').style.background=secRalHex;document.getElementById('swatch').innerText='RAL '+o.ral;document.getElementById('ralInput').value=o.ral||'';document.getElementById('pigment').value=o.pigmentDisplay||o.pigment||'';document.getElementById('ralForm').value=o.form||'';calc();}
function teklifeEkle(){if(!sonHesap)return alert('Önce seç');let adet=prompt('Kaç kova?', '1');if(!adet)return;teklifSepet.push({...sonHesap,adet:parseInt(adet)||1,id:Date.now()});localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif();}
function renderTeklif(){
  document.getElementById('teklifSayi').innerText=teklifSepet.length;
  if(teklifSepet.length===0){document.getElementById('teklifList').innerHTML='<div style="font-size:10px;color:#999;padding:6px">Henüz yok</div>';document.getElementById('teklifToplam').style.display='none';return}
  let toplam=0,genel=0;
  document.getElementById('teklifList').innerHTML=teklifSepet.map((t,i)=>{
    toplam+=t.kovaTl*t.adet;genel+=t.kovaKdv*t.adet;
    return `<div class="teklifRow"><div style="width:28px;height:28px;background:${t.hex};border-radius:6px;border:1px solid #012060;min-width:28px"></div><div style="flex:1"><div style="font-weight:900">${t.urun} - RAL ${t.ral}</div><div style="font-size:10px">LT Birim: ${formatPara(t.satisTlLt)} | Kova: ${formatPara(t.kovaKdv)} x ${t.adet} = <b>${formatPara(t.kovaKdv*t.adet)}</b></div><div style="font-size:9px;color:#666">${t.form||''}</div></div><button onclick="teklifSil(${i})" style="background:#ffdddd;border:none;border-radius:6px;padding:4px 6px">❌</button></div>`;
  }).join('');
  let kdv=genel-toplam;
  document.getElementById('teklifToplam').style.display='block';
  document.getElementById('teklifToplam').innerHTML=`<div>TOPLAM: ${formatPara(toplam)}</div><div>KDV: ${formatPara(kdv)}</div><div style="font-weight:900;border-top:1px solid #ffcc00;margin-top:3px;padding-top:3px">GENEL: ${formatPara(genel)}</div>`;
}
function teklifSil(i){teklifSepet.splice(i,1);localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif()}
function teklifTemizle(){if(confirm('Temizlensin mi?')){teklifSepet=[];localStorage.setItem('teklif_sepet','[]');renderTeklif()}}
function teklifYazdir(){if(teklifSepet.length===0){alert('Sepet boş');return;}let musteri=document.getElementById('musteriAd').value||'Müşteri';let tarih=document.getElementById('teklifTarih').value||new Date().toLocaleDateString('tr-TR');document.getElementById('printMusteri').innerText=musteri;document.getElementById('printTarih').innerText=tarih;document.getElementById('printFirma').innerText=ayarlar.firmaAdi||'BAYDEMİR';document.getElementById('printAdres').innerText=ayarlar.firmaAdres||'';document.getElementById('printTelMail').innerText=`${ayarlar.firmaTel||''} ${ayarlar.firmaMail||''}`;if(ayarlar.firmaLogo){document.getElementById('printLogo').src=ayarlar.firmaLogo;document.getElementById('printLogo').style.display='block';}let html=`<table style="width:100%;border-collapse:collapse;font-size:11px"><tr style="background:#f5f5f5;border-bottom:2px solid #012060"><th style="padding:6px;text-align:left">#</th><th style="padding:6px;text-align:left">ÜRÜN / RENK</th><th style="padding:6px;text-align:right">LT BİRİM</th><th style="padding:6px">ADET</th><th style="padding:6px;text-align:right">TOPLAM</th></tr>`;let toplam=0,genel=0;teklifSepet.forEach((t,i)=>{toplam+=t.kovaTl*t.adet;genel+=t.kovaKdv*t.adet;html+=`<tr style="border-bottom:1px solid #ddd"><td style="padding:6px">${i+1}</td><td style="padding:6px"><b>${t.urun}</b><br>RAL ${t.ral} - ${t.isim}<br><small>${t.form||''} - ${t.lt}LT</small></td><td style="padding:6px;text-align:right">${formatPara(t.satisTlLt)}<br><small>${formatPara(t.kovaKdv)} kova</small></td><td style="padding:6px;text-align:center">${t.adet}</td><td style="padding:6px;text-align:right;font-weight:700">${formatPara(t.kovaKdv*t.adet)}</td></tr>`});html+=`</table>`;document.getElementById('printListe').innerHTML=html;let kdvTutar=genel-toplam;document.getElementById('printToplam').innerHTML=`<div>TOPLAM: ${formatPara(toplam)}</div><div>KDV: ${formatPara(kdvTutar)}</div><div style="font-weight:900;font-size:13px;border-top:1px solid #999;margin-top:6px;padding-top:6px">GENEL: ${formatPara(genel)}</div>`;document.getElementById('printArea').style.display='block';setTimeout(()=>{window.print();},400);setTimeout(()=>{document.getElementById('printArea').style.display='none';},1500);}
loadAll();
document.addEventListener('click',e=>{if(!e.target.closest('.ralBoxKompakt')){let el=document.getElementById('ralDrop');if(el)el.style.display='none';}if(!e.target.closest('.select-box')){let u=document.getElementById('urunDrop');if(u)u.style.display='none';}});
</script>
</body>
