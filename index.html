<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}
.wrap{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:12px;padding-bottom:90px}
.header{background:#012060;color:white;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -12px 10px -12px}
.logoBay{height:50px;max-width:140px;object-fit:contain;background:white;border-radius:4px;padding:2px}

.ralBoxKompakt{position:relative;display:flex;gap:8px;margin-top:8px;overflow:visible !important;z-index:1001}
.swatchKompakt{width:100px;min-width:100px;height:62px;border-radius:10px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.bilgiKutu{flex:1;height:62px;border:2px solid #012060;border-radius:10px;background:white;display:flex;flex-direction:column;overflow:hidden}
.bilgiUst{display:flex;flex:1;border-bottom:2px solid #012060}.bilgiUst input{border:none;text-align:center;font-size:14px;font-weight:900;padding:6px;flex:1}.bilgiUst input:first-child{border-right:2px solid #012060}

#ralDrop{position:absolute;top:72px;left:0;width:100%;max-width:480px;background:white;border-radius:12px;max-height:65vh;overflow:auto;z-index:99999 !important;display:none;box-shadow:0 20px 60px rgba(0,0,0,0.6);border:3px solid #012060}
.ralItem{padding:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.ralSw{width:40px;height:40px;border-radius:8px;border:1px solid #ddd;min-width:40px}
.s{padding:10px;border:2px solid #e5e5e5;border-radius:10px;width:100%;font-weight:700;font-size:13px}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.amb{padding:12px;border:2px solid #e5e5e5;border-radius:10px;font-weight:800;text-align:center;cursor:pointer;background:white}.amb.active{background:#012060;color:white}
.result{background:#111;color:white;border-radius:16px;padding:14px;margin-top:10px}.big{font-size:22px;font-weight:900}
.settingsBtn{background:#ffcc00;border:none;width:28px;height:28px;border-radius:8px;font-weight:900;color:#012060;cursor:pointer}.settingsCol{display:flex;flex-direction:column;align-items:center;gap:2px}.kurAlt{font-size:9px;color:#ffcc00;font-weight:800}
.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:420px;height:100%;background:white;z-index:99999;padding:16px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:99998}
.firmaInput{margin-top:8px}.firmaInput label{font-size:10px;font-weight:900;color:#012060;display:block;margin-bottom:2px}
.yeniUrunModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:100000;align-items:center;justify-content:center}.yeniUrunBox{background:white;border-radius:16px;padding:20px;width:90%;max-width:400px}
.teklifRow{display:flex;gap:10px;padding:10px;border-bottom:1px dashed #ddd;align-items:center}
.cokGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:8px}
.cokMini{background:white;border:2px solid #012060;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.cokSw{width:50px;height:50px;min-width:50px;border-radius:10px;border:2px solid #012060}
</style>
</head>
<body>
<div class="wrap noPrint">
<div class="header"><div style="display:flex;align-items:center;gap:10px"><img id="firmaLogo" src="" class="logoBay" style="display:none"><div id="firmaYazi" style="font-weight:900;font-size:14px">BAYDEMİR YAPI MARKET</div></div><div style="display:flex;align-items:center;gap:10px"><img src="./jotun.png" class="logoJotun" onerror="this.style.display='none'"><div class="settingsCol"><button class="settingsBtn" onclick="openSettings()">⚙️</button><div id="kurTxt" class="kurAlt">TCMB: -</div><div id="urunSay" style="font-size:9px;color:white"></div></div></div></div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel"><h3>⚙️ AYARLAR & FİRMA</h3><div style="background:#eef3ff;border:2px solid #012060;border-radius:12px;padding:10px;margin-top:12px"><b>🏢 FİRMA</b><div class="firmaInput"><label>FİRMA ADI</label><input id="setFirmaAdi" class="s" oninput="saveFirma()"></div></div><div style="background:#fffbe6;border:2px solid #ffcc00;border-radius:12px;padding:10px;margin-top:12px"><b>💰 FİYAT</b><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div><label style="font-size:10px;font-weight:900">Kar %</label><input id="setKar" class="s" type="number" value="30" oninput="calc()"></div><div><label style="font-size:10px;font-weight:900">KDV %</label><input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div></div><div style="margin-top:8px"><label style="font-size:10px;font-weight:900">Dolar</label><input id="setDolar" class="s" oninput="calc()"></div><button onclick="fetchDolar()" style="margin-top:8px;width:100%;background:#0a7a2f;color:white;border:none;border-radius:10px;padding:10px;font-weight:800">🔄 DOLAR ÇEK</button><div id="kurInfo" style="font-size:11px;color:green;margin-top:6px"></div><div id="ralDurum" style="font-size:11px;color:#0a7a2f;margin-top:6px;font-weight:900"></div><div id="jotunDurum" style="font-size:11px;color:#012060;margin-top:6px;font-weight:900"></div></div><button onclick="saveSettings();closeSettings()" style="width:100%;padding:14px;background:#012060;color:white;border:none;border-radius:10px;font-weight:900;margin-top:16px">✅ KAYDET KAPAT</button></div>
<div class="yeniUrunModal" id="yeniUrunModal" onclick="if(event.target===this)closeYeniUrun()"><div class="yeniUrunBox"><h3 style="color:#012060">➕ YENİ ÜRÜN</h3><div class="firmaInput"><label>ÜRÜN ADI</label><input id="yeniAd" class="s"></div><div class="firmaInput"><label>LT</label><input id="yeniLt" class="s" type="number" step="0.1"></div><div class="firmaInput"><label>FİYAT $</label><input id="yeniFiyat" class="s" type="number" step="0.1"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button onclick="closeYeniUrun()" style="padding:12px;border-radius:10px;border:2px solid #ccc;background:white;font-weight:900">İPTAL</button><button onclick="saveYeniUrun()" style="padding:12px;border-radius:10px;border:none;background:#0a7a2f;color:white;font-weight:900">✅ KAYDET</button></div></div></div>

<div class="card card-ral"><div style="font-size:11px;font-weight:900;color:#012060">1 • RAL - <span id="ralSay">yükleniyor...</span> - ÜSTTE SABİT</div><div class="ralBoxKompakt"><div class="swatchKompakt" id="swatch">BOŞ</div><div class="bilgiKutu"><div class="bilgiUst"><input id="ralInput" placeholder="RAL KODU - 7016" onfocus="openRal()" oninput="openRal()"><div style="flex:1;display:flex;background:#fffbe6"><input id="pigment" placeholder="PIGMENT $" oninput="calc()"></div></div><div class="bilgiAlt"><input id="ralForm" placeholder="FORMÜL - OTOMATİK GELECEK"></div></div><div id="ralDrop"></div></div></div>

<div class="card card-urun"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:11px;font-weight:900;color:#012060">2 • ÜRÜN - <span id="canliSay">0</span> adet - <span id="kaynak" style="color:#0a7a2f;font-size:10px"></span></div><button onclick="loadAll()" style="background:#eef3ff;border:1px solid #012060;border-radius:6px;padding:4px 8px;font-size:10px;font-weight:900">🔄 YENİLE</button></div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="OPTIPRO, PILOT..." onfocus="openUrun()" oninput="openUrun()"><button class="addBtnMain" onclick="openYeniUrun()">+ YENİ ÜRÜN</button><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">3 • AMBALAJ (OTO: 13.5LT → 18L)</div><div class="ambRow" id="ambList"></div></div>


  <div class="result"><div id="hesapDetay" style="font-size:11px;color:#ccc">Ürün ve renk seç</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;background:#1e1e1e;border-radius:10px;padding:12px"><div><div style="font-size:10px;color:#888">SATIŞ LT TL</div><div id="satisLtTL" style="font-weight:900">-</div><div id="formulDetay" style="font-size:9px;color:#aaa;margin-top:4px"></div></div><div><div style="font-size:10px;color:#888">KOVA KDV DAHİL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:13px;font-weight:800">-</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button onclick="kaydetHafiza()" style="background:#ffcc00;border:none;padding:14px;border-radius:10px;font-weight:900;color:#012060">💾 KAYDET</button><button onclick="teklifeEkle()" style="background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:14px;border-radius:10px;font-weight:900">➕ TEKLİFE EKLE</button></div></div>

<div class="card" style="background:#eef3ff;border:2px solid #012060"><div style="display:flex;justify-content:space-between"><b style="font-size:14px;color:#012060">📋 TEKLİF (<span id="teklifSayi">0</span>)</b><button onclick="teklifTemizle()" style="background:#ff4444;color:white;border:none;border-radius:8px;padding:6px 10px;font-size:11px">TEMİZLE</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="musteriAd" class="s" placeholder="Müşteri"><input id="teklifTarih" class="s" type="date"></div><div id="teklifList" style="margin-top:8px"></div><div id="teklifToplam" style="background:#012060;color:white;border-radius:10px;padding:10px;margin-top:8px;font-size:11px;display:none;text-align:right"></div><button onclick="teklifYazdir()" style="width:100%;margin-top:10px;background:#012060;color:white;border:none;border-radius:10px;padding:14px;font-weight:900">🖨️ YAZDIR / PDF</button></div>

<div class="card" style="background:#fffbe6"><b style="font-size:13px">⭐ ÇOK KULLANILANLAR</b><div id="hafizaList" class="cokGrid"></div></div>
</div>

<div id="printArea" style="display:none;background:white;padding:20px;color:#111"><div id="printListe"></div><div id="printToplam"></div></div>

<script>
let urunler=[];let ralList=[];let ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}];
let db=JSON.parse(localStorage.getItem('urun_ral_lt_hafiza')||'{}');
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"kdv":20,"dolar":"49,58","firmaAdi":"BAYDEMİR"}');
let customUrunler=JSON.parse(localStorage.getItem('custom_urunler_v3')||'[]');
let secUrunIdx=null,secAmbIdx=2,secLT=18,tcmbKur=49.58,secRalHex="#FFFFFF",secRalName="",sonHesap=null,secUrunLT=18,sonAutoAmb=-1;
let teklifSepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');
let tempRalKod="";let jotunKayitlar=[];let seciliRalKayitlari=[];
let YEDEK_URUN=[{"ad":"CONSEAL TU BASE 3 (18 LT)","fiyat":5.7,"lt":18},{"ad":"FUTURA CLASSIC BASE 3 COMP A (16.20 LT)","fiyat":6.8,"lt":16.2},{"ad":"OPTIPRO UNI TC BASE 3 A (13.5 LT)","fiyat":6.8,"lt":13.5}];
let YEDEK_RAL=[{kod:"7016",isim:"Antrasit Gri",hex:"#383E42"}];

function formatPara(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}

async function fetchJsonTry(urls){
  for(let u of urls){
    try{
      let r=await fetch(u,{cache:"no-store"});
      if(r.ok){let j=await r.json();if(j&&j.length>0)return {data:j,url:u};}
    }catch(e){console.log('FAIL '+u+' '+e.message);}
  }
  return null;
}

async function loadAll(){
  // 1. PRODUCTS.JSON - 3 YERDEN DENE - SENIN LINK
  let prodUrls=['./products.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/products.json?v='+Date.now(),'https://ahmetdogan68.github.io/jotun/products.json?v='+Date.now()];
  let prodRes=await fetchJsonTry(prodUrls);
  let baseListe=[];
  if(prodRes){
    baseListe=prodRes.data;
    // COMP.B / COMP B FIYATI COMP.A ILE AYNI YAP
    let mapA={};
    baseListe.forEach(o=>{
      let ad=(o.ad||'').toUpperCase();
      if(ad.includes('COMP.A')||ad.includes('COMP A')){
        let key=ad.replace(/COMP\.?\s*A.*/,'').trim();
        mapA[key]=o.fiyat||o.price||0;
      }
    });
    baseListe=baseListe.map(o=>{
      let ad=(o.ad||'').toUpperCase();
      if(ad.includes('COMP.B')||ad.includes('COMP B')){
        let key=ad.replace(/COMP\.?\s*B.*/,'').trim();
        if(mapA[key]!==undefined){o.fiyat=mapA[key];}
      }
      return o;
    });
    document.getElementById('kaynak').innerText="products.json ✓ "+baseListe.length;
    document.getElementById('kurInfo').innerHTML="<span style='color:green'>✓ products.json: "+baseListe.length+" ürün - "+prodRes.url.split('/').pop()+"</span>";
  }else{
    baseListe=YEDEK_URUN;
    document.getElementById('kaynak').innerText="YEDEK "+baseListe.length+" - products.json bozuk!";
    document.getElementById('kurInfo').innerHTML="<span style='color:red'>⚠️ products.json çekilemedi, YEDEK 4 kullanılıyor - JSON virgül hatası var!</span>";
  }

  let merged=[...baseListe];
  for(let c of customUrunler){
    let idx=merged.findIndex(x=>(x.ad||"").toUpperCase()===c.ad.toUpperCase());
    if(idx>-1)merged[idx]=c;else merged.push(c);
  }
  merged.sort((a,b)=>(a.ad||"").toUpperCase().localeCompare((b.ad||"").toUpperCase(),'tr'));
  urunler=merged.map(o=>[o.ad, o.fiyat||o.price||0, o.lt||0, o.kategori||""]);
  document.getElementById('canliSay').innerText=urunler.length;
  document.getElementById('urunSay').innerText=urunler.length+" ürün";

  // 2. RAL.JSON - 215 RENK
  let ralUrls=['./ral.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/ral.json?v='+Date.now(),'https://ahmetdogan68.github.io/jotun/ral.json?v='+Date.now()];
  let ralRes=await fetchJsonTry(ralUrls);
  if(ralRes){ralList=ralRes.data;document.getElementById('ralSay').innerText=ralList.length+' renk ✓';document.getElementById('ralDurum').innerText='✓ RAL: '+ralList.length+' renk';}
  else{ralList=YEDEK_RAL;document.getElementById('ralSay').innerText='YEDEK';}

  // 3. JOTUN_KAYITLAR.JSON - FORMUL KAYIT - USTTE CIKACAK
  let jotunUrls=['./jotun_kayitlar.json?v='+Date.now(),'https://raw.githubusercontent.com/ahmetdogan68/jotun/main/jotun_kayitlar.json?v='+Date.now(),'https://ahmetdogan68.github.io/jotun/jotun_kayitlar.json?v='+Date.now()];
  let jotunRes=await fetchJsonTry(jotunUrls);
  if(jotunRes){jotunKayitlar=jotunRes.data;document.getElementById('jotunDurum').innerText='✓ JOTUN KAYIT: '+jotunKayitlar.length+' formül - üstte çıkacak';}
  else{jotunKayitlar=[];}

  document.getElementById('teklifTarih').valueAsDate=new Date();
  document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;document.getElementById('setDolar').value=ayarlar.dolar;
  filterUrun();renderAmb();bosaltRalPigment();renderHafiza();renderTeklif();fetchDolar();
}

function bosaltRalPigment(){document.getElementById('ralInput').value='';document.getElementById('pigment').value='';document.getElementById('ralForm').value='';document.getElementById('swatch').innerText='BOŞ';document.getElementById('swatch').style.background='#fff';tempRalKod="";secRalHex="#FFFFFF";secRalName="";}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveFirma(){ayarlar.firmaAdi=document.getElementById('setFirmaAdi').value.trim();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||30;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim();saveFirma();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));calc()}
function openYeniUrun(){document.getElementById('yeniUrunModal').style.display='flex';}
function closeYeniUrun(){document.getElementById('yeniUrunModal').style.display='none';}
function saveYeniUrun(){let ad=document.getElementById('yeniAd').value.trim();if(!ad)return;let lt=parseFloat(document.getElementById('yeniLt').value)||18;let fiyat=parseFloat(document.getElementById('yeniFiyat').value)||0;customUrunler.push({ad,fiyat,lt});localStorage.setItem('custom_urunler_v3',JSON.stringify(customUrunler));closeYeniUrun();loadAll();}
async function fetchDolar(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();let kur=j.rates.TRY;if(kur){tcmbKur=kur;let s=kur.toFixed(4).replace('.',',');document.getElementById('setDolar').value=s;}}catch(e){}}

function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun();}
function filterUrun(){
  let q=document.getElementById('urunInput').value.toUpperCase().trim();
  let drop=document.getElementById('urunDrop');
  let html=[];

  // JOTUN KAYIT VARSA USTTE CIKACAK - PIGMENT FORMUL FIYAT YUKARI YAZILACAK
  if(tempRalKod && jotunKayitlar.length>0){
    let filtre=jotunKayitlar.filter(x=>String(x.ral_no)===String(tempRalKod));
    // AYNI BASE + PRODUCT TEKLE, SADECE 1-2 ADET
    let map=new Map();
    filtre.forEach(x=>{
      let key=(x.base_no||'')+"_"+(x.product||'').substring(0,30);
      if(!map.has(key))map.set(key,x);
    });
    seciliRalKayitlari=Array.from(map.values()).slice(0,3);
    if(seciliRalKayitlari.length>0){
      html.push(`<div style="background:#0a7a2f;color:white;padding:8px 10px;font-weight:900;font-size:11px;position:sticky;top:0">✅ RAL ${tempRalKod} KAYITLI FORMÜL - ${seciliRalKayitlari.length} ADET ÜSTTE - SEÇİNCE PIGMENT+FORMÜL YUKARI YAZILACAK</div>`);
      seciliRalKayitlari.forEach((k,ki)=>{
        let uIdx=urunler.findIndex(u=>u[0].toUpperCase().includes((k.product||'').substring(0,20).toUpperCase()));
        if(uIdx===-1)uIdx=urunler.findIndex(u=>u[0].toUpperCase().includes('BASE '+k.base_no));
        if(uIdx===-1)uIdx=0;
        html.push(`<div class="item jcmKayitli" onclick="selectUrunKayitli(${uIdx},${ki})"><div style="flex:1"><b>${k.product||'FUTURA CLASSIC BASE '+k.base_no}</b><br><span style="background:#012060;color:white;padding:2px 6px;border-radius:4px">BASE ${k.base_no}</span> <span style="background:#ff9900;padding:2px 6px;border-radius:4px">${k.can_size||'18L'}</span> <span style="background:#0a7a2f;color:white;padding:2px 6px;border-radius:4px">$${k.colorant_cost||0}</span><div style="margin-top:4px;background:white;border:1px dashed #ff9900;padding:5px 8px;border-radius:6px;font-size:11px;font-weight:700">FORMÜL: ${k.formul||''} | ${k.price||''}</div></div><div style="background:#0a7a2f;color:white;padding:10px 12px;border-radius:8px;font-weight:900">SEÇ</div></div>`);
      });
      html.push(`<div style="background:#012060;color:white;padding:6px 10px;font-weight:900;font-size:10px">--- DİĞER TÜM ÜRÜNLER - ${urunler.length} ADET KOMPLE LİSTE ---</div>`);
    }
  }

  let list=urunler.map((r,i)=>({r,i})).filter(o=>{if(!q)return true;return o.r[0].toUpperCase().includes(q);}).slice(0,150);
  html.push(...list.map(o=>`<div class="item" onclick="selectUrun(${o.i})"><span>${o.r[0]}</span><b style="color:#012060">$${o.r[1]}</b></div>`));
  drop.innerHTML=html.join('');drop.style.display='block';
}
function selectUrunKayitli(uIdx,ki){
  selectUrun(uIdx);
  let k=seciliRalKayitlari[ki];
  if(k){
    document.getElementById('pigment').value=k.colorant_cost||k.pigment||'';
    document.getElementById('ralForm').value=k.formul||k.formula||'';
    // FIYAT YUKARI YAZILACAK - PIGMENT + FORMUL + FIYAT
    if(k.price){document.getElementById('formulDetay').innerText='KAYIT FİYAT: '+k.price;}
    calc();
  }
}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';secUrunLT=parseFloat(u[2])||18;let newIdx=ambalajlar.findIndex(a=>a.lt>=secUrunLT-0.2);if(newIdx===-1)newIdx=2;secAmbIdx=newIdx;secLT=ambalajlar[secAmbIdx].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML=`✓ ${u[0]} • $${u[1]}/LT • ${secUrunLT}LT`;renderAmb();calc();}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let cls="amb";if(i===secAmbIdx)cls+=" active";return `<div class="${cls}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('');}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal();}
function filterRal(){if(!ralList||ralList.length===0)ralList=YEDEK_RAL;let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,120);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="selectRal('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div><b>RAL ${r.kod}</b> - ${r.isim}</div></div>`).join('');document.getElementById('ralDrop').style.display='block';}
function selectRal(k){let r=ralList.find(x=>x.kod===k);if(!r)return;tempRalKod=r.kod;secRalHex=r.hex;secRalName=r.isim;let sw=document.getElementById('swatch');sw.style.background=r.hex;sw.innerText='RAL '+r.kod;sw.style.color=r.hex==="#FFFFFF"?"#012060":"#fff";document.getElementById('ralInput').value=r.kod;document.getElementById('ralDrop').style.display='none';filterUrun();openUrun();calc();}
function calc(){try{if(secUrunIdx===null)return;let pig=parseFloat((document.getElementById('pigment').value||"0").replace(',','.'))||0;let u=urunler[secUrunIdx];let urunFiyat=parseFloat(u[1])||0;let urunLT=parseFloat(secUrunLT)||18;let kovaLT=parseFloat(secLT)||18;let toplam=(urunFiyat*urunLT)+pig;let maliyet=toplam/kovaLT;let kar=parseFloat(document.getElementById('setKar').value)||30;let satis=maliyet*(1+kar/100);let kur=parseFloat((document.getElementById('setDolar').value||"49,58").replace(',','.'))||49.58;let tl=satis*kur;let kovaTl=tl*kovaLT;let kdv=parseFloat(document.getElementById('setKdv').value)||20;let kovaKdv=kovaTl*(1+kdv/100);sonHesap={urun:u[0],ral:tempRalKod,hex:secRalHex,isim:secRalName,lt:kovaLT,pigment:pig,satisTlLt:tl,kovaTl:kovaTl,kovaKdv:kovaKdv,form:document.getElementById('ralForm').value,urunLT:urunLT};document.getElementById('satisLtTL').innerText=formatPara(tl);document.getElementById('satisKova').innerText=formatPara(kovaTl);document.getElementById('satisKovaKdv').innerText='KDV DAHİL: '+formatPara(kovaKdv);document.getElementById('formulDetay').innerHTML=`($${urunFiyat} x ${urunLT}LT + $${pig}) / ${kovaLT}LT`;document.getElementById('hesapDetay').innerHTML=`<div style="display:flex;gap:8px;align-items:center"><div style="width:18px;height:18px;background:${secRalHex};border-radius:4px;border:1px solid #444"></div><b>RAL ${tempRalKod} ${secRalName}</b> • Pigment $${pig}</div>`;}catch(e){}}
function kaydetHafiza(){if(!sonHesap)return alert('Önce ürün ve RAL seç');let key=`${sonHesap.urun}__${sonHesap.ral}__${Date.now()}`;db[key]={...sonHesap,ts:Date.now()};localStorage.setItem('urun_ral_lt_hafiza',JSON.stringify(db));renderHafiza();}
function renderHafiza(){let keys=Object.keys(db).sort((a,b)=>(db[b].ts||0)-(db[a].ts||0));document.getElementById('hafizaList').innerHTML=keys.slice(0,20).map(k=>`<div class="cokMini" onclick="navigator.clipboard.writeText('${db[k].urun}')"><div class="cokSw" style="background:${db[k].hex}"></div><div style="flex:1"><b style="font-size:12px">${db[k].urun}</b><br>RAL ${db[k].ral}</div></div>`).join('');}
function teklifeEkle(){if(!sonHesap)return alert('Önce ürün ve RAL seç');let adet=prompt('Kaç kova?','1');if(!adet)return;teklifSepet.push({...sonHesap,adet:parseInt(adet)||1});localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif();}
function renderTeklif(){document.getElementById('teklifSayi').innerText=teklifSepet.length;document.getElementById('teklifList').innerHTML=teklifSepet.map((t,i)=>`<div style="display:flex;gap:10px;padding:10px;border-bottom:1px dashed #ddd"><div style="flex:1;font-size:12px"><b>${t.urun}</b><br>RAL ${t.ral} x ${t.adet}</div><button onclick="teklifSepet.splice(${i},1);localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif()">❌</button></div>`).join('');}
function teklifTemizle(){if(confirm('Temizlensin mi?')){teklifSepet=[];localStorage.setItem('teklif_sepet','[]');renderTeklif()}}
function teklifYazdir(){alert('Yazdırma '+teklifSepet.length+' ürün');}
loadAll();
document.addEventListener('click',e=>{if(!e.target.closest('.ralBoxKompakt')){let el=document.getElementById('ralDrop');if(el)el.style.display='none';}if(!e.target.closest('.select-box')){let u=document.getElementById('urunDrop');if(u)u.style.display='none';}});
</script>
