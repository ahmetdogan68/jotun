<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAYDEMIR - FIYAT TEKLIF FORMU</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060}.w{max-width:1100px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:8px;padding-bottom:80px}.h{background:#012060;color:#fff;padding:0 12px;height:68px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:500;margin:0 -8px 8px -8px}.logo{height:50px;background:#fff;border-radius:8px;padding:4px;border:2px solid #ffcc00;object-fit:contain}.c{background:#fff;border-radius:10px;padding:10px;margin-top:8px;border:2px solid #012060;position:relative}.sb{position:relative;display:flex;gap:6px}.sb input{flex:1;padding:12px;border:2px solid #012060;border-radius:10px;font-weight:800}.drop{position:absolute;top:105%;left:0;right:0;background:#fff;border-radius:10px;max-height:300px;overflow:auto;z-index:3000;display:none;box-shadow:0 12px 30px rgba(0,0,0,.3);border:2px solid #012060}.it{padding:8px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;font-size:11px;cursor:pointer}.rb{display:flex;gap:6px;margin-top:6px;align-items:center;position:relative}.sw{width:58px;height:44px;border-radius:8px;border:2px solid #012060;background:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}.bil{flex:1;height:44px;border:2px solid #012060;border-radius:8px;background:#fff;display:flex;flex-direction:column;overflow:hidden}.bilU{display:flex;flex:1;border-bottom:2px solid #012060}.bilU div{flex:1;display:flex;align-items:center;justify-content:center}.bilU div:first-child{border-right:2px solid #012060}.bilA{flex:1;display:flex}.bilA input{border:none;width:100%;padding-left:6px;font-size:10px;font-weight:700;background:#f0f4ff}#ralDrop{position:absolute;top:50px;left:0;width:100%;max-width:420px;background:#fff;border-radius:10px;max-height:280px;overflow:auto;z-index:4000;display:none;box-shadow:0 15px 40px rgba(0,0,0,.5);border:2px solid #012060}.ri{padding:7px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #f5f5f5;cursor:pointer}.rs{width:24px;height:24px;border-radius:5px;border:1px solid #ddd}.s{padding:7px;border:2px solid #e5e5e5;border-radius:8px;width:100%;font-weight:700}.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:5px}.amb{padding:10px;border:3px solid #e5e5e5;border-radius:8px;font-weight:900;text-align:center;cursor:pointer;background:#fff}.amb.on{background:#012060;color:#fff;border-color:#ffcc00}.res{background:#111;color:#fff;border-radius:10px;padding:10px;margin-top:8px}.big{font-size:17px;font-weight:900}.setBtn{background:#ffcc00;border:none;width:24px;height:24px;border-radius:5px;font-weight:900;color:#012060;cursor:pointer}.kur{font-size:11px;color:#ffcc00;font-weight:900;background:#000;padding:2px 6px;border-radius:5px;border:1px solid #ffcc00}.setP{display:none;position:fixed;top:0;right:0;width:100%;max-width:400px;height:100%;background:#fff;z-index:99999;padding:12px;overflow:auto}.over{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:99998}.btnS{background:#012060;color:#fff;border:none;border-radius:7px;padding:0 8px;font-weight:900;cursor:pointer;min-width:32px}.wa{background:#25D366;color:#fff;border:none;border-radius:7px;padding:9px;font-weight:900;cursor:pointer}
</style></head><body><div class="w">
<div class="h"><div style="display:flex;gap:10px;align-items:center"><img id="fLogo" src="" class="logo" style="display:none"><div style="font-weight:900">BAYDEMIR</div></div><div style="display:flex;gap:10px;align-items:center"><img id="jLogo" src="./jotun.png" class="logo" style="border-color:#012060" onerror="this.style.display='none'"><div style="display:flex;flex-direction:column;align-items:center;gap:2px"><button class="setBtn" onclick="openSet()">⚙</button><div id="kurTxt" class="kur">49,6802</div></div></div></div>
<div class="over" id="over" onclick="closeSet()"></div><div class="setP" id="setP"><h3>⚙ AYARLAR</h3><div style="margin-top:8px">Firma<input id="setFirma" class="s" oninput="saveF()"></div><div style="margin-top:4px">Firma Logo URL<input id="setFL" class="s" oninput="saveF()"></div><div style="margin-top:4px">Jotun Logo URL<input id="setJL" class="s" value="./jotun.png" oninput="saveF()"></div><div style="margin-top:4px">Telefon<input id="setTel" class="s" oninput="saveF()"></div><div style="margin-top:4px">Veren<input id="setVeren" class="s" oninput="saveF()"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px"><div>Kar%<input id="setKar" class="s" type="number" value="25" oninput="calc()"></div><div>KDV%<input id="setKdv" class="s" type="number" value="20" oninput="calc()"></div></div><div style="margin-top:4px">Dolar<input id="setDolar" class="s" value="49,6802" oninput="calc()"></div><button onclick="fetchDolar()" style="margin-top:5px;width:100%;background:#0a7a2f;color:#fff;border:none;border-radius:6px;padding:8px;font-weight:800">🔄 DOLAR ÇEK</button><button onclick="saveSet();closeSet()" style="width:100%;padding:11px;background:#012060;color:#fff;border:none;border-radius:6px;font-weight:900;margin-top:8px">KAYDET KAPAT</button></div>
<div class="c"><div style="font-size:11px;font-weight:900;color:#012060">1 • RAL</div><div class="rb"><div class="sw" id="swatch">BOŞ</div><div class="bil"><div class="bilU"><div><input id="ralInput" placeholder="9010" readonly onclick="enableRal()" style="border:none;width:100%;text-align:center;font-weight:900"></div><div style="background:#fffbe6"><input id="pigment" placeholder="0,00" style="border:none;background:transparent;width:100%;text-align:center;font-weight:900" oninput="calc()"><span style="font-size:10px;font-weight:900;padding-right:3px">TL</span></div></div><div class="bilA"><input id="ralForm" placeholder="FORMÜL"></div></div><button class="btnS" onclick="enableRal()">🔍</button><div id="ralDrop"></div></div></div>
<div class="c"><div style="font-size:11px;font-weight:900;color:#012060">2 • ÜRÜN - <span id="canliSay">0</span></div><div class="sb" style="margin-top:6px"><input id="urunInput" placeholder="Ürün ara" readonly onclick="enableUrun()" oninput="filterUrun()"><button class="btnS" onclick="enableUrun()">🔍</button><div class="drop" id="urunDrop"></div></div></div>
<div class="c"><div style="font-size:11px;font-weight:900;color:#012060">3 • AMBALAJ</div><div class="ambRow" id="ambList"></div></div>
<div class="res"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:#1e1e1e;border-radius:8px;padding:8px"><div><div style="font-size:9px;color:#888">LT MALİYET</div><div id="maliyet" style="font-weight:900">-</div></div><div><div style="font-size:9px;color:#888">LT SATIŞ</div><div id="ltSatis" style="font-weight:900;color:#ffcc00">-</div></div><div><div style="font-size:9px;color:#888">KOVA SATIŞ</div><div id="kova" class="big">-</div><div id="kovaKdv" style="color:#ffcc00;font-size:11px;font-weight:800">-</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button onclick="teklifeEkle()" style="background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:10px;border-radius:8px;font-weight:900">➕ EKLE</button><button onclick="kaydet()" style="background:#ffcc00;border:none;padding:10px;border-radius:8px;font-weight:900;color:#012060">💾 KAYDET</button></div></div>
<div class="c" style="background:#eef3ff"><div style="display:flex;justify-content:space-between"><b style="font-size:11px">📋 TEKLİF (<span id="teklifSayi">0</span>)</b><button onclick="temizle()" style="background:#ff4444;color:#fff;border:none;border-radius:5px;padding:3px 6px;font-size:9px">TEMİZLE</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px"><input id="musteriAd" class="s" placeholder="Müşteri Adı"><input id="tarih" class="s" type="date"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px"><input id="musteriTel" class="s" placeholder="Müşteri Tel"><input id="verenInput" class="s" placeholder="Teklifi Veren"></div><div style="display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:4px"><input id="firmaTel" class="s" placeholder="Firma WhatsApp"><button onclick="waGonder()" class="wa">💬 WhatsApp</button></div><div id="teklifList" style="margin-top:5px"></div><div id="teklifToplam" style="background:#012060;color:#fff;border-radius:6px;padding:6px;margin-top:4px;font-size:10px;display:none"></div><button onclick="yazdir()" style="width:100%;margin-top:6px;background:#012060;color:#fff;border:none;border-radius:6px;padding:11px;font-weight:900">🖨️ FİYAT TEKLİF FORMU - YAZDIR / PDF</button></div></div>
<script>
let urunler=[],ralList=[],amb=[{ad:"3.6L",lt:3.6},{ad:"4.5L",lt:4.5},{ad:"18L",lt:18}];
let ayar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":25,"kdv":20,"dolar":"49,6802","firmaAdi":"BAYDEMIR BOYA","firmaLogo":"","jotunLogo":"./jotun.png","telefon":"","teklifVeren":""}');
let secUrun=null,secAmb=2,secLT=18,secHex="#FFF",son=null,tempRal="9010",secName="",sepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');
function fmt(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
async function loadAll(){try{let r=await fetch('./products.json?v='+Date.now());let j=await r.json();urunler=j.map(o=>[o.ad,parseFloat(o.fiyat)||0]);document.getElementById('canliSay').innerText=urunler.length}catch(e){}try{let r2=await fetch('./ral.json?v='+Date.now());let j2=await r2.json();ralList=j2;}catch(e){}document.getElementById('setFirma').value=ayar.firmaAdi||'';document.getElementById('setFL').value=ayar.firmaLogo||'';document.getElementById('setJL').value=ayar.jotunLogo||'./jotun.png';document.getElementById('setTel').value=ayar.telefon||'';document.getElementById('setVeren').value=ayar.teklifVeren||'';document.getElementById('firmaTel').value=ayar.telefon||'';document.getElementById('verenInput').value=ayar.teklifVeren||'';if(ayar.firmaLogo){document.getElementById('fLogo').src=ayar.firmaLogo;document.getElementById('fLogo').style.display='block'}document.getElementById('jLogo').src=ayar.jotunLogo||'./jotun.png';document.getElementById('setKar').value=ayar.kar;document.getElementById('setKdv').value=ayar.kdv;document.getElementById('setDolar').value=ayar.dolar;document.getElementById('kurTxt').innerText=ayar.dolar;document.getElementById('tarih').valueAsDate=new Date();renderAmb();renderTeklif()}
function openSet(){document.getElementById('setP').style.display='block';document.getElementById('over').style.display='block'}function closeSet(){document.getElementById('setP').style.display='none';document.getElementById('over').style.display='none'}
function saveF(){ayar.firmaAdi=document.getElementById('setFirma').value;ayar.firmaLogo=document.getElementById('setFL').value;ayar.jotunLogo=document.getElementById('setJL').value;ayar.telefon=document.getElementById('setTel').value;ayar.teklifVeren=document.getElementById('setVeren').value;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayar));}
function saveSet(){saveF();ayar.kar=parseFloat(document.getElementById('setKar').value)||25;ayar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayar.dolar=document.getElementById('setDolar').value;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayar));document.getElementById('kurTxt').innerText=ayar.dolar;document.getElementById('firmaTel').value=ayar.telefon;document.getElementById('verenInput').value=ayar.teklifVeren;closeSet();calc()}
async function fetchDolar(){try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let j=await r.json();let k=j.rates.TRY;if(k){let s=k.toFixed(4).replace('.',',');document.getElementById('setDolar').value=s;ayar.dolar=s;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayar));document.getElementById('kurTxt').innerText=s;calc()}}catch(e){}}
function enableUrun(){let i=document.getElementById('urunInput');i.removeAttribute('readonly');i.focus();openUrun()}function enableRal(){let i=document.getElementById('ralInput');i.removeAttribute('readonly');i.focus();openRal()}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun()}function openRal(){document.getElementById('ralDrop').style.display='block';filterRal()}
function filterUrun(){let q=document.getElementById('urunInput').value.toUpperCase().trim();let d=document.getElementById('urunDrop');let list=urunler.filter(r=>!q||r[0].toUpperCase().includes(q)).slice(0,200);d.innerHTML=list.map(r=>`<div class="it" onclick="selectUrun(${urunler.indexOf(r)})"><span>${r[0]}</span> <b>$${r[1]}</b></div>`).join('');d.style.display='block'}
function selectUrun(i){secUrun=i;let u=urunler[i];let inp=document.getElementById('urunInput');inp.value=u[0];inp.setAttribute('readonly','true');document.getElementById('urunDrop').style.display='none';calc()}
function renderAmb(){document.getElementById('ambList').innerHTML=amb.map((a,i)=>{let c="amb";if(i===secAmb)c+=" on";return `<div class="${c}" onclick="secAmb=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('')}
function filterRal(){let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,60);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ri" onclick="selectRal('${r.kod}')"><div class="rs" style="background:${r.hex}"></div><div><b>${r.kod}</b> ${r.isim}</div></div>`).join('');document.getElementById('ralDrop').style.display='block'}
function selectRal(k){let r=ralList.find(x=>x.kod===k);if(!r)return;tempRal=r.kod;secHex=r.hex;secName=r.isim;let sw=document.getElementById('swatch');sw.style.background=r.hex;sw.innerText='RAL '+r.kod;let inp=document.getElementById('ralInput');inp.value=r.kod;inp.setAttribute('readonly','true');document.getElementById('ralDrop').style.display='none';calc()}
function calc(){if(secUrun===null)return;let u=urunler[secUrun];let fiyatD=parseFloat(u[1])||0;let kLT=parseFloat(secLT)||18;let kur=parseFloat((document.getElementById('setDolar').value||"49,6802").replace(',','.'))||49.68;let kar=parseFloat(document.getElementById('setKar').value)||25;let kdv=parseFloat(document.getElementById('setKdv').value)||20;let pig=parseFloat((document.getElementById('pigment').value||"0").replace(',','.'))||0;let pigLT=pig/18;let urunLT=fiyatD*kur;let topLT=urunLT+pigLT;let ltS=topLT*(1+kar/100);let kovaS=ltS*kLT;let kovaK=kovaS*(1+kdv/100);son={urun:u[0],ral:tempRal,hex:secHex,isim:secName,lt:kLT,kovaTl:kovaS,kovaKdv:kovaK,form:document.getElementById('ralForm').value};document.getElementById('maliyet').innerText=fmt(topLT);document.getElementById('ltSatis').innerText=fmt(ltS);document.getElementById('kova').innerText=fmt(kovaS);document.getElementById('kovaKdv').innerText='KDV DAHİL: '+fmt(kovaK)}
function teklifeEkle(){if(!son)return alert('Önce seç');let a=prompt('Kaç adet?','1');if(!a)return;sepet.push({...son,adet:parseInt(a)||1});localStorage.setItem('teklif_sepet',JSON.stringify(sepet));renderTeklif()}
function renderTeklif(){document.getElementById('teklifSayi').innerText=sepet.length;if(sepet.length===0){document.getElementById('teklifList').innerHTML='<div style="font-size:9px;color:#999">Yok</div>';document.getElementById('teklifToplam').style.display='none';return}let g=0;document.getElementById('teklifList').innerHTML=sepet.map((t,i)=>{g+=t.kovaKdv*t.adet;return `<div style="display:flex;gap:6px;padding:7px;border:1px solid #ddd;border-radius:7px;margin-bottom:3px;background:#fff;align-items:center"><div style="width:22px;height:22px;background:${t.hex};border-radius:5px;border:1px solid #999"></div><div style="flex:1"><div style="font-weight:900;font-size:11px">${t.urun} - RAL ${t.ral}</div><div style="font-size:10px">Adet:${t.adet} | ${fmt(t.kovaKdv)}</div></div><button onclick="sil(${i})" style="background:#ff4444;color:#fff;border:none;border-radius:5px;padding:5px 8px">X</button></div>`}).join('');document.getElementById('teklifToplam').style.display='block';document.getElementById('teklifToplam').innerText='TOPLAM: '+fmt(g)}
function sil(i){sepet.splice(i,1);localStorage.setItem('teklif_sepet',JSON.stringify(sepet));renderTeklif()}function temizle(){if(confirm('Temizle?')){sepet=[];localStorage.setItem('teklif_sepet','[]');renderTeklif()}}
function waGonder(){let tel=document.getElementById('firmaTel').value||ayar.telefon||'';if(!tel){alert('Telefon gir');return}let c=tel.replace(/\D/g,'');if(c.startsWith('0'))c='90'+c.substring(1);if(!c.startsWith('90'))c='90'+c;let must=document.getElementById('musteriAd').value||'Müşteri';let txt=`Merhaba ${must}, boya teklifiniz hazır. ${sepet.length} kalem.`;window.open(`https://wa.me/${c}?text=`+encodeURIComponent(txt),'_blank')}
function yazdir(){if(sepet.length===0){alert('Boş');return}let must=document.getElementById('musteriAd').value||'Müşteri';let mustTel=document.getElementById('musteriTel').value||'';let firmaTel=document.getElementById('firmaTel').value||ayar.telefon||'';let veren=document.getElementById('verenInput').value||ayar.teklifVeren||'';let tarih=document.getElementById('tarih').value||new Date().toLocaleDateString('tr-TR');let firma=ayar.firmaAdi||'BAYDEMIR BOYA';let logo=ayar.firmaLogo||'';let jLogo=ayar.jotunLogo||'./jotun.png';let kdvO=parseFloat(document.getElementById('setKdv').value)||20;let haric=0,dahil=0;sepet.forEach(t=>{dahil+=t.kovaKdv*t.adet;haric+=t.kovaTl*t.adet});let fark=dahil-haric;let rows=sepet.map(t=>`<tr><td style="text-align:center"><div style="width:24px;height:24px;background:${t.hex};border:1.5px solid #000;border-radius:4px;display:inline-block"></div><div style="font-size:8px;font-weight:900">RAL ${t.ral}</div></td><td><div style="font-weight:800;font-size:11px">${t.urun}</div><div style="font-size:9px;color:#555">${t.isim||''} ${t.form?('• '+t.form):''}</div></td><td style="text-align:center;font-weight:700">${t.adet} Adet</td><td style="text-align:right;font-weight:700">${fmt(t.kovaKdv)}</td><td style="text-align:right;font-weight:900">${fmt(t.kovaKdv*t.adet)}</td></tr>`).join('');let h=`<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Fiyat Teklifi</title><style>@page{size:A4 portrait;margin:12mm}*{box-sizing:border-box}body{font-family:Arial;margin:0;padding:0;color:#111;font-size:11px}.page{width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:12mm;display:flex;flex-direction:column}.header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #012060;padding-bottom:10px}.logos{display:flex;gap:10px;align-items:center}.logo{height:52px;background:#fff;border-radius:7px;padding:4px;border:2px solid #ffcc00;object-fit:contain}.logoJ{height:52px;background:#fff;border-radius:7px;padding:4px;border:2px solid #012060;object-fit:contain}.title{font-size:17px;font-weight:900;color:#012060}.info{margin-top:10px;border:1.5px solid #012060;border-radius:7px;padding:8px;display:flex;justify-content:space-between;background:#f8f9fc}.info b{color:#012060}table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#012060;color:#fff;padding:8px 6px;text-align:left;font-size:10px}th:nth-child(3){text-align:center}th:nth-child(4),th:nth-child(5){text-align:right}td{padding:8px 6px;border-bottom:1px solid #e0e0e0}.totals{margin-top:10px;display:flex;justify-content:flex-end}.box{width:250px;border:1.5px solid #012060;border-radius:7px;overflow:hidden}.row{display:flex;justify-content:space-between;padding:6px 9px;font-size:11px;border-bottom:1px solid #eee}.row.total{background:#012060;color:#fff;font-weight:900;font-size:12px}.note{margin-top:10px;background:#fffbe6;border-left:4px solid #ffcc00;padding:7px 9px;border-radius:5px;font-size:9px;line-height:1.4;color:#333}.sign{margin-top:auto;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.signB{border-top:1.5px solid #111;padding-top:5px;text-align:center;font-size:10px}.footer{margin-top:8px;text-align:center;font-size:8px;color:#777;border-top:1px dashed #ccc;padding-top:5px}@media print{.no-print{display:none}}</style></head><body><div class="page"><div class="header"><div class="logos">${logo?`<img src="${logo}" class="logo">`:''}<img src="${jLogo}" class="logoJ"><div><div class="title">FIYAT TEKLIF FORMU</div><div style="font-size:11px;color:#333">${firma} - Jotun Sistemleri</div></div></div><div style="text-align:right"><div style="font-weight:900">JOTUN</div><div style="font-size:10px">Tarih:${tarih}</div></div></div><div class="info"><div><b>Müşteri:</b> ${must}<br><b>Tel:</b> ${mustTel||'-'}</div><div style="text-align:right"><b>Firma Tel/WhatsApp:</b> ${firmaTel||'-'}<br><b>Veren:</b> ${veren||'-'}</div></div><table><thead><tr><th>RENK</th><th>ÜRÜN / FORMÜL</t
