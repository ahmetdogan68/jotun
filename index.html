<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOTUN - ARADA FORMUL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:#012060;padding:0}
.wrap{max-width:560px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:8px;padding-bottom:90px}
.header{background:#012060;color:white;padding:10px 12px;border-radius:0 0 16px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;margin:-8px -8px 8px -8px;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.logo{height:34px}.card{background:white;border-radius:16px;padding:10px;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.select-box{position:relative}.select-box input{width:100%;padding:14px;border:2px solid #012060;border-radius:12px;font-size:15px;font-weight:700}
.drop{position:absolute;top:56px;left:0;right:0;background:white;border-radius:12px;max-height:60vh;overflow:auto;z-index:300;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.25);border:1px solid #ddd}
.item{padding:10px 12px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between}
.ralItem{padding:10px 12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #f5f5f5}
.ralSw{width:44px;height:44px;border-radius:10px;border:1px solid #ddd}
.s{padding:12px;border:2px solid #e5e5e5;border-radius:10px;width:100%;font-weight:700;font-size:13px}
.ralBoxBig{display:flex;gap:12px;margin-top:8px}.swatchHuge{width:140px;min-width:140px;height:90px;border-radius:16px;border:3px solid #012060;box-shadow:0 6px 18px rgba(0,0,0,0.25);background:#fff}
.ralInputBig{flex:1}.ralInputBig input{height:90px;font-size:30px;font-weight:900;text-align:center;border-width:3px;border-radius:16px;background:white}
.aradaBox{background:#f0f4ff;border:2px solid #012060;border-radius:12px;padding:8px;margin-top:8px;display:grid;grid-template-columns:1fr 110px 110px;gap:6px}
.aradaLabel{font-size:9px;font-weight:900;color:#012060;margin-bottom:2px}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px}.amb{padding:10px 4px;border:2px solid #e5e5e5;border-radius:10px;font-weight:800;text-align:center;cursor:pointer;background:white}.amb.active{background:#012060;color:white}
.result{background:#111;color:white;border-radius:16px;padding:12px;margin-top:8px}.big{font-size:22px;font-weight:900}
.settingsBtn{background:#ffcc00;border:none;padding:8px 14px;border-radius:20px;font-weight:900;color:#012060}
.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:380px;height:100%;background:white;z-index:999;padding:14px;overflow:auto}.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:998}
.cokGrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}.cokMini{background:white;border:2px solid #012060;border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.cokSw{width:56px;height:56px;min-width:56px;border-radius:12px;border:2px solid #012060}.cokInfo{flex:1;overflow:hidden}.cokRal{font-weight:900;font-size:14px;color:#012060}.cokUrun{font-size:10px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teklifRow{display:flex;gap:8px;padding:10px;border-bottom:1px dashed #ddd;align-items:center}
@media print{.noPrint{display:none}#printArea{display:block!important}body{background:white}.wrap{max-width:100%;padding:0}}
</style>
</head>
<body>
<div class="wrap noPrint">
<div class="header">
<div style="display:flex;align-items:center;gap:8px"><img id="firmaLogo" src="" class="logo" style="display:none;background:white;padding:2px 6px;border-radius:6px"><div id="firmaYazi" style="font-weight:900">ELEMENT BOYA</div><div id="kurTxt" style="font-size:9px;color:#a8c0e0">TCMB: -</div></div>
<div style="display:flex;gap:8px;align-items:center"><img src="https://jcm.jotun.com/assets/logo-jotun-Bjw4Kkeb.svg" class="logo" style="background:white;padding:3px 8px;border-radius:6px"><button class="settingsBtn" onclick="openSettings()">⚙️</button></div>
</div>
<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel"><h3>AYARLAR</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><div><label style="font-size:11px;font-weight:800">Kar %</label><input id="setKar" class="s" type="number" value="30"></div><div><label style="font-size:11px;font-weight:800">KDV %</label><input id="setKdv" class="s" type="number" value="20"></div></div><div style="margin-top:8px"><label style="font-size:11px;font-weight:800">Firma Logo URL</label><input id="setFirmaLogo" class="s" oninput="saveFirmaLogo()"></div><div style="margin-top:8px"><label style="font-size:11px;font-weight:800">Dolar</label><input id="setDolar" class="s"></div><button onclick="fetchTCMB()" style="margin-top:8px;width:100%;background:#0a7a2f;color:white;border:none;border-radius:10px;padding:12px;font-weight:800">🔄 TCMB ÇEK</button><div id="kurInfo" style="font-size:11px;color:green;margin-top:6px"></div><button onclick="saveSettings();closeSettings()" style="width:100%;padding:12px;background:#012060;color:white;border:none;border-radius:10px;font-weight:800;margin-top:12px">KAYDET</button></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">1 • ÜRÜN</div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="CONSEAL, PILOT..." onfocus="openUrun()" oninput="openUrun()"><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">2 • RAL - BÜYÜK RENK</div>
<div class="ralBoxBig"><div class="swatchHuge" id="swatch"></div><div class="ralInputBig select-box"><input id="ralInput" placeholder="9010" onfocus="openRal()" oninput="openRal()"><div class="drop" id="ralDrop"></div></div></div>

<!-- İSTEDİĞİN ARADA - FORMUL PIGMENT MALIYET HEPSİ BURADA -->
<div class="aradaBox">
<div><div class="aradaLabel">FORMÜL</div><input id="ralForm" class="s" placeholder="Formül" style="padding:10px;font-size:12px"></div>
<div><div class="aradaLabel">PİGMENT $</div><input id="pigment" class="s" placeholder="$" style="padding:10px;font-size:13px;background:#fffbe6"></div>
<div><div class="aradaLabel">MALİYET LT $</div><div id="maliyetBadge" style="background:#012060;color:#ffcc00;padding:10px;border-radius:10px;font-weight:900;text-align:center;font-size:13px">- $</div></div>
</div>

<div style="margin-top:8px"><div style="font-size:11px;font-weight:900;color:#012060">3 • KOVA</div><div class="ambRow" id="ambList"></div></div></div>

<div class="result"><div id="hesapDetay" style="font-size:11px;color:#ccc"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;background:#1e1e1e;border-radius:10px;padding:10px">
<div><div style="font-size:9px;color:#888">SATIŞ LT TL</div><div id="satisLtTL" style="font-weight:900">-</div></div>
<div><div style="font-size:9px;color:#888">KOVA TL KDV DAHİL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-size:12px;font-weight:800">-</div></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
<button onclick="kaydetHafiza()" style="background:#ffcc00;border:none;padding:12px;border-radius:10px;font-weight:900;color:#012060">💾 KAYDET</button>
<button onclick="teklifeEkle()" style="background:#012060;border:2px solid #ffcc00;color:#ffcc00;padding:12px;border-radius:10px;font-weight:900">➕ TEKLİFE EKLE</button>
</div>
</div>

<div class="card" style="background:#eef3ff;border:2px solid #012060">
<div style="display:flex;justify-content:space-between"><b style="font-size:13px;color:#012060">📋 TEKLİF SEPETİ (<span id="teklifSayi">0</span>)</b><button onclick="teklifTemizle()" style="background:#ff4444;color:white;border:none;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:800">TEMİZLE</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><input id="musteriAd" class="s" placeholder="Müşteri Adı"><input id="teklifTarih" class="s" type="date"></div>
<div id="teklifList" style="margin-top:8px"></div>
<div id="teklifToplam" style="background:#012060;color:white;border-radius:10px;padding:10px;margin-top:8px;font-weight:900;display:none"></div>
<button onclick="teklifYazdir()" style="width:100%;margin-top:8px;background:#012060;color:white;border:none;border-radius:10px;padding:14px;font-weight:900">🖨️ TEKLİF FORMU YAZDIR / PDF</button>
</div>

<div class="card" style="background:#fffbe6"><b style="font-size:12px">⭐ ÇOK KULLANILANLAR - RENK + AD + ÜRÜN</b><div id="hafizaList" class="cokGrid"></div><div style="margin-top:8px;border-top:1px dashed #ccc;padding-top:8px"><b style="font-size:11px">🌍 ORTAK</b><div id="ortakList" class="cokGrid"></div></div></div>
</div>

<div id="printArea" style="display:none;background:white;padding:20px;color:#111"><div style="display:flex;justify-content:space-between;border-bottom:3px solid #012060;padding-bottom:12px"><div><div id="printFirma" style="font-weight:900;font-size:18px;color:#012060">ELEMENT BOYA</div><div style="font-size:11px;color:#666">Jotun - Aksaray</div></div><img src="https://jcm.jotun.com/assets/logo-jotun-Bjw4Kkeb.svg" style="height:40px"></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-size:12px"><div><b>Müşteri:</b> <span id="printMusteri">-</span></div><div><b>Tarih:</b> <span id="printTarih">-</span></div></div><div id="printListe" style="margin-top:8px"></div><div id="printToplam" style="margin-top:12px;background:#f5f5f5;padding:12px;border-radius:8px"></div></div>

<script>
let urunler=[], ralList=[], ortakDb=[];let ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}];let db=JSON.parse(localStorage.getItem('urun_ral_lt_hafiza')||'{}');let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"kdv":20,"dolar":"49,4945","firmaLogo":""}');let secUrunIdx=null,secAmbIdx=2,secLT=18,tcmbKur=49.49,secRalHex="#FFF",secRalName="",sonHesap=null;let teklifSepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');
async function loadAll(){try{let r=await fetch('./products.json?v='+Date.now());let d=await r.json();urunler=d.map(o=>[o.ad,o.fiyat,o.lt]);}catch(e){let loc=JSON.parse(localStorage.getItem('jotun_urunler_v2')||'null');if(loc)urunler=loc}try{let r2=await fetch('./ral.json?v='+Date.now());ralList=await r2.json();}catch(e){ralList=[{kod:"7016",isim:"Antrasit",hex:"#383E42"},{kod:"9010",isim:"Saf Beyaz",hex:"#FFFFFF"}]}try{let r3=await fetch('./ortak_kayitlar.json?v='+Date.now());ortakDb=await r3.json()}catch(e){ortakDb=[]}if(ayarlar.firmaLogo){document.getElementById('firmaLogo').src=ayarlar.firmaLogo;document.getElementById('firmaLogo').style.display='block';document.getElementById('firmaYazi').style.display='none';document.getElementById('setFirmaLogo').value=ayarlar.firmaLogo}document.getElementById('teklifTarih').valueAsDate=new Date();filterUrun();renderHafiza();renderOrtak();renderTeklif();}
function parsePara(v){return parseFloat(String(v||'').replace(',','.').replace(/[^0-9.-]/g,''))||0}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveFirmaLogo(){let url=document.getElementById('setFirmaLogo').value.trim();ayarlar.firmaLogo=url;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));if(url){document.getElementById('firmaLogo').src=url;document.getElementById('firmaLogo').style.display='block';document.getElementById('firmaYazi').style.display='none'}else{document.getElementById('firmaLogo').style.display='none';document.getElementById('firmaYazi').style.display='block'}}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||30;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim();localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));calc()}
async function fetchTCMB(){let info=document.getElementById('kurInfo');info.innerText='Çekiliyor...';try{let r=await fetch('https://api.allorigins.win/raw?url=https://www.tcmb.gov.tr/kurlar/today.xml');let t=await r.text();let m=t.match(/Kod="USD"[\s\S]*?EffectiveSelling>([\d.]+)/);if(m){tcmbKur=parseFloat(m[1]);let s=tcmbKur.toFixed(4).replace('.',',');document.getElementById('setDolar').value=s;info.innerText='✓ '+tcmbKur;saveSettings();calc();return}}catch(e){}info.innerText='Manuel gir';}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun()}function filterUrun(){let q=document.getElementById('urunInput').value.toUpperCase().trim();let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||q.length<2||o.r[0].toUpperCase().includes(q)).slice(0,80);document.getElementById('urunDrop').innerHTML=list.map(o=>`<div class="item" onclick="selectUrun(${o.i})"><span style="font-size:11px">${o.r[0]}</span><b>$${o.r[1]}</b></div>`).join('')}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';secLT=u[2];secAmbIdx=ambalajlar.findIndex(a=>a.lt===secLT);if(secAmbIdx===-1)secAmbIdx=2;secLT=ambalajlar[secAmbIdx].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML=`✓ ${u[0]} • $${u[1]}/LT`;renderAmb();calc()}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>`<div class="amb ${i===secAmbIdx?'active':''}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`).join('')}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal()}function filterRal(){let q=document.getElementById('ralInput').value.toUpperCase().trim();let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,60);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="selectRal('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div><b>RAL ${r.kod}</b><div style="font-size:11px;color:#666">${r.isim}</div></div></div>`).join('')}
function selectRal(k){let r=ralList.find(x=>x.kod===k);if(!r)return;document.getElementById('ralInput').value=r.kod;document.getElementById('ralDrop').style.display='none';secRalHex=r.hex;secRalName=r.isim;document.getElementById('swatch').style.background=r.hex;calc()}
function calc(){if(secUrunIdx===null)return;let pigStr=document.getElementById('pigment').value.trim();let pigToplam=pigStr?parsePara(pigStr):0;let u=urunler[secUrunIdx];let kovaLT=secLT;let pigLt=kovaLT?(pigToplam/kovaLT):0;let maliyetLt=u[1]+pigLt;let kar=ayarlar.kar||30;let satisDolarLt=maliyetLt*(1+kar/100);let kur=ayarlar.dolar?parsePara(ayarlar.dolar):tcmbKur;let satisTlLt=satisDolarLt*kur;let kovaTl=satisTlLt*kovaLT;let kdv=ayarlar.kdv||20;let kovaKdv=kovaTl*(1+kdv/100);sonHesap={urun:u[0],ral:document.getElementById('ralInput').value,hex:secRalHex,isim:secRalName,lt:kovaLT,pigment:pigToplam,maliyetLt,satisDolarLt,satisTlLt,kovaTl,kovaKdv,form:document.getElementById('ralForm').value};document.getElementById('maliyetBadge').innerText=`$${maliyetLt.toFixed(2)}`;document.getElementById('satisLtTL').innerText=`${satisTlLt.toFixed(2)} TL`;document.getElementById('satisKova').innerText=`${kovaTl.toFixed(0)} TL`;document.getElementById('satisKovaKdv').innerText=`KDV: ${kovaKdv.toFixed(0)} TL`;document.getElementById('hesapDetay').innerHTML=`<div style="display:flex;gap:8px;align-items:center"><div style="width:22px;height:22px;background:${secRalHex};border-radius:6px;border:1px solid #444"></div><b>RAL ${sonHesap.ral||'-'} ${secRalName}</b> • ${u[0].substring(0,22)}</div><div style="margin-top:4px;color:#888">Pigment LT $${pigLt.toFixed(2)} | Maliyet $${maliyetLt.toFixed(2)} + %${kar}</div>`;document.getElementById('kurTxt').innerText=`TCMB: ${kur.toFixed(4)}`}
function kaydetHafiza(){if(!sonHesap)return alert('Ürün ve RAL seç');let key=`${sonHesap.urun}__${sonHesap.ral}__${sonHesap.lt}__${Date.now()}`;db[key]={...sonHesap,ts:Date.now(),pigmentDisplay:document.getElementById('pigment').value,urunTam:sonHesap.urun};localStorage.setItem('urun_ral_lt_hafiza',JSON.stringify(db));renderHafiza()}
function teklifeEkle(){if(!sonHesap)return alert('Önce ürün ve RAL seç');let adet=prompt('Kaç kova?', '1');if(!adet)return;teklifSepet.push({...sonHesap,adet:parseInt(adet)||1,id:Date.now()});localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif();}
function renderTeklif(){document.getElementById('teklifSayi').innerText=teklifSepet.length;if(teklifSepet.length===0){document.getElementById('teklifList').innerHTML='<div style="font-size:11px;color:#999;padding:8px">Henüz ürün eklenmedi</div>';document.getElementById('teklifToplam').style.display='none';return}let toplam=0,toplamKdv=0;document.getElementById('teklifList').innerHTML=teklifSepet.map((t,i)=>{toplam+=t.kovaTl*t.adet;toplamKdv+=t.kovaKdv*t.adet;return `<div class="teklifRow"><div style="width:40px;height:40px;background:${t.hex};border-radius:10px;border:2px solid #012060;min-width:40px"></div><div style="flex:1"><div style="font-weight:900;font-size:12px;color:#012060">RAL ${t.ral} - ${t.isim}</div><div style="font-size:10px;color:#666">${t.urun.substring(0,28)} • ${t.lt}LT • ${t.adet} kova • Formül: ${t.form||'-'}</div><div style="font-size:11px;font-weight:800">${t.kovaKdv.toFixed(0)} TL x ${t.adet} = ${(t.kovaKdv*t.adet).toFixed(0)} TL</div></div><button onclick="teklifSil(${i})" style="background:#ffdddd;border:none;border-radius:8px;padding:6px 8px">❌</button></div>`}).join('');document.getElementById('teklifToplam').style.display='block';document.getElementById('teklifToplam').innerHTML=`TOPLAM: ${toplam.toFixed(0)} TL + KDV = ${toplamKdv.toFixed(0)} TL KDV DAHİL • ${teklifSepet.length} kalem`;}
function teklifSil(i){teklifSepet.splice(i,1);localStorage.setItem('teklif_sepet',JSON.stringify(teklifSepet));renderTeklif()}
function teklifTemizle(){if(confirm('Sepet temizlensin mi?')){teklifSepet=[];localStorage.setItem('teklif_sepet','[]');renderTeklif()}}
function teklifYazdir(){if(teklifSepet.length===0)return alert('Sepet boş');let musteri=document.getElementById('musteriAd').value||'Müşteri';let tarih=document.getElementById('teklifTarih').value||new Date().toLocaleDateString('tr-TR');document.getElementById('printMusteri').innerText=musteri;document.getElementById('printTarih').innerText=tarih;document.getElementById('printFirma').innerText=document.getElementById('firmaYazi').innerText||'ELEMENT BOYA';let html=`<table style="width:100%;border-collapse:collapse;font-size:12px"><tr style="background:#012060;color:white"><th style="padding:8px;text-align:left">#</th><th style="padding:8px;text-align:left">RENK / ÜRÜN / FORMÜL / MALİYET</th><th style="padding:8px">MİKTAR</th><th style="padding:8px">BİRİM</th><th style="padding:8px">TOPLAM</th></tr>`;let top=0,topKdv=0;teklifSepet.forEach((t,i)=>{top+=t.kovaTl*t.adet;topKdv+=t.kovaKdv*t.adet;html+=`<tr style="border-bottom:1px solid #ddd"><td style="padding:8px">${i+1}</td><td style="padding:8px"><div style="display:flex;gap:8px;align-items:center"><div style="width:24px;height:24px;background:${t.hex};border-radius:6px;border:1px solid #999"></div><div><div style="font-weight:900">RAL ${t.ral} - ${t.isim}</div><div style="font-size:10px;color:#666">${t.urun} • ${t.lt}LT • Formül: ${t.form||'-'} • Maliyet: $${t.maliyetLt.toFixed(2)}/LT • Pigment: $${t.pigment}</div></div></div></td><td style="padding:8px;text-align:center">${t.adet} Kova</td><td style="padding:8px;text-align:right">${t.kovaKdv.toFixed(0)} TL</td><td style="padding:8px;text-align:right;font-weight:900">${(t.kovaKdv*t.adet).toFixed(0)} TL</td></tr>`});html+=`</table>`;document.getElementById('printListe').innerHTML=html;document.getElementById('printToplam').innerHTML=`<div style="display:flex;justify-content:space-between"><div>ARA: <b>${top.toFixed(0)} TL</b></div><div>TOPLAM KDV DAHİL: <b style="font-size:16px;color:#012060">${topKdv.toFixed(0)} TL</b></div></div>`;document.getElementById('printArea').style.display='block';window.print();setTimeout(()=>{document.getElementById('printArea').style.display='none'},500);}
function yukleCok(k){let o=db[k];if(!o)return;let idx=urunler.findIndex(u=>u[0]===o.urunTam||u[0]===o.urun);if(idx!==-1)selectUrun(idx);document.getElementById('ralInput').value=o.ral||'';secRalHex=o.hex||'#fff';secRalName=o.isim||'';document.getElementById('swatch').style.background=secRalHex;document.getElementById('pigment').value=o.pigmentDisplay||o.pigment||'';document.getElementById('ralForm').value=o.form||'';secLT=o.lt||18;secAmbIdx=ambalajlar.findIndex(a=>a.lt===secLT);if(secAmbIdx===-1)secAmbIdx=2;renderAmb();calc();}
function yukleOrtak(i){let o=ortakDb[i];if(!o)return;let idx=urunler.findIndex(u=>u[0]===o.urunTam);if(idx!==-1)selectUrun(idx);document.getElementById('ralInput').value=o.ral;secRalHex=o.hex;secRalName=o.isim;document.getElementById('swatch').style.background=secRalHex;document.getElementById('pigment').value=o.pigmentDisplay||'';secLT=o.lt||18;secAmbIdx=ambalajlar.findIndex(a=>a.lt===secLT);renderAmb();calc();}
function renderHafiza(){let keys=Object.keys(db).filter(k=>k.includes('__')).sort((a,b)=>(db[b].ts||0)-(db[a].ts||0));let seen={};let uniq=[];for(let k of keys){let s=`${db[k].ral}__${db[k].urunTam||db[k].urun}`;if(!seen[s]){seen[s]=true;uniq.push(k)}}if(uniq.length===0){document.getElementById('hafizaList').innerHTML='<div style="font-size:11px;color:#999;padding:10px">Henüz yok</div>';return}document.getElementById('hafizaList').innerHTML=uniq.slice(0,20).map(k=>{let o=db[k];let hex=o.hex||'#fff';return `<div class="cokMini" onclick="yukleCok('${k.replace(/'/g,"\\'")}')"><div class="cokSw" style="background:${hex}"></div><div class="cokInfo"><div class="cokRal">RAL ${o.ral} - ${o.isim||''}</div><div class="cokUrun">🧴 ${(o.urunTam||o.urun||'').substring(0,28)}</div></div><div>›</div></div>`}).join('')}
function renderOrtak(){if(!ortakDb||ortakDb.length===0){document.getElementById('ortakList').innerHTML='<div style="font-size:11px;color:#999;padding:6px">Ortak yok</div>';return}document.getElementById('ortakList').innerHTML=ortakDb.slice(-15).reverse().map((o,i)=>{let idx=ortakDb.length-1-i;let hex=o.hex||'#fff';return `<div class="cokMini" style="border-color:#0a7a2f" onclick="yukleOrtak(${idx})"><div class="cokSw" style="background:${hex}"></div><div class="cokInfo"><div class="cokRal">RAL ${o.ral} - ${o.isim}</div><div class="cokUrun">${(o.urunTam||'').substring(0,28)}</div></div></div>`}).join('')}
document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;document.getElementById('setDolar').value=ayarlar.dolar;renderAmb();loadAll();
document.addEventListener('click',e=>{if(!e.target.closest('.select-box')){let u=document.getElementById('urunDrop');let r=document.getElementById('ralDrop');if(u)u.style.display='none';if(r)r.style.display='none'}})
</script>
