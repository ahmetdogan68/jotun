<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JOTUN - LACIVERT BAR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#012060;padding:0}
.wrap{max-width:540px;margin:0 auto;background:#f2f4f7;min-height:100vh;padding:8px;padding-bottom:90px}
.header{background:#012060;color:white;padding:10px 12px;border-radius:0 0 16px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:200;margin:-8px -8px 8px -8px;box-shadow:0 2px 12px rgba(0,0,0,0.3)}
.logo{height:34px;object-fit:contain}
.card{background:white;border-radius:16px;padding:10px;margin-top:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.select-box{position:relative}.select-box input{width:100%;padding:14px;border:2px solid #012060;border-radius:12px;font-size:15px;font-weight:700;background:white}
.drop{position:absolute;top:56px;left:0;right:0;background:white;border-radius:12px;max-height:60vh;overflow:auto;z-index:300;display:none;box-shadow:0 12px 30px rgba(0,0,0,0.25);border:1px solid #ddd}
.item{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.ralItem{padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;border-bottom:1px solid #f5f5f5}
.ralSw{width:44px;height:44px;border-radius:10px;border:1px solid #ddd;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.s{padding:12px;border:2px solid #e5e5e5;border-radius:10px;width:100%;font-size:14px;font-weight:600}
.ralBoxBig{display:flex;gap:12px;align-items:stretch;margin-top:8px}
.swatchHuge{width:140px;min-width:140px;height:90px;border-radius:16px;border:2px solid #012060;box-shadow:0 6px 18px rgba(0,0,0,0.25);background:#fff}
.ralInputBig{flex:1}.ralInputBig input{height:90px;font-size:30px;font-weight:900;letter-spacing:1px;text-align:center;border-width:3px;border-radius:16px}
.pigmentRow{display:grid;grid-template-columns:1fr 120px;gap:8px;margin-top:8px}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:6px}
.amb{padding:10px 4px;border:2px solid #e5e5e5;border-radius:10px;font-weight:800;text-align:center;font-size:12px;cursor:pointer;background:white}.amb.active{background:#012060;color:white;border-color:#012060}
.result{background:#111;color:white;border-radius:16px;padding:12px;margin-top:8px}
.big{font-size:22px;font-weight:900}
.settingsBtn{background:#ffcc00;border:none;padding:8px 14px;border-radius:20px;font-weight:900;font-size:12px;color:#012060}
.settingsPanel{display:none;position:fixed;top:0;right:0;width:100%;max-width:380px;height:100%;background:white;z-index:999;padding:14px;overflow:auto}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:998}
.cokGrid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.cokMini{background:white;border:2px solid #012060;border-radius:14px;padding:10px 12px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.cokSw{width:56px;height:56px;min-width:56px;border-radius:12px;border:2px solid #012060;box-shadow:0 3px 8px rgba(0,0,0,0.2)}
.cokInfo{flex:1;overflow:hidden}
.cokRal{font-weight:900;font-size:14px;color:#012060}
.cokUrun{font-size:10px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
<div style="display:flex;align-items:center;gap:8px">
<img id="firmaLogo" src="" class="logo" style="display:none;background:white;padding:2px 6px;border-radius:6px">
<div id="firmaYazi" style="font-weight:900;font-size:14px">ELEMENT BOYA</div>
<div id="kurTxt" style="font-size:9px;color:#a8c0e0">TCMB: -</div>
</div>
<div style="display:flex;align-items:center;gap:8px">
<img src="https://jcm.jotun.com/assets/logo-jotun-Bjw4Kkeb.svg" class="logo" style="height:34px;background:white;padding:3px 8px;border-radius:6px">
<button class="settingsBtn" onclick="openSettings()">⚙️</button>
</div>
</div>

<div class="overlay" id="overlay" onclick="closeSettings()"></div>
<div class="settingsPanel" id="settingsPanel">
<h3>AYARLAR</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><div><label style="font-size:11px;font-weight:800">Kar %</label><input id="setKar" class="s" type="number" value="30"></div><div><label style="font-size:11px;font-weight:800">KDV %</label><input id="setKdv" class="s" type="number" value="20"></div></div>
<div style="margin-top:8px"><label style="font-size:11px;font-weight:800">Firma Logo URL</label><input id="setFirmaLogo" class="s" placeholder="https://..." oninput="saveFirmaLogo()"></div>
<div style="margin-top:8px"><label style="font-size:11px;font-weight:800">Dolar TCMB</label><input id="setDolar" class="s" type="text"></div>
<button onclick="fetchTCMB()" style="margin-top:8px;width:100%;background:#0a7a2f;color:white;border:none;border-radius:10px;padding:12px;font-weight:800">🔄 TCMB ÇEK</button>
<div id="kurInfo" style="font-size:11px;color:green;margin-top:6px"></div>
<button onclick="saveSettings();closeSettings()" style="width:100%;padding:12px;background:#012060;color:white;border:none;border-radius:10px;font-weight:800;margin-top:12px">KAYDET KAPAT</button>
</div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">1 • ÜRÜN (220 ürün)</div><div class="select-box" style="margin-top:6px"><input id="urunInput" placeholder="CONSEAL, PILOT ara..." onfocus="openUrun()" oninput="openUrun()"><div class="drop" id="urunDrop"></div></div><div id="urunDetay" style="font-size:11px;margin-top:6px;display:none"></div></div>

<div class="card"><div style="font-size:11px;font-weight:900;color:#012060">2 • RAL - BÜYÜK RENK</div>
<div class="ralBoxBig"><div class="swatchHuge" id="swatch"></div><div class="ralInputBig select-box"><input id="ralInput" placeholder="9010" onfocus="openRal()" oninput="openRal()"><div class="drop" id="ralDrop"></div></div></div>
<div class="pigmentRow"><input id="ralForm" class="s" placeholder="Formül"><input id="pigment" class="s" placeholder="$ Pigment"></div>
<div style="margin-top:8px"><div style="font-size:11px;font-weight:900;color:#012060">3 • KOVA</div><div class="ambRow" id="ambList"></div></div></div>

<div class="result"><div id="hesapDetay" style="font-size:11px;line-height:1.5;color:#ccc"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;background:#1e1e1e;border-radius:10px;padding:10px">
<div><div style="font-size:9px;color:#888">MALİYET LT $</div><div id="maliyetLt" style="color:#ffcc00;font-weight:900">-</div><div style="font-size:9px;color:#888;margin-top:6px">SATIŞ LT TL</div><div id="satisLtTL" style="font-weight:900">-</div></div>
<div><div style="font-size:9px;color:#888">KOVA TL</div><div id="satisKova" class="big">-</div><div id="satisKovaKdv" style="color:#ffcc00;font-weight:800;font-size:12px">-</div></div>
</div>
<button onclick="kaydetHafiza()" style="width:100%;margin-top:8px;background:#ffcc00;border:none;padding:12px;border-radius:10px;font-weight:900;color:#012060">💾 KAYDET</button></div>

<div class="card" style="background:#fffbe6">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:12px">⭐ ÇOK KULLANILANLAR</b><span id="cokSayi" style="background:#012060;color:white;font-size:10px;padding:2px 8px;border-radius:10px">0</span></div>
<div style="display:flex;gap:6px;margin-top:8px">
<button onclick="exportKayitlar()" style="flex:1;background:#012060;color:white;border:none;border-radius:10px;padding:8px;font-size:11px;font-weight:800">📤 YEDEK AL</button>
<label style="flex:1;background:#fff;border:2px solid #012060;border-radius:10px;padding:8px;font-size:11px;font-weight:800;text-align:center;cursor:pointer">📥 YÜKLE<input type="file" accept=".json" style="display:none" onchange="importKayitlar(this)"></label>
</div>
<div id="hafizaList" class="cokGrid"></div>
<div style="margin-top:8px;border-top:1px dashed #ccc;padding-top:8px"><b style="font-size:11px">🌍 ORTAK KAYITLAR</b><div id="ortakList" class="cokGrid"></div></div>
</div>
</div>

<script>
let urunler=[], ralList=[], ortakDb=[];
let ambalajlar=[{ad:"3.6L",lt:3.6},{ad:"5L",lt:5},{ad:"18L",lt:18},{ad:"20L",lt:20}];
let db=JSON.parse(localStorage.getItem('urun_ral_lt_hafiza')||'{}');
let ayarlar=JSON.parse(localStorage.getItem('jotun_ayarlar')||'{"kar":30,"kdv":20,"dolar":"49,4945","firmaLogo":""}');
let secUrunIdx=null,secAmbIdx=2,secLT=18,tcmbKur=49.4945,secRalHex="#FFFFFF",secRalName="";
async function loadAll(){
  try{let r=await fetch('./products.json?v='+Date.now());let d=await r.json();urunler=d.map(o=>[o.ad,o.fiyat,o.lt]);}catch(e){let loc=JSON.parse(localStorage.getItem('jotun_urunler_v2')||'null');if(loc)urunler=loc}
  try{let r2=await fetch('./ral.json?v='+Date.now());ralList=await r2.json();}catch(e){ralList=[{kod:"7016",isim:"Antrasit Grisi",hex:"#383E42"},{kod:"9010",isim:"Saf Beyaz",hex:"#FFFFFF"}]}
  try{let r3=await fetch('./ortak_kayitlar.json?v='+Date.now());ortakDb=await r3.json();if(!Array.isArray(ortakDb))ortakDb=[]}catch(e){ortakDb=[]}
  if(ayarlar.firmaLogo){document.getElementById('firmaLogo').src=ayarlar.firmaLogo;document.getElementById('firmaLogo').style.display='block';document.getElementById('firmaYazi').style.display='none';document.getElementById('setFirmaLogo').value=ayarlar.firmaLogo}
  filterUrun();renderHafiza();renderOrtak();
}
function parsePara(v){if(!v&&v!==0)return 0;return parseFloat(String(v).replace(',','.').replace(/[^0-9.-]/g,''))||0}
function openSettings(){document.getElementById('settingsPanel').style.display='block';document.getElementById('overlay').style.display='block'}
function closeSettings(){document.getElementById('settingsPanel').style.display='none';document.getElementById('overlay').style.display='none'}
function saveFirmaLogo(){let url=document.getElementById('setFirmaLogo').value.trim();ayarlar.firmaLogo=url;localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));if(url){document.getElementById('firmaLogo').src=url;document.getElementById('firmaLogo').style.display='block';document.getElementById('firmaYazi').style.display='none'}else{document.getElementById('firmaLogo').style.display='none';document.getElementById('firmaYazi').style.display='block'}}
function saveSettings(){ayarlar.kar=parseFloat(document.getElementById('setKar').value)||30;ayarlar.kdv=parseFloat(document.getElementById('setKdv').value)||20;ayarlar.dolar=document.getElementById('setDolar').value.trim()||"49,4945";localStorage.setItem('jotun_ayarlar',JSON.stringify(ayarlar));calc()}
async function fetchTCMB(){let info=document.getElementById('kurInfo');info.innerText='Çekiliyor...';try{let res=await fetch('https://api.allorigins.win/raw?url=https://www.tcmb.gov.tr/kurlar/today.xml');let txt=await res.text();let m=txt.match(/Kod="USD"[\s\S]*?EffectiveSelling>([\d.]+)/);if(m){tcmbKur=parseFloat(m[1]);return yaz()}}catch(e){}try{let r=await fetch('https://open.er-api.com/v6/latest/USD');let d=await r.json();if(d.rates&&d.rates.TRY){tcmbKur=d.rates.TRY;return yaz()}}catch(e){}info.innerText='Manuel kur kullanılıyor';function yaz(){let s=tcmbKur.toFixed(4).replace('.',',');document.getElementById('setDolar').value=s;info.innerText='✓ Kur: '+tcmbKur.toFixed(4);document.getElementById('kurTxt').innerText='TCMB: '+tcmbKur.toFixed(4);saveSettings();calc()}}
function openUrun(){document.getElementById('urunDrop').style.display='block';filterUrun()}
function filterUrun(){let q=document.getElementById('urunInput').value.toUpperCase().trim();let list=urunler.map((r,i)=>({r,i})).filter(o=>{if(q.length<2)return true;return o.r[0].toUpperCase().includes(q)}).slice(0,100);document.getElementById('urunDrop').innerHTML=list.map(o=>`<div class="item" onclick="selectUrun(${o.i})"><span style="font-size:11px">${o.r[0]}</span><b style="color:#012060">$${o.r[1]}</b></div>`).join('')}
function selectUrun(i){secUrunIdx=i;let u=urunler[i];document.getElementById('urunInput').value=u[0];document.getElementById('urunDrop').style.display='none';secLT=u[2];secAmbIdx=ambalajlar.findIndex(a=>a.lt===secLT);if(secAmbIdx===-1)secAmbIdx=2;secLT=ambalajlar[secAmbIdx].lt;document.getElementById('urunDetay').style.display='block';document.getElementById('urunDetay').innerHTML=`✓ <b>${u[0]}</b> • $${u[1]}/LT`;renderAmb();calc()}
function renderAmb(){document.getElementById('ambList').innerHTML=ambalajlar.map((a,i)=>{let c='amb';if(i===secAmbIdx)c+=' active';return `<div class="${c}" onclick="secAmbIdx=${i};secLT=${a.lt};renderAmb();calc()">${a.ad}</div>`}).join('')}
function openRal(){document.getElementById('ralDrop').style.display='block';filterRal()}
function filterRal(){let q=document.getElementById('ralInput').value.trim().toUpperCase();let list=ralList.filter(r=>{if(!q)return true;return r.kod.includes(q)||r.isim.toUpperCase().includes(q)}).slice(0,60);document.getElementById('ralDrop').innerHTML=list.map(r=>`<div class="ralItem" onclick="selectRal('${r.kod}')"><div class="ralSw" style="background:${r.hex}"></div><div style="flex:1"><div style="font-weight:900;font-size:14px">RAL ${r.kod}</div><div style="font-size:11px;color:#666">${r.isim}</div></div></div>`).join('')}
function selectRal(kod){let r=ralList.find(x=>x.kod===kod);if(!r)return;document.getElementById('ralInput').value=r.kod;document.getElementById('ralDrop').style.display='none';secRalHex=r.hex;secRalName=r.isim;document.getElementById('swatch').style.background=r.hex;calc()}
function kaydetHafiza(){let ral=document.getElementById('ralInput').value.trim();if(!ral)return alert('RAL yaz');if(secUrunIdx===null)return alert('Ürün seç');let u=urunler[secUrunIdx];let key=`${u[0]}__${ral}__${secLT}__${Date.now()}`;let ro=ralList.find(x=>x.kod===ral);db[key]={ral:ral,hex:ro?ro.hex:secRalHex,isim:ro?ro.isim:secRalName,pigmentDisplay:document.getElementById('pigment').value,form:document.getElementById('ralForm').value,lt:secLT,urunTam:u[0],ts:Date.now()};localStorage.setItem('urun_ral_lt_hafiza',JSON.stringify(db));renderHafiza()}
function yukleCok(k){let o=db[k];if(!o)return;let idx=urunler.findIndex(u=>u[0]===o.urunTam);if(idx!==-1)selectUrun(idx);document.getElementById('ralInput').value=o.ral;if(o.hex){secRalHex=o.hex;document.getElementById('swatch').style.background=o.hex}secRalName=o.isim||'';document.getElementById('pigment').value=o.pigmentDisplay||'';document.getElementById('ralForm').value=o.form||'';secLT=o.lt||18;secAmbIdx=ambalajlar.findIndex(a=>a.lt===secLT);if(secAmbIdx===-1)secAmbIdx=2;renderAmb();calc();window.scrollTo({top:0,behavior:'smooth'})}
function yukleOrtak(i){let o=ortakDb[i];if(!o)return;let idx=urunler.findIndex(u=>u[0]===o.urunTam);if(idx!==-1)selectUrun(idx);document.getElementById('ralInput').value=o.ral;secRalHex=o.hex||'#fff';secRalName=o.isim||'';document.getElementById('swatch').style.background=secRalHex;document.getElementById('pigment').value=o.pigmentDisplay||'';secLT=o.lt||18;secAmbIdx=ambalajlar.findIndex(a=>a.lt===secLT);if(secAmbIdx===-1)secAmbIdx=2;renderAmb();calc();window.scrollTo({top:0,behavior:'smooth'})}
function renderHafiza(){let keys=Object.keys(db).filter(k=>k.includes('__')).sort((a,b)=>(db[b].ts||0)-(db[a].ts||0));let seen={};let uniq=[];for(let k of keys){let o=db[k];let s=`${o.ral}__${o.urunTam}`;if(!seen[s]){seen[s]=true;uniq.push(k)}}document.getElementById('cokSayi').innerText=uniq.length;if(uniq.length===0){document.getElementById('hafizaList').innerHTML='<div style="font-size:11px;color:#999;padding:10px">Henüz yok</div>';return}document.getElementById('hafizaList').innerHTML=uniq.slice(0,30).map(k=>{let o=db[k];let hex=o.hex||'#fff';return `<div class="cokMini" onclick="yukleCok('${k.replace(/'/g,"\\'")}')"><div class="cokSw" style="background:${hex}"></div><div class="cokInfo"><div class="cokRal">RAL ${o.ral} - ${o.isim||''}</div><div class="cokUrun">🧴 ${(o.urunTam||'').substring(0,30)}</div><div class="cokUrun" style="color:#012060;font-weight:700">${o.lt}LT ${o.pigmentDisplay?`• $${o.pigmentDisplay}`:''}</div></div><button onclick="event.stopPropagation();ortagaEkle('${k.replace(/'/g,"\\'")}')" style="background:#ffcc00;border:none;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:900">ORTAĞA</button></div>`}).join('')}
function renderOrtak(){if(!ortakDb||ortakDb.length===0){document.getElementById('ortakList').innerHTML='<div style="font-size:11px;color:#999;padding:6px">Ortak kayıt yok</div>';return}document.getElementById('ortakList').innerHTML=ortakDb.slice(-20).reverse().map((o,i)=>{let idx=ortakDb.length-1-i;let hex=o.hex||'#fff';return `<div class="cokMini" style="border-color:#0a7a2f" onclick="yukleOrtak(${idx})"><div class="cokSw" style="background:${hex}"></div><div class="cokInfo"><div class="cokRal">RAL ${o.ral} - ${o.isim||''}</div><div class="cokUrun">🧴 ${(o.urunTam||'').substring(0,30)}</div></div><div style="color:#0a7a2f;font-weight:900">›</div></div>`}).join('')}
function calc(){if(secUrunIdx===null){document.getElementById('hesapDetay').innerHTML='<span style="color:#888">Ürün ve RAL seç</span>';return}let pigStr=document.getElementById('pigment').value.trim();let pigToplam=pigStr?parsePara(pigStr):0;let u=urunler[secUrunIdx];let kovaLT=secLT;let pigLt=kovaLT?(pigToplam/kovaLT):0;let maliyetLt=u[1]+pigLt;let kar=ayarlar.kar||30;let satisDolarLt=maliyetLt*(1+kar/100);let kur=ayarlar.dolar?parsePara(ayarlar.dolar):tcmbKur;let satisTlLt=satisDolarLt*kur;let kovaTl=satisTlLt*kovaLT;let kdv=ayarlar.kdv||20;let kovaKdv=kovaTl*(1+kdv/100);document.getElementById('maliyetLt').innerText=`$${maliyetLt.toFixed(2)}`;document.getElementById('satisLtTL').innerText=`${satisTlLt.toFixed(2)} TL`;document.getElementById('satisKova').innerText=`${kovaTl.toFixed(0)} TL`;document.getElementById('satisKovaKdv').innerText=`KDV: ${kovaKdv.toFixed(0)} TL`;document.getElementById('hesapDetay').innerHTML=`<div style="display:flex;gap:8px;align-items:center"><div style="width:22px;height:22px;background:${secRalHex};border-radius:6px;border:1px solid #444"></div><b>RAL ${document.getElementById('ralInput').value||'-'} ${secRalName}</b></div><div style="margin-top:4px;color:#888">${pigStr?`Pigment $${pigLt.toFixed(2)}/LT dahil`:`Pigment yok (alttan seçince gelir)`} | Maliyet $${maliyetLt.toFixed(2)} + %${kar}</div>`;document.getElementById('kurTxt').innerText=`TCMB: ${kur.toFixed(4)}`}
function exportKayitlar(){let data=JSON.stringify(db,null,2);let blob=new Blob([data],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jotun_kayitlarim_'+Date.now()+'.json';a.click()}
function importKayitlar(input){let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=function(e){try{let g=JSON.parse(e.target.result);Object.assign(db,g);localStorage.setItem('urun_ral_lt_hafiza',JSON.stringify(db));renderHafiza();alert('İçe aktarıldı')}catch(err){alert('Bozuk')}};r.readAsText(file)}
function ortagaEkle(k){let o=db[k];if(!o)return;let yeni={ral:o.ral,hex:o.hex,isim:o.isim,urunTam:o.urunTam,lt:o.lt,pigmentDisplay:o.pigmentDisplay,form:o.form,ekleyen:'Aksaray',tarih:new Date().toLocaleDateString('tr-TR')};let mevcut=[...ortakDb,yeni];let blob=new Blob([JSON.stringify(mevcut,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ortak_kayitlar.json';a.click();alert('ortak_kayitlar.json indi, GitHub\'a yükle.')}
document.getElementById('setKar').value=ayarlar.kar;document.getElementById('setKdv').value=ayarlar.kdv;document.getElementById('setDolar').value=ayarlar.dolar;
renderAmb();loadAll();calc();fetchTCMB();
document.addEventListener('click',e=>{if(!e.target.closest('.select-box')){document.getElementById('urunDrop').style.display='none';document.getElementById('ralDrop').style.display='none'}})
</script>
</div>
</body>
</html>
