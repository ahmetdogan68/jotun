async function pickContact(){
  let infoEl=document.getElementById('contactInfo');
  // 1. Yeni Contact Picker API (Android Chrome)
  if('contacts' in navigator && 'ContactsManager' in window){
    try{
      const props=['name','tel','address'];
      const opts={multiple:false};
      const contacts=await navigator.contacts.select(props,opts);
      if(contacts.length>0){
        let c=contacts[0];
        if(c.name && c.name[0]) document.getElementById('musteriAd').value=c.name[0];
        if(c.tel && c.tel[0]) document.getElementById('musteriTel').value=c.tel[0];
        if(c.address && c.address[0]) document.getElementById('musteriAdres').value=(c.address[0].city||'')+' '+(c.address[0].street||'');
        saveMusteriToLocal();
        infoEl.style.display='block';
        infoEl.innerText='✅ Rehberden alındı: '+(c.name?c.name[0]:'');
        setTimeout(()=>infoEl.style.display='none',3000);
        return;
      }
    }catch(e){
      console.log('contacts api error',e);
      if(e.name==='NotAllowedError' || e.name==='SecurityError'){
        infoEl.style.display='block';
        infoEl.innerText='❌ İzin verilmedi - Ayarlardan kişilere izin ver';
        return;
      }
      // devam et fallback'e
    }
  }
  // 2. Fallback: yerel geçmişten seç
  let musteriler=JSON.parse(localStorage.getItem('jotun_musteriler')||'[]');
  if(musteriler.length>0){
    let list=musteriler.map((m,i)=>`${i+1}. ${m.ad} - ${m.tel}`).join('\n');
    let sec=prompt('Kayıtlı müşteriler:\n'+list+'\n\nNumara gir (1-'+musteriler.length+')');
    if(sec){
      let idx=parseInt(sec)-1;
      if(musteriler[idx]){
        document.getElementById('musteriAd').value=musteriler[idx].ad;
        document.getElementById('musteriTel').value=musteriler[idx].tel;
        document.getElementById('musteriAdres').value=musteriler[idx].adres||'';
        infoEl.style.display='block';
        infoEl.innerText='✅ Geçmişten alındı';
        setTimeout(()=>infoEl.style.display='none',2000);
        return;
      }
    }
  }else{
    // 3. Bilgilendirme
    infoEl.style.display='block';
    infoEl.innerHTML='ℹ️ Tarayıcınız kişilere erişimi desteklemiyor.<br>Android Chrome ile https üzerinden açın ve izin verin.<br>Şimdilik elle girin, otomatik kaydedilecek.';
    setTimeout(()=>infoEl.style.display='none',4000);
  }
}
function saveMusteriToLocal(){
  let ad=document.getElementById('musteriAd').value.trim();
  let tel=document.getElementById('musteriTel').value.trim();
  let adres=document.getElementById('musteriAdres').value.trim();
  if(!ad && !tel) return;
  let list=JSON.parse(localStorage.getItem('jotun_musteriler')||'[]');
  // aynı tel varsa güncelle
  let idx=list.findIndex(m=>m.tel===tel && tel!=='');
  if(idx!==-1){ list[idx]={ad,tel,adres,date:Date.now()}; }
  else{
    // ad ile de kontrol
    let idx2=list.findIndex(m=>m.ad.toLowerCase()===ad.toLowerCase() && ad!=='');
    if(idx2!==-1) list[idx2]={ad,tel,adres,date:Date.now()};
    else list.unshift({ad,tel,adres,date:Date.now()});
  }
  if(list.length>100) list=list.slice(0,100);
  localStorage.setItem('jotun_musteriler',JSON.stringify(list));
  renderMusteriDatalist();
}
function renderMusteriDatalist(){
  let list=JSON.parse(localStorage.getItem('jotun_musteriler')||'[]');
  document.getElementById('musteriList').innerHTML=list.map(m=>`<option value="${m.ad}">`).join('');
  document.getElementById('telList').innerHTML=list.map(m=>`<option value="${m.tel}">`).join('');
  // ad yazınca tel otomatik dolsun
}

function calc(){if(secUrun===null) return;let u=urunler[secUrun];let fiyatD=parseFloat(u[1])||0;let kLT=parseFloat(secLT)||18;let kur=parseFloat((document.getElementById('setDolar').value||'49,7891').replace(',','.'))||49.7891;let kar=parseFloat(document.getElementById('setKar').value)||25;let kdv=parseFloat(document.getElementById('setKdv').value)||20;let pigTL=parseFloat((document.getElementById('pigment').value||'0').toString().replace(',','.'))||0;let pigLT=pigTL/18;let urunLT=fiyatD*kur;let toplamLT=urunLT+pigLT;let ltSatis=toplamLT*(1+kar/100);let setLT=getSetLT(u[0]);let aLT=trueLT(u[0]);let bLT=secCompPair ? secCompPair.lt : 0;let isCompMode = secCompPair ? true : false;let toplamSetLT = isCompMode ? setLT : kLT;let kovaS, kovaK;if(isCompMode){kovaS = ltSatis * toplamSetLT;kovaK = kovaS * (1+kdv/100);}else{kovaS = ltSatis * kLT;kovaK = kovaS * (1+kdv/100);}if(!secCompPair) secCompPair=findCompPair(u[0]);son={urun:u[0],ral:tempRal,hex:secHex,isim:secName,lt:kLT,gercekLT:aLT,toplamSetLT:toplamSetLT,setLT:setLT,isCompMode:isCompMode,compBLT:bLT,kovaTl:kovaS,kovaKdv:kovaK,ltSatis:ltSatis,form:document.getElementById('ralForm').value, pair: secCompPair ? {...secCompPair, lt: secCompPair.lt, setLT:setLT} : null};sonHesap={kur:kur,kar:kar,kdv:kdv,pigment:pigTL,urunDolar:fiyatD,urunTL:urunLT,toplamLT:toplamLT,ltSatis:ltSatis,toplamSetLT:toplamSetLT,setLT:setLT};document.getElementById('maliyet').innerText=fmt(toplamLT);document.getElementById('ltSatis').innerText=fmt(ltSatis);if(isCompMode){document.getElementById('kovaLabel').innerText=`SET (${toplamSetLT}LT)`;document.getElementById('kova').innerText=fmt(kovaS);document.getElementById('kovaKdv').innerText=fmt(kovaK);}else{document.getElementById('kovaLabel').innerText=`KOVA (${kLT}LT)`;document.getElementById('kova').innerText=fmt(kovaS);document.getElementById('kovaKdv').innerText=fmt(kovaK);}let detayBox=document.getElementById('hesapDetay');detayBox.style.display='block';let compDetay='';if(son.pair){let aKova=ltSatis*aLT*(1+kdv/100);let bKova=ltSatis*bLT*(1+kdv/100);compDetay=`<br>SET ${setLT}LT: A ${aLT}LT=${fmt(aKova)} | B ${bLT}LT=${fmt(bKova)} = ${fmt(aKova+bKova)}`;}detayBox.innerHTML=`${u[0]} $${fiyatD} × ${kur.toFixed(1)} = ${fmt(urunLT)} | ${fmt(ltSatis)} ×${toplamSetLT}LT=${fmt(kovaS)}${compDetay}`;}

function renderSikKullanilan(arr){

  let list=extra.slice(0,maxShow);
  let html=list.map((k,i)=>{
    let hex=getRalHex(k.ral_no);
    let txtColor=getContrast(hex);
    return `<div class='sikCard' onclick='selectSik(${i})'><button class='sikDel' onclick='event.stopPropagation();delSik(${i})'>X</button><div class='sikTop' style='background:${hex};color:${txtColor}'><div class='sikSwatch' style='background:${hex}'></div><div class='sikRal' style='color:${txtColor}'>${k.ral_no}</div></div><div class='sikBody' title='${k.product||''}'>${(k.product||'').split('(')[0].substring(0,10)}</div></div>`;
  }).join('');
  box.innerHTML=html;
}
function selectSik(i){let extra=bulutCache.length>0?bulutCache:JSON.parse(localStorage.getItem('jotun_kayitlar_extra')||'[]');let k=extra[i];if(!k)return;tempRal=k.ral_no;document.getElementById('ralInput').value=k.ral_no;let r=ralList.find(x=>x.kod===k.ral_no);if(r){secHex=r.hex;secName=r.isim;document.getElementById('swatch').style.background=r.hex;document.getElementById('swatch').innerText='RAL '+r.kod;}let idx=urunler.findIndex(u=>u[0].trim().toUpperCase()===(k.product||'').trim().toUpperCase());if(idx!==-1)selectUrun(idx);else{urunler.push([k.product,0]);selectUrun(urunler.length-1)}document.getElementById('pigment').value=k.colorant_cost||'';document.getElementById('ralForm').value=k.formul||'';calc();window.scrollTo(0,0);}
async function delSik(i){if(!confirm('Sil?'))return;let data=bulutCache[i];if(data && data._id){await bulutDelete(data._id);}await bulutYenile();}
async function kaydet(){if(!son)return alert('Once sec');let k={ral_no:son.ral||tempRal,ral_isim:son.isim,product:son.urun,base_no:baseNo(son.urun)||'1',lt:son.lt,can_size:son.lt+'L',colorant_cost:document.getElementById('pigment').value||'0',formul:document.getElementById('ralForm').value||'',maliyet:document.getElementById('pigment').value||'0'};let existing=bulutCache.find(x=>String(x.ral_no)===String(k.ral_no)&&x.product===k.product);if(existing && existing._id){ await bulutDelete(existing._id); }let ok=await bulutPost(k);if(ok){await bulutYenile();}else{let extra=JSON.parse(localStorage.getItem('jotun_kayitlar_extra')||'[]');extra=extra.filter(x=>!(String(x.ral_no)===String(k.ral_no)&&x.product===k.product));extra.push(k);localStorage.setItem('jotun_kayitlar_extra',JSON.stringify(extra));renderSikKullanilan(extra);}}
