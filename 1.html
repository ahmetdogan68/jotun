<!DOCTYPE html><html lang='tr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Jotun Renk Hesaplama</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--jotun-blue:#011B44;--jotun-yellow:#FFCC00;--bg:#E9ECF0;--card:#FFF;--card-border:#D6DAE2;--text:#0B1E3A;--text2:#5A6A85}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Arial;background:var(--bg);color:var(--text)}
.w{max-width:760px;margin:0 auto;padding:56px 8px 20px}
.h{background:#011B44;color:#fff;height:56px;display:flex;align-items:center;justify-content:center;position:fixed;top:0;left:0;right:0;z-index:1000}
.h-inner{width:100%;max-width:760px;display:flex;justify-content:space-between;padding:0 8px;align-items:center}
.h-center{font-size:18px}
.c{background:var(--card);border-radius:6px;padding:8px;margin-top:6px;border:1px solid var(--card-border)}
.c-head{font-size:11px;font-weight:900;color:var(--jotun-blue);text-transform:uppercase;margin-bottom:6px}
.sb{display:flex;gap:6px}.sb input{flex:1;padding:0 12px;border:2px solid #012060;border-radius:6px;height:48px;font-weight:700}
.btnS{background:var(--jotun-yellow);color:var(--jotun-blue);border:none;border-radius:6px;padding:0 10px;font-weight:900;height:48px;cursor:pointer}
.sw{width:100%;height:56px;border-radius:6px;border:2.5px solid var(--jotun-blue);display:flex;align-items:center;justify-content:center;font-weight:900;background:#fff}
.bil{flex:1;height:56px;border:2px solid #012060;border-radius:6px;display:flex;flex-direction:column;overflow:hidden}
.bilU{display:flex;flex:1;border-bottom:1px solid #ddd}.bilU-ral{flex:1;display:flex;align-items:center;justify-content:center}.bilU-pig{flex:1;display:flex;align-items:center;justify-content:center;background:rgba(255,204,0,.14)}
.bilA{flex:1;display:flex}.bilA input{border:none;width:100%;padding-left:8px}
.rb{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px;align-items:stretch}
.ambRow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px}.amb{border:2px solid #ddd;border-radius:6px;text-align:center;cursor:pointer;height:36px;display:flex;align-items:center;justify-content:center;font-weight:800}.amb.on{background:var(--jotun-blue);color:#fff}
.res{background:var(--jotun-blue);color:#fff;border-radius:6px;padding:8px;margin-top:6px}
.resGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:rgba(0,0,0,.22);border-radius:6px;padding:8px}
.resLabel{font-size:8px;color:#8AA0C5}.resVal{font-weight:800;font-size:15px}
.teklifCard{background:var(--card);border-radius:6px;padding:8px;margin-top:8px;border:1px solid var(--card-border)}
.teklifInputs{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.teklifInputs input{padding:8px;border:1.5px solid #ddd;border-radius:6px;width:100%}
.teklifBtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:6px}.teklifBtns button{padding:9px;border:none;border-radius:6px;font-weight:900;color:#fff}
.sikGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}.sikCard{border:1.5px solid #ddd;border-radius:5px;overflow:hidden;cursor:pointer;height:56px}.sikTop{flex:1;display:flex;align-items:center;justify-content:center;font-weight:900}.sikBody{background:#0B1E3A;color:#fff;font-size:7px;text-align:center;padding:2px}
.drop{position:fixed;background:#fff;border-radius:10px;max-height:420px;overflow:auto;z-index:9999;display:none;box-shadow:0 12px 30px rgba(0,0,0,.3);border:2px solid var(--jotun-blue);min-width:320px;max-width:520px}
.it{padding:10px 12px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;cursor:pointer}
#ralDrop{position:fixed;background:#fff;border-radius:10px;max-height:260px;overflow:auto;z-index:9999;display:none;box-shadow:0 15px 40px rgba(0,0,0,.35);border:2px solid var(--jotun-blue);min-width:280px;max-width:340px}
.ri{padding:8px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #ddd;cursor:pointer}.rs{width:32px;height:32px;border-radius:6px;border:1.5px solid #999;flex-shrink:0}
.kayitliCard{border:1px solid #ddd;border-radius:6px;padding:7px;margin-top:5px}
@media(max-width:700px){.sikGrid{grid-template-columns:repeat(3,1fr)}.teklifInputs{grid-template-columns:1fr}}
</style></head><body>
<div class='w'>
<div class='h'><div class='h-inner'><div>JOTUN</div><div class='h-center'>JOTUN <b>HESAPLAMA</b></div><div>●</div></div></div>
<div class='c'><div class='c-head'>1 - RAL KARTELASI</div><div class='rb'><div class='sw' id='swatch'>BOS</div><div class='bil'><div class='bilU'><div class='bilU-ral'><input id='ralInput' placeholder='RAL 7016' readonly onclick='enableRal()' style='border:none;width:100%;text-align:center;font-weight:900'></div><div class='bilU-pig'><input id='pigment' placeholder='0,00' style='border:none;width:100%;text-align:center;font-weight:900' oninput='calc()'><span>TL</span></div></div><div class='bilA'><input id='ralForm' placeholder='FORMUL / NOT'></div></div><button class='btnS' onclick='enableRal()'>ARA</button></div><div id='ralDrop'></div></div>
<div class='c'><div class='c-head'>2 - URUN SECIMI</div><div class='sb'><input id='urunInput' placeholder='Urun ara - Orn: CONSEAL' readonly onclick='enableUrun()'><button class='btnS' onclick='enableUrun()'>ARA</button></div><div id='urunDetay' style='font-size:10px;margin-top:5px;display:none;font-weight:700;background:#eef;padding:4px;border-radius:4px'></div><div id='urunDrop' class='drop'></div></div>
<div class='c'><div class='c-head'>3 - AMBALAJ</div><div class='ambRow' id='ambList'></div></div>
<div class='res'><div style='display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.07);padding:8px;border-radius:8px'><div style='flex:1'><div style='font-size:8px;color:#8AA0C5'>DOLAR KURU</div><div id='kurBuyuk' style='font-weight:900'>49,7891</div></div><input id='setDolarVisible' value='49,7891' oninput='document.getElementById("setDolar").value=this.value;calc()' style='width:70px;padding:5px;text-align:center'><input id='setDolar' value='49,7891' style='display:none'><div style='flex:1'><div style='font-size:8px;color:#8AA0C5'>EURO</div><div style='font-weight:900;color:#FFCC00'>54,20</div></div><input id='setEuroVisible' value='54,20' style='width:70px;padding:5px;text-align:center'><input id='setEuro' value='54,20' style='display:none'></div><div class='resGrid'><div><div class='resLabel'>LT MALIYET</div><div id='maliyet' class='resVal'>-</div></div><div><div class='resLabel'>LT SATIS</div><div id='ltSatis' class='resVal'>-</div></div><div><div class='resLabel' id='kovaLabel'>KOVA</div><div id='kova' class='resVal'>-</div><div id='kovaKdv' style='color:#FFCC00;font-size:10px'>-</div></div></div><div id='hesapDetay' style='display:none;background:#fff;color:#111;padding:5px;border-radius:6px;margin-top:6px;font-size:9px'></div><div style='display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px'><button onclick='teklifeEkle()' style='background:#fff;border:2px solid #FFCC00;color:#011B44;padding:9px;border-radius:6px;font-weight:800'>EKLE</button><button onclick='kaydet()' style='background:#00C853;color:#fff;border:none;padding:9px;border-radius:6px;font-weight:800'>SIK A KAYDET</button></div></div>
<div class='teklifCard'><div style='display:flex;justify-content:space-between'><b>TEKLIF (<span id='teklifSayi'>0</span>)</b><button onclick='temizle()' style='background:#E53935;color:#fff;border:none;border-radius:4px;padding:5px 8px'>TEMIZLE</button></div><div class='teklifInputs'><input id='musteriAd' placeholder='Musteri Adi'><input id='musteriAdres' placeholder='Musteri Adres'><input id='musteriTel' placeholder='Musteri Tel - 05xx'><input id='tarih' type='date'></div><div id='teklifList'></div><div id='teklifToplam' style='display:none;background:#011B44;color:#fff;border-radius:6px;padding:8px;margin-top:6px'></div><div class='teklifBtns'><button onclick='yazdir()' style='background:#012060'>YAZDIR</button><button onclick='waTextGonder()' style='background:#128C7E'>YAZI</button><button onclick='waPdfGonder()' style='background:#25D366'>PDF</button></div><button onclick='teklifKaydet()' style='width:100%;padding:11px;background:#011B44;color:#fff;border:none;border-radius:6px;font-weight:900;margin-top:8px'>TEKLİFİ KAYDET 💾</button><div id='kayitliTeklifler' style='margin-top:8px'></div></div>
<div class='c'><b>SIK KULLANILANLAR - <span id='sikSay'>0</span></b><div id='sikBox' class='sikGrid'></div></div>
</div>
<script>
let urunler=[], ralList=[], amb=[{ad:'3.6L',lt:3.6},{ad:'4.5L',lt:4.5},{ad:'18L',lt:18},{ad:'20L',lt:20}];
let secUrun=null, secAmb=2, secLT=18, secHex='#FFF', son=null, tempRal='', secName='', sepet=JSON.parse(localStorage.getItem('teklif_sepet')||'[]');
let bulutCache=[]; let sikBirlesik=[]; // SIK için tek kaynak: repo + yerel + bulut
function parsePrice(r){if(r==null) return 0; let s=String(r).replace(/[^0-9,\.\-]/g,'').replace(',','.'); let v=parseFloat(s); return isNaN(v)?0:v;}
function parseLT(ad){if(!ad) return 0; let m=ad.match(/\(\s*([\d.,]+)\s*LT\s*\)/i); if(m) return parseFloat(m[1].replace(',','.'))||0; let m2=ad.match(/([\d.,]+)\s*LT/i); return m2?parseFloat(m2[1].replace(',','.'))||0:0;}
function fmt(n){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n)+' TL'}
function getRalHex(k){let r=ralList.find(x=>String(x.kod).trim()===String(k).trim()); return r?r.hex:'#777';}
function getContrast(hex){try{let c=hex.replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join(''); let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)/255>0.6?'#111':'#fff';}catch(e){return '#fff'}}
async function tryFetch(urls){for(let u of urls){try{let r=await fetch(u,{cache:'no-store'}); if(r.ok){let t=await r.text(); t=t.replace(/"fiyat"\s*:\s*(\d+),(\d+)/g,'"fiyat": $1.$2'); let j=JSON.parse(t); if(j&&j.length>0) return {data:j};}}catch(e){}} return null}
async function loadAll(){
  let pr=await tryFetch(['https://raw.githubusercontent.com/ahmetdogan68/jotun/main/products.json?v='+Date.now(),'./products.json?v='+Date.now()]);
  if(pr&&pr.data) urunler=pr.data.map(o=>[(o.ad||'').trim(), parsePrice(o.fiyat)]);
  let rr=await tryFetch(['https://raw.githubusercontent.com/ahmetdogan68/jotun/main/ral.json?v='+Date.now(),'./ral.json?v='+Date.now()]);
  if(rr&&rr.data&&rr.data.length>0) ralList=rr.data; else ralList=RAL_YEDEK;
  // KAYITLI URUNLER: 3 kaynagi birlestir
  let repoKayit=[];
  try{
    let jr=await tryFetch(['https://raw.githubusercontent.com/ahmetdogan68/jotun/main/jotun_kayitlar.json?v='+Date.now(),'./jotun_kayitlar.json?v='+Date.now()]);
    if(jr&&jr.data) repoKayit=jr.data;
  }catch(e){}
  let yerel=JSON.parse(localStorage.getItem('jotun_kayitlar_extra')||'[]');
  let bulut=[];
  try{ let bc=await fetch('https://crudcrud.com/api/772420af1ef84f3f8653d9e074bcdde8/jotun_sik',{cache:'no-store'}); if(bc.ok) bulut=await bc.json(); }catch(e){}
  bulutCache=bulut;
  // Birlestir, tekrarlari at
  let map=new Map();
  [...repoKayit, ...yerel, ...bulut].forEach(x=>{ let k=(x.ral_no||'')+'_'+(x.product||''); if(k.trim()!=='_' && !map.has(k)) map.set(k,x); });
  sikBirlesik=Array.from(map.values());
  // Birlesigi yerele de yaz ki bir daha kaybolmasin
  if(sikBirlesik.length>0) localStorage.setItem('jotun_kayitlar_extra', JSON.stringify(sikBirlesik));
  console.log('SIK: repo',repoKayit.length,'yerel',yerel.length,'bulut',bulut.length,'toplam',sikBirlesik.length);
  document.getElementById('tarih').valueAsDate=new Date();
  renderAmb(); renderTeklif(); renderKayitliTeklifler(); renderSik();
}
function enableUrun(){let i=document.getElementById('urunInput'); i.removeAttribute('readonly'); i.focus(); openUrun();}
function enableRal(){let i=document.getElementById('ralInput'); i.removeAttribute('readonly'); i.focus(); filterRal();}
function openUrun(){let inp=document.getElementById('urunInput'); let d=document.getElementById('urunDrop'); let r=inp.getBoundingClientRect(); d.style.top=(r.bottom+6)+'px'; d.style.left=r.left+'px'; d.style.display='block'; filterUrun();}
function filterUrun(){let q=(document.getElementById('urunInput').value||'').toUpperCase().trim(); let d=document.getElementById('urunDrop'); let list=urunler.map((r,i)=>({r,i})).filter(o=>!q||o.r[0].toUpperCase().includes(q)).slice(0,200); d.innerHTML=list.map(o=>`<div class='it' onclick='selectUrun(${o.i})'><span>${o.r[0]}</span><b>$${o.r[1]}</b></div>`).join('');}
function selectUrun(i){secUrun=i; let u=urunler[i]; let pLT=parseLT(u[0]); if(pLT>0){secLT=pLT; let idx=amb.findIndex(a=>Math.abs(a.lt-pLT)<0.15); if(idx!==-1) secAmb=idx;} let inp=document.getElementById('urunInput'); inp.value=u[0]; inp.setAttribute('readonly','true'); document.getElementById('urunDrop').style.display='none'; let det=document.getElementById('urunDetay'); det.style.display='block'; det.innerHTML=u[0]+' - $'+u[1]; renderAmb(); calc();}
function renderAmb(){document.getElementById('ambList').innerHTML=amb.map((a,i)=>`<div class='amb ${i===secAmb?'on':''}' onclick='secAmb=${i};secLT=${a.lt};renderAmb();calc();'>${a.ad}</div>`).join('');}
function filterRal(){let q=(document.getElementById('ralInput').value||'').toUpperCase().trim(); let list=ralList.filter(r=>!q||r.kod.includes(q)||r.isim.toUpperCase().includes(q)).slice(0,60); let d=document.getElementById('ralDrop'); d.innerHTML=list.map(r=>`<div class='ri' onclick='selectRal("${r.kod}")'><div class='rs' style='background:${r.hex}'></div><div><b>${r.kod}</b> ${r.isim}</div></div>`).join(''); d.style.display='block'; let box=document.querySelector('.bil'); if(box){let rr=box.getBoundingClientRect(); d.style.top=(rr.bottom+4)+'px'; d.style.left=rr.left+'px';}}
function selectRal(k){let r=ralList.find(x=>x.kod===k); if(!r) return; tempRal=r.kod; secHex=r.hex; secName=r.isim; let sw=document.getElementById('swatch'); sw.style.background=r.hex; sw.innerText='RAL '+r.kod; sw.style.color=getContrast(r.hex); let inp=document.getElementById('ralInput'); inp.value=r.kod; inp.setAttribute('readonly','true'); document.getElementById('ralDrop').style.display='none'; calc();}
function calc(){if(secUrun===null) return; let u=urunler[secUrun]; let fiyatD=parsePrice(u[1]); let kur=parseFloat((document.getElementById('setDolar').value||'49,7891').replace(',','.'))||49.7891; let pigTL=parseFloat(String(document.getElementById('pigment').value||'0').replace('.','').replace(',','.'))||0; let urunLT=fiyatD*kur; let toplamLT=urunLT+pigTL/18; let ltSatis=toplamLT*1.25; let kovaS=ltSatis*secLT; let kovaK=kovaS*1.20; son={urun:u[0],ral:tempRal,hex:secHex,isim:secName,lt:secLT,kovaTl:kovaS,kovaKdv:kovaK,ltSatis:ltSatis,form:document.getElementById('ralForm').value}; document.getElementById('maliyet').innerText=fmt(toplamLT); document.getElementById('ltSatis').innerText=fmt(ltSatis); document.getElementById('kova').innerText=fmt(kovaS); document.getElementById('kovaKdv').innerText=fmt(kovaK); let dbox=document.getElementById('hesapDetay'); dbox.style.display='block'; dbox.innerHTML=u[0]+' $'+fiyatD+' x '+kur+' = '+fmt(urunLT);}
function teklifeEkle(){if(!son) return alert('Once sec'); let adet=parseInt(prompt('Kac adet?','1'))||1; sepet.push({...son,adet:adet}); localStorage.setItem('teklif_sepet',JSON.stringify(sepet)); renderTeklif();}
function renderTeklif(){document.getElementById('teklifSayi').innerText=sepet.length; if(sepet.length===0){document.getElementById('teklifList').innerHTML='<div style="padding:6px;font-size:10px">Henuz urun eklenmedi</div>'; document.getElementById('teklifToplam').style.display='none'; return;} let g=0,haric=0; document.getElementById('teklifList').innerHTML=sepet.map((t,i)=>{g+=t.kovaKdv*t.adet; haric+=t.kovaTl*t.adet; return `<div style='border:1px solid #ddd;border-radius:6px;padding:6px;margin-top:4px'><div style='display:flex;gap:6px;align-items:center'><div style='width:18px;height:18px;background:${t.hex};border:1px solid #999;border-radius:4px'></div><div style='flex:1'><b style='font-size:11px'>${t.urun}</b><br><span style='font-size:9px'>RAL ${t.ral} ${t.isim||''}</span></div><button onclick='sil(${i})' style='background:#E53935;color:#fff;border:none;border-radius:4px;padding:4px 7px'>X</button></div><div style='text-align:center;background:#F1F5F9;padding:5px;border-radius:5px;margin-top:4px'>${t.adet} Adet - ${fmt(t.kovaKdv)} - Toplam ${fmt(t.kovaKdv*t.adet)}</div></div>`}).join(''); document.getElementById('teklifToplam').style.display='block'; document.getElementById('teklifToplam').innerHTML=`Ara Toplam ${fmt(haric)}<br>Genel Toplam <b>${fmt(g)}</b>`;}
function sil(i){sepet.splice(i,1); localStorage.setItem('teklif_sepet',JSON.stringify(sepet)); renderTeklif();}
function temizle(){if(confirm('Temizle?')){sepet=[]; localStorage.setItem('teklif_sepet','[]'); renderTeklif();}}
function waTextGonder(){let must=document.getElementById('musteriAd').value||'Musteri'; let tel=document.getElementById('musteriTel').value.trim(); if(!tel){alert('Tel yaz'); return;} let clean=tel.replace(/\D/g,''); if(clean.startsWith('0')) clean='90'+clean.substring(1); if(clean.length===10) clean='90'+clean; let detay=sepet.map(t=>`- ${t.urun} RAL ${t.ral} - ${t.adet} Adet = ${fmt(t.kovaKdv*t.adet)}`).join('\n'); let mesaj=`Merhaba ${must},\n\nTeklif:\n${detay}`; window.open(`https://api.whatsapp.com/send?phone=${clean}&text=${encodeURIComponent(mesaj)}`,'_blank');}
function yazdir(){if(sepet.length===0){alert('Bos');return} let must=document.getElementById('musteriAd').value||'Musteri'; let rows=sepet.map(t=>`<tr><td>RAL ${t.ral}</td><td>${t.urun}</td><td>${t.adet}x${t.lt}LT</td><td>${fmt(t.kovaKdv)}</td><td>${fmt(t.kovaKdv*t.adet)}</td></tr>`).join(''); let w=window.open('','_blank'); w.document.write(`<html><head><meta charset='UTF-8'><title>Teklif</title></head><body><h2>FIYAT TEKLIF FORMU - ${must}</h2><table border='1' style='width:100%;border-collapse:collapse'><tr><th>RENK</th><th>URUN</th><th>MIKTAR</th><th>BIRIM</th><th>TOPLAM</th></tr>${rows}</table><br><button onclick='window.print()'>YAZDIR / PDF</button></body></html>`); w.document.close();}
function waPdfGonder(){yazdir();}
function renderSik(){let extra = (typeof sikBirlesik!=='undefined' && sikBirlesik.length>0) ? sikBirlesik : JSON.parse(localStorage.getItem('jotun_kayitlar_extra')||'[]'); let box=document.getElementById('sikBox'); document.getElementById('sikSay').innerText=extra.length; if(extra.length===0){box.innerHTML='<div style="padding:8px;font-size:11px;color:#666">Kayıtlı ürün yok.<br>Sebep: Eski kayıtlar telefona / eski bulut linkine bağlıydı, adres değişince gelmiyor.<br>Bir ürün seçip SIK A KAYDET e bas, bundan sonra bu telefonda saklanacak.</div>'; return;} box.innerHTML=extra.slice(0,20).map((k,i)=>{let hex=getRalHex(k.ral_no); return `<div class='sikCard' onclick='selectSik(${i})'><div class='sikTop' style='background:${hex}'>${k.ral_no}</div><div class='sikBody'>${(k.product||'').substring(0,10)}</div></div>`}).join('');}
function selectSik(i){let extra = (typeof sikBirlesik!=='undefined' && sikBirlesik.length>0) ? sikBirlesik : JSON.parse(localStorage.getItem('jotun_kayitlar_extra')||'[]'); let k=extra[i]; if(!k) return; tempRal=k.ral_no; document.getElementById('ralInput').value=k.ral_no; let r=ralList.find(x=>x.kod===k.ral_no); if(r){secHex=r.hex; secName=r.isim; let sw=document.getElementById('swatch'); sw.style.background=r.hex; sw.innerText='RAL '+r.kod;} let idx=urunler.findIndex(u=>u[0].trim().toUpperCase()===(k.product||'').trim().toUpperCase()); if(idx!==-1) selectUrun(idx); document.getElementById('pigment').value=k.colorant_cost||''; document.getElementById('ralForm').value=k.formul||''; calc();}
function kaydet(){if(!son) return alert('Once sec'); let k={ral_no:son.ral||tempRal,ral_isim:son.isim,product:son.urun,lt:son.lt,colorant_cost:document.getElementById('pigment').value||'0',formul:document.getElementById('ralForm').value||''}; let extra=JSON.parse(localStorage.getItem('jotun_kayitlar_extra')||'[]'); extra=extra.filter(x=>!(String(x.ral_no)===String(k.ral_no)&&x.product===k.product)); extra.push(k); localStorage.setItem('jotun_kayitlar_extra',JSON.stringify(extra)); sikBirlesik=extra; renderSik(); alert('Sik kullanilanlara kaydedildi');}
function teklifKaydet(){if(sepet.length===0){alert('Sepet bos'); return;} let kayitli=JSON.parse(localStorage.getItem('jotun_teklifler')||'[]'); let haric=0,dahil=0; sepet.forEach(t=>{haric+=t.kovaTl*t.adet; dahil+=t.kovaKdv*t.adet;}); let yeni={id:Date.now(),tarih:document.getElementById('tarih').value||new Date().toISOString().slice(0,10),musteri:document.getElementById('musteriAd').value||'Musteri',tel:document.getElementById('musteriTel').value||'',adres:document.getElementById('musteriAdres').value||'',sepet:JSON.parse(JSON.stringify(sepet)),toplamHaric:haric,toplamDahil:dahil}; kayitli.unshift(yeni); localStorage.setItem('jotun_teklifler',JSON.stringify(kayitli)); alert('Teklif kaydedildi: '+yeni.musteri); renderKayitliTeklifler();}
function renderKayitliTeklifler(){let kayitli=JSON.parse(localStorage.getItem('jotun_teklifler')||'[]'); let box=document.getElementById('kayitliTeklifler'); if(!box) return; if(kayitli.length===0){box.innerHTML=''; return;} box.innerHTML='<b style="font-size:11px">KAYDEDİLEN TEKLİFLER ('+kayitli.length+')</b>'+kayitli.map((k,i)=>{let tarihStr=k.tarih?new Date(k.tarih).toLocaleDateString('tr-TR'):''; return `<div class='kayitliCard'><div style='display:flex;justify-content:space-between'><div><b>${k.musteri}</b><br><span style='font-size:10px'>${tarihStr} - ${k.tel} - ${k.sepet.length} urun - ${fmt(k.toplamDahil||0)}</span><br><span style='font-size:9px'>${k.adres}</span></div><div style='display:flex;gap:4px'><button onclick='teklifYukle(${i})' style='background:#00C853;color:#fff;border:none;border-radius:4px;padding:6px 8px'>AÇ</button><button onclick='teklifSil(${i})' style='background:#E53935;color:#fff;border:none;border-radius:4px;padding:6px 8px'>SİL</button></div></div></div>`}).join('');}
function teklifYukle(i){let kayitli=JSON.parse(localStorage.getItem('jotun_teklifler')||'[]'); let k=kayitli[i]; if(!k) return; document.getElementById('musteriAd').value=k.musteri; document.getElementById('musteriTel').value=k.tel; document.getElementById('musteriAdres').value=k.adres; if(k.tarih) document.getElementById('tarih').value=k.tarih; sepet=JSON.parse(JSON.stringify(k.sepet)); localStorage.setItem('teklif_sepet',JSON.stringify(sepet)); renderTeklif(); window.scrollTo({top:0,behavior:'smooth'});}
function teklifSil(i){if(!confirm('Silinsin mi?')) return; let kayitli=JSON.parse(localStorage.getItem('jotun_teklifler')||'[]'); kayitli.splice(i,1); localStorage.setItem('jotun_teklifler',JSON.stringify(kayitli)); renderKayitliTeklifler();}
loadAll();
document.addEventListener('click',e=>{if(!e.target.closest('.rb') && !e.target.closest('#ralDrop')){let el=document.getElementById('ralDrop'); if(el) el.style.display='none'} if(!e.target.closest('.sb') && !e.target.closest('#urunDrop')){let u=document.getElementById('urunDrop'); if(u) u.style.display='none'}});
</script></body></html>
