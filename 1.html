<!-- === JOTUN DUZELTME - LITRE FIYATI + 8 DOLAR HATASI === -->
<script>
(function(){
  // 1) norm: BASE numarasini ARTIK SILME
  function normFix(s){
    let u=(s||'').toUpperCase();
    u=u.replace(/\(.*?LT.*?\)/gi,'');
    u=u.replace(/COMP\.?\s*[AB]/gi,'');
    u=u.replace(/[^A-Z0-9 ]/g,' ');
    u=u.replace(/\s+/g,' ').trim();
    return u;
  }
  try{ norm = normFix; }catch(e){}
  window.norm = normFix;

  // 2) findExactPrice: Baska BASE'in fiyatini ALMA
  function findExactPriceFix(productName){
    let up=productName.trim().toUpperCase();
    let ex=urunler.find(u=>u[0].trim().toUpperCase()===up);
    if(ex && ex[1]>0) return ex[1];
    let lt=parseLT(productName);
    let n=normFix(productName);
    let same=urunler.filter(u=>normFix(u[0])===n && u[1]>0);
    if(same.length){
      if(lt>0){
        let sameLT=same.find(u=>Math.abs(parseLT(u[0])-lt)<0.1);
        if(sameLT) return sameLT[1];
      }
      return same[0][1];
    }
    return null;
  }
  try{ findExactPrice = findExactPriceFix; }catch(e){}
  window.findExactPrice = findExactPriceFix;

  // 3) findCompPair: Ayni BASE'in B'sini bul
  function findCompPairFix(name){
    let up=name.toUpperCase().trim();
    let n=normFix(name);
    if(!n) return null;
    let setLT=getSetLT(name);
    let myLT=parseLT(name);
    let all=urunler.map((u,i)=>({ad:u[0], fiyat:u[1], parsed:parseLT(u[0]), i, setLT:getSetLT(u[0])}));
    let sameFamily=all.filter(o=>o.ad.toUpperCase().trim()!==up && normFix(o.ad)===n);
    if(!sameFamily.length) return null;
    let wantB=isCompA(name), wantA=isCompB(name), isBase=!isComp(name);
    let cands=sameFamily;
    if(wantB) cands=cands.filter(o=>isCompB(o.ad));
    else if(wantA) cands=cands.filter(o=>isCompA(o.ad));
    else if(isBase) cands=cands.filter(o=>isCompB(o.ad));
    if(!cands.length) return null;
    cands.forEach(o=>{
      o.score=0;
      if(o.setLT!==setLT) o.score+=100;
      if(myLT>0 && o.parsed>0){
        o.score+=Math.abs((myLT+o.parsed)-setLT)*10;
        if(setLT===18 && o.parsed>=1.4 && o.parsed<=2.2) o.score-=5;
        if(setLT===20 && o.parsed>=1.8 && o.parsed<=2.5) o.score-=5;
      }
    });
    cands.sort((a,b)=>a.score-b.score);
    let best=cands[0];
    if(!best) return null;
    return {ad:best.ad, lt:best.parsed||trueLTFromSet(best.ad), fiyat:best.fiyat, i:best.i, parsed:best.parsed, setLT:best.setLT};
  }
  try{ findCompPair = findCompPairFix; }catch(e){}
  window.findCompPair = findCompPairFix;

  // 4) calc: LITRE FIYATI icin agirlikli ortalama
  function calcFix(){
    if(secUrun===null) return;
    let u=urunler[secUrun];
    let fiyatD=parsePrice(u[1]);
    let kLT=parseFloat(secLT)||18;
    let kur=parseFloat((document.getElementById('setDolar').value||'49,7891').replace(',','.'))||49.7891;
    let kar=parseFloat(document.getElementById('setKar').value)||25;
    let kdv=parseFloat(document.getElementById('setKdv').value)||20;
    let pigTL=(function(v){let s=String(v||'0').trim().replace(/[^0-9,\.\-]/g,'');if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(',','.');}let n=parseFloat(s);return isNaN(n)?0:n;})(document.getElementById('pigment').value)||0;
    try{let pe=document.getElementById('pigment'); if(pe && document.activeElement!==pe && pigTL>0){pe.value=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(pigTL);}}catch(e){}
    let setLT=getSetLT(u[0]);
    let aLT=parseLT(u[0])||trueLTFromSet(u[0]);
    // Pair'i once bul - yoksa tek urun gibi hesapla
    if(!secCompPair) secCompPair=findCompPair(u[0]);
    let bLT=secCompPair ? secCompPair.lt : 0;
    let bFiyat=secCompPair ? parsePrice(secCompPair.fiyat) : 0;
    let isCompMode=secCompPair ? true : false;
    // LITRE FIYATI DUZELTMESI:
    // Eski: urunLT = fiyatD * kur (sadece A)
    // Yeni: (A* A_LT + B* B_LT) / setLT * kur
    let ortFiyatD=fiyatD;
    if(isCompMode && bLT>0 && setLT>0){
      ortFiyatD=(fiyatD*aLT + bFiyat*bLT)/setLT;
    }
    let urunLT=ortFiyatD*kur;
    let toplamLT=urunLT+pigTL/18;
    let ltSatis=toplamLT*(1+kar/100);
    let toplamSetLT=isCompMode ? setLT : kLT;
    let kovaS=ltSatis*toplamSetLT;
    let kovaK=kovaS*(1+kdv/100);
    son={urun:u[0],ral:tempRal,hex:secHex,isim:secName,lt:kLT,gercekLT:aLT,toplamSetLT:toplamSetLT,setLT:setLT,isCompMode:isCompMode,compBLT:bLT,kovaTl:kovaS,kovaKdv:kovaK,ltSatis:ltSatis,form:document.getElementById('ralForm').value, pair: secCompPair ? {...secCompPair, lt: secCompPair.lt, setLT:setLT} : null};
    sonHesap={kur:kur,kar:kar,kdv:kdv,pigment:pigTL,urunDolar:ortFiyatD,urunTL:urunLT,toplamLT:toplamLT,ltSatis:ltSatis,toplamSetLT:toplamSetLT,setLT:setLT};
    document.getElementById('maliyet').innerText=fmt(toplamLT);
    document.getElementById('ltSatis').innerText=fmt(ltSatis);
    document.getElementById('kovaLabel').innerText=isCompMode?`SET (${toplamSetLT}LT)`:`KOVA (${kLT}LT)`;
    document.getElementById('kova').innerText=fmt(kovaS);
    document.getElementById('kovaKdv').innerText=fmt(kovaK);
    let detayBox=document.getElementById('hesapDetay');
    detayBox.style.display='block';
    let compDetay=son.pair?`<br><b>SET ${setLT}LT:</b> A ${aLT}LT $${fiyatD} | B ${bLT}LT $${bFiyat} | Ort $${ortFiyatD.toFixed(2)}`:`<br>Tek urun $${fiyatD}/LT`;
    detayBox.innerHTML=`${u[0]} Ort $${ortFiyatD.toFixed(2)} x ${kur.toFixed(2)} = ${fmt(urunLT)} | ${fmt(ltSatis)} x ${toplamSetLT}LT = ${fmt(kovaS)}${compDetay}`;
  }
  try{ calc = calcFix; }catch(e){}
  window.calc = calcFix;
  console.log('DUZELTME AKTIF: BASE eslesme + litre agirlikli ortalama');
})();
</script>
